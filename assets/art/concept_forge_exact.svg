 <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b2118"/><stop offset=".42" stop-color="#180d0b"/><stop offset=".7" stop-color="#5c2e16"/><stop offset="1" stop-color="#100908"/></linearGradient>
