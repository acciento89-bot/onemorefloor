name: 99.9 Premium IAP Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-premium-iap-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  BUNDLE_ID: de.kamilunavo.ninenine

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"pending",description:"Diagnosing Apple IAP conflict",target_url:$u,context:"99-9/iap-diagnostic"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Prepare token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Inspect catalog and creation response
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          APPS=$(curl -fsSL -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          test -n "$APP_ID"
          PRODUCTS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")
          echo 'Existing IAP catalog:'
          jq -c '.data[]? | {id, productId:.attributes.productId, name:.attributes.name, state:.attributes.state, type:.attributes.inAppPurchaseType}' <<<"$PRODUCTS"

          SKU='de.kamilunavo.ninenine.theme.neon'
          EXISTING=$(jq -r --arg sku "$SKU" '.data[]? | select(.attributes.productId==$sku) | .id' <<<"$PRODUCTS" | head -1)
          if [[ -n "$EXISTING" ]]; then
            echo "Neon already exists as $EXISTING"
            exit 0
          fi

          BODY=$(jq -n --arg app "$APP_ID" --arg sku "$SKU" '{data:{type:"inAppPurchases",attributes:{name:"Nine Nine Neon Pulse",productId:$sku,inAppPurchaseType:"NON_CONSUMABLE",reviewNote:"Permanently unlocks the Neon Pulse cosmetic design in 99.9%.",availableInAllTerritories:true},relationships:{app:{data:{type:"apps",id:$app}}}}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' "$API/v2/inAppPurchases" -d "$BODY")
          echo "HTTP $CODE"
          jq . "$RUNNER_TEMP/resp.json" || cat "$RUNNER_TEMP/resp.json"
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then exit 1; fi

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"success",description:"Apple IAP diagnostic completed",target_url:$u,context:"99-9/iap-diagnostic"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"failure",description:"Apple IAP diagnostic found API error",target_url:$u,context:"99-9/iap-diagnostic"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
