name: Raster Reference v1.8 Check

on:
  push:
    branches:
      - agent/v1.8-raster-reference-skin
      - main
  pull_request:

jobs:
  raster-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Parse v1.8 renderer
        run: |
          ./godot --headless --path . --script res://scripts/main_v20.gd --check-only
          ./godot --headless --path . --script res://scripts/v20_smoke_test.gd --check-only

      - name: Validate raster payload size
        run: |
          set -euo pipefail
          chars=$(cat assets/art/reference/home_*.b64 | tr -d '\r\n' | wc -c | tr -d ' ')
          test "$chars" = "59344"

      - name: Import project
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee raster-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" raster-import.log; then
            exit 1
          fi

      - name: Run v1.8 raster reference regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v20_smoke_test.gd --quit-after 120 | tee raster-v20.log
          grep -q "ONE MORE FLOOR v1.8 raster reference smoke test passed" raster-v20.log
