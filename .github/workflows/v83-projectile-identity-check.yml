name: v1.63 Projectile Identity Check

on:
  push:
    branches:
      - agent/v1.63-combat-identity
    paths:
      - 'scripts/world3d_chamber_v163_projectile_identity.gd'
      - 'scripts/main_v82.gd'
      - 'scripts/v83_projectile_identity_smoke_test.gd'
      - 'scripts/v83_projectile_identity_capture.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v83-projectile-identity-check.yml'
  pull_request:
    paths:
      - 'scripts/world3d_chamber_v163_projectile_identity.gd'
      - 'scripts/main_v82.gd'
      - 'scripts/v83_projectile_identity_smoke_test.gd'
      - 'scripts/v83_projectile_identity_capture.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v83-projectile-identity-check.yml'

permissions:
  contents: read

jobs:
  validate-projectile-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Compile v1.63 projectile identity
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee v163-r1-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Shader error|Failed to load script|Failed loading resource" v163-r1-import.log; then
            echo "Godot reported v1.63 projectile identity compile/import errors"
            exit 1
          fi

      - name: Validate v1.63 projectile identity contract
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v83_projectile_identity_smoke_test.gd --quit-after 300 2>&1 | tee v163-r1-smoke.log
          grep -q "v1.63 projectile identity r1 smoke test passed" v163-r1-smoke.log

      - name: Preserve frozen inherited projectile baseline
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v82_projectile_baseline_smoke_test.gd --quit-after 260 2>&1 | tee v163-baseline-smoke.log
          grep -q "v1.63 projectile visual baseline smoke test passed" v163-baseline-smoke.log

      - name: Preserve v1.61 r3.2 combat presentation
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v75_combat_presentation_r32_smoke_test.gd --quit-after 260 2>&1 | tee v161-r32.log
          grep -q "v1.61 combat presentation r3.2 smoke test passed" v161-r32.log

      - name: Render frozen baseline comparison
        run: |
          set -o pipefail
          rm -rf artifacts/v163_projectile_baseline
          mkdir -p artifacts/v163_projectile_baseline
          xvfb-run -a ./godot --path . --script res://scripts/v82_projectile_baseline_capture.gd --quit-after 300 2>&1 | tee v163-baseline-capture.log
          grep -q "v1.63 projectile gameplay baseline capture passed" v163-baseline-capture.log

      - name: Render v1.63 r1 projectile identity
        run: |
          set -o pipefail
          rm -rf artifacts/v163_projectile_identity
          mkdir -p artifacts/v163_projectile_identity
          xvfb-run -a ./godot --path . --script res://scripts/v83_projectile_identity_capture.gd --quit-after 300 2>&1 | tee v163-r1-capture.log
          grep -q "v1.63 projectile identity r1 visual capture passed" v163-r1-capture.log
          test -s artifacts/v163_projectile_identity/r1_player_projectiles.png
          test -s artifacts/v163_projectile_identity/r1_enemy_projectiles.png
          test -s artifacts/v163_projectile_identity/r1_mixed_projectiles.png

      - name: Upload v1.63 before/after projectile gate
        uses: actions/upload-artifact@v4
        with:
          name: v83-projectile-identity-before-after
          path: |
            artifacts/v163_projectile_baseline/*.png
            artifacts/v163_projectile_identity/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Preserve v1.62 r3 UI contract
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v80_ui_runtime_cta_smoke_test.gd --quit-after 260 2>&1 | tee v162-r3-ui.log
          grep -q "v1.62 UI foundation r3 runtime CTA smoke test passed" v162-r3-ui.log

      - name: Preserve v1.52.1 input flow
        env:
          OMF_V66_SCENARIO: all
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v66_input_flow_smoke_test.gd --quit-after 260 2>&1 | tee v66-input.log
          grep -q "v1.52.1 tutorial/game-over input-flow smoke test passed" v66-input.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v83-projectile-identity-failure-logs
          path: |
            v163-r1-import.log
            v163-r1-smoke.log
            v163-baseline-smoke.log
            v161-r32.log
            v163-baseline-capture.log
            v163-r1-capture.log
            v162-r3-ui.log
            v66-input.log
          if-no-files-found: ignore
