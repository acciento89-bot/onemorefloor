name: Kamilunavo Trace Build 9 Processing Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kamilunavo-trace-testflight-build9-icon-bridge.yml'

permissions:
  contents: read

concurrency:
  group: kamilunavo-trace-build9-processing-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: 'de.kamilunavo.trace'
  BUILD_NUMBER: '9'

jobs:
  verify-processing:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify Kamilunavo Trace Build 9 processing state
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/asc_jwt.rb" <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          def b64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          header = b64url(JSON.generate({alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT'}))
          payload = b64url(JSON.generate({iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 600, aud: 'appstoreconnect-v1'}))
          signing_input = "#{header}.#{payload}"
          sequence = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, signing_input))
          raw_signature = sequence.value.map { |integer| [integer.value.to_i.to_s(16).rjust(64, '0')].pack('H*') }.join
          puts "#{signing_input}.#{b64url(raw_signature)}"
          RUBY

          JWT=$(ruby "$RUNNER_TEMP/asc_jwt.rb")
          AUTH="Authorization: Bearer $JWT"
          APP_JSON="$RUNNER_TEMP/trace-app.json"
          curl --fail --silent --show-error --get -H "$AUTH" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$APP_JSON"
          test "$(jq '.data | length' "$APP_JSON")" = 1
          APP_ID=$(jq -r '.data[0].id' "$APP_JSON")

          for ATTEMPT in $(seq 1 30); do
            OUT="$RUNNER_TEMP/trace-build9-processing.json"
            curl --fail --silent --show-error --get -H "$AUTH" \
              --data-urlencode "filter[app]=$APP_ID" \
              --data-urlencode "filter[version]=$BUILD_NUMBER" \
              --data-urlencode 'filter[preReleaseVersion.version]=0.1.0' \
              --data-urlencode 'fields[builds]=version,processingState,uploadedDate' \
              'https://api.appstoreconnect.apple.com/v1/builds' -o "$OUT"

            COUNT=$(jq '.data | length' "$OUT")
            if [[ "$COUNT" != 0 ]]; then
              STATE=$(jq -r '.data[0].attributes.processingState' "$OUT")
              UPLOADED=$(jq -r '.data[0].attributes.uploadedDate' "$OUT")
              echo "Build 9 processing attempt $ATTEMPT: $STATE (uploaded $UPLOADED)"
              if [[ "$STATE" == 'VALID' ]]; then
                echo "Kamilunavo Trace 0.1.0 (9): processingState=VALID; uploadedDate=$UPLOADED" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [[ "$STATE" == 'FAILED' || "$STATE" == 'INVALID' ]]; then
                jq -r '.data[0].attributes' "$OUT"
                exit 1
              fi
            else
              echo "Build 9 not visible yet (attempt $ATTEMPT)."
            fi
            sleep 20
          done

          echo 'Build 9 was not observed as VALID within the bounded processing window.'
          exit 1

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
