name: Family Life OS Finish App Review v3

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  APP_ID: '6803079524'
  VERSION_ID: 'e7a061e3-bd05-453c-a911-00e1e8cb4f76'
  VLOC_ID: '557ca16e-28b4-44d0-83ec-11d8890f0376'
  REVIEW_SUBMISSION_ID: '3b4e487e-d776-471e-abff-0fae824a72cd'

jobs:
  finish:
    name: Attach Build 8 and submit 1.0
    if: github.head_ref == 'family-finalizer-trigger-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: App Store Connect auth
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Attach exact Build 8
        id: build
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BUILDS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds?filter%5Bapp%5D=$APP_ID&filter%5Bversion%5D=8&sort=-uploadedDate&limit=10")
          echo "Build-8 candidates: $(jq '.data|length' <<<"$BUILDS")"
          BUILD_ID=$(jq -r '.data[0].id // empty' <<<"$BUILDS")
          test -n "$BUILD_ID"
          BUILD=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds/$BUILD_ID")
          ACTUAL=$(jq -r '.data.attributes.version // empty' <<<"$BUILD")
          PROCESSING=$(jq -r '.data.attributes.processingState // empty' <<<"$BUILD")
          echo "Selected Build: id=$BUILD_ID version=$ACTUAL processing=$PROCESSING"
          test "$ACTUAL" = '8'
          test "$PROCESSING" = 'VALID'
          REL=$(jq -n --arg id "$BUILD_ID" '{data:{type:"builds",id:$id}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/attach.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$REL" "$BASE/v1/appStoreVersions/$VERSION_ID/relationships/build")
          echo "Attach Build 8 HTTP $CODE"
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then cat "$RUNNER_TEMP/attach.json"; exit 1; fi
          VERSION=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersions/$VERSION_ID?include=build")
          ATTACHED=$(jq -r '.included[]? | select(.type=="builds") | .attributes.version' <<<"$VERSION" | head -1)
          echo "Attached build version: $ATTACHED"
          test "$ATTACHED" = '8'
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded iPad Pro screenshot
        id: screenshot
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SETS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersionLocalizations/$VLOC_ID/appScreenshotSets?limit=50")
          jq -r '.data[]? | [.id,.attributes.screenshotDisplayType] | @tsv' <<<"$SETS"
          SET_ID=$(jq -r '.data[]? | select(.attributes.screenshotDisplayType=="APP_IPAD_PRO_3GEN_129") | .id' <<<"$SETS" | head -1)
          if [[ -z "$SET_ID" ]]; then SET_ID=$(jq -r '.data[]? | select(.attributes.screenshotDisplayType | contains("IPAD")) | .id' <<<"$SETS" | head -1); fi
          test -n "$SET_ID"
          SHOTS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appScreenshotSets/$SET_ID/appScreenshots?limit=50")
          jq -r '.data[]? | [.attributes.fileName,.attributes.assetDeliveryState.state] | @tsv' <<<"$SHOTS"
          COMPLETE=$(jq '[.data[]? | select(.attributes.assetDeliveryState.state=="COMPLETE")] | length' <<<"$SHOTS")
          test "$COMPLETE" -ge 1
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"

      - name: Add App 1.0 to Family Pro review package
        id: add
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SID="$REVIEW_SUBMISSION_ID"
          SUB=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$SUB")
          echo "Submission state before app linkage: $STATE"
          test "$STATE" = 'READY_FOR_REVIEW'
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          echo "Items before: $(jq '.data|length' <<<"$ITEMS")"
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          if [[ "$HAVE" -eq 0 ]]; then
            BODY=$(jq -n --arg sid "$SID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            CODE=$(curl -sS -o "$RUNNER_TEMP/add.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems")
            echo "Add App 1.0 HTTP $CODE"
            if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then
              jq '{errors:[.errors[]? | {status,code,title,detail,source}]}' "$RUNNER_TEMP/add.json" | tee "$RUNNER_TEMP/add-safe.json"
              exit 1
            fi
          fi
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          echo "Items after: $(jq '.data|length' <<<"$ITEMS") / appVersion=$HAVE"
          test "$HAVE" -ge 1

      - name: Report linkage blocker
        if: steps.add.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Family Life OS – Apple blockiert nur noch die Review-Verknüpfung'
            echo
            echo '- **Build 8** ist jetzt an Version 1.0 angehängt.'
            echo '- **iPad-Pro-Screenshot** ist hochgeladen und `COMPLETE`.'
            echo '- App Store Connect meldet beim Review-Paket:'
            echo '```json'
            cat "$RUNNER_TEMP/add-safe.json" 2>/dev/null || echo '{"error":"Review submission is not READY_FOR_REVIEW"}'
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment 149 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          exit 1

      - name: Submit to Apple
        id: submit
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BODY=$(jq -n --arg id "$REVIEW_SUBMISSION_ID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/submit.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$REVIEW_SUBMISSION_ID")
          echo "Final submit HTTP $CODE"
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then
            jq '{errors:[.errors[]? | {status,code,title,detail,source}]}' "$RUNNER_TEMP/submit.json" | tee "$RUNNER_TEMP/submit-safe.json"
            exit 1
          fi
          FINAL=''
          for i in {1..30}; do
            sleep 4
            R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$REVIEW_SUBMISSION_ID")
            FINAL=$(jq -r '.data.attributes.state // empty' <<<"$R")
            echo "Apple Review state: $FINAL"
            case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
          done
          case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) ;; *) exit 1 ;; esac
          echo "state=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Report submit blocker
        if: failure() && steps.add.outcome == 'success' && steps.submit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Family Life OS – letzter Apple-Submit-Validator'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/submit-safe.json" 2>/dev/null || echo '{"error":"Apple hat den Review-Status nicht umgestellt"}'
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment 149 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Confirm success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 149 --repo "$GITHUB_REPOSITORY" --body "### Family Life OS 1.0 vollständig eingereicht ✅\n\nBuild **8** ist zugewiesen, der **iPad-Pro-Screenshot** ist verarbeitet, App 1.0 ist im Family-Pro-Review-Paket und Apple steht auf **${{ steps.submit.outputs.state }}**."
