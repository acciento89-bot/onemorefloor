name: Combat Production v1.38 Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v51.gd'
      - 'scripts/v51_combat_production_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v51-combat-production-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v51.gd'
      - 'scripts/v51_combat_production_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v51-combat-production-check.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.1'
  GODOT_TAG: '4.7.1-stable'

jobs:
  validate-v51:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Parse v1.38 runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Run v1.38 combat production smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v51_combat_production_smoke_test.gd
