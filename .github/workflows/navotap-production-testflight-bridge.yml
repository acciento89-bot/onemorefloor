name: NavoTap Production TestFlight Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/navotap-production-testflight-bridge.yml'

permissions:
  contents: read

concurrency:
  group: navotap-production-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'com.kamilunavo.onemoretap'
  MARKETING_VERSION: '1.0'
  BUILD_NUMBER: '6'
  SOURCE_REF: 'd78e02e87d592004f3d36797d2eea925116899c6'

jobs:
  upload-navotap-production:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout locked NavoTap source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/onemoretap
          ref: ${{ env.SOURCE_REF }}
          path: navotap

      - name: Verify protected App Store Connect secrets
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Validate locked production source and source icon
        working-directory: navotap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          python3 -m json.tool OneMoreTap/Resources/NavoTap.storekit >/dev/null
          plutil -lint OneMoreTap/Resources/Info.plist
          plutil -lint OneMoreTap.xcodeproj/project.pbxproj
          bash ci/check-app-icon.sh OneMoreTap/Assets.xcassets/AppIcon.appiconset/AppIcon.png source
          grep -q 'ca-app-pub-8944085355624754~4792390111' OneMoreTap/Resources/Info.plist
          grep -q 'ca-app-pub-8944085355624754/7162618768' OneMoreTap/Monetization/AdService.swift
          grep -q 'ca-app-pub-8944085355624754/3694930864' OneMoreTap/Monetization/AdService.swift
          grep -q '#if NAVOTAP_TEST_ADS' OneMoreTap/Monetization/AdService.swift
          grep -q 'om.kamilunavo.onemoretap.theme.fire' OneMoreTap/Monetization/ThemeCatalog.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.kamilunavo.onemoretap;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 1.0;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 6;' OneMoreTap.xcodeproj/project.pbxproj
          if grep -n 'NAVOTAP_TEST_ADS' OneMoreTap.xcodeproj/project.pbxproj; then
            echo '::error title=Production guard::NAVOTAP_TEST_ADS must not be present in Xcode build settings'
            exit 1
          fi
          echo '✓ Locked NavoTap source is release 1.0 (6), corrected AppIcon, production AdMob defaults'

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify NavoTap App Store Connect record
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v) = Base64.urlsafe_encode64(v, padding: false)
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          RESPONSE="$RUNNER_TEMP/navotap-app-record.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$RESPONSE"
          test "$(jq '.data | length' "$RESPONSE")" -ge 1

      - name: Create unsigned NavoTap production Release archive
        working-directory: navotap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NavoTap.xcarchive"
          xcodebuild \
            -project OneMoreTap.xcodeproj \
            -scheme NavoTap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -d "$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"

      - name: Verify production archive identity, icon and ad IDs
        working-directory: navotap
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"

          ICON_COUNT=0
          while IFS= read -r ICON; do
            [ -n "$ICON" ] || continue
            ICON_COUNT=$((ICON_COUNT + 1))
            bash ci/check-app-icon.sh "$ICON" "archive:$ICON"
          done < <(find "$APP" -maxdepth 1 -type f -name 'AppIcon*.png' | sort)
          test "$ICON_COUNT" -gt 0 || { echo '::error title=AppIcon production guard::No compiled AppIcon PNG found'; exit 1; }

          if grep -R -a -n 'ca-app-pub-3940256099942544/1712485313\|ca-app-pub-3940256099942544/4411468910' "$APP"; then
            echo '::error title=Production guard::Google sample/test ad unit ID is present in the archived app bundle'
            exit 1
          fi
          grep -R -a -q 'ca-app-pub-8944085355624754/7162618768' "$APP"
          grep -R -a -q 'ca-app-pub-8944085355624754/3694930864' "$APP"
          echo "✓ Production archive = $BUNDLE_ID $MARKETING_VERSION ($BUILD_NUMBER); $ICON_COUNT compiled AppIcons passed; production AdMob IDs only"

      - name: Remove ad-hoc signatures from embedded Google frameworks
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"
          for FRAMEWORK in GoogleMobileAds.framework UserMessagingPlatform.framework; do
            BUNDLE="$APP/Frameworks/$FRAMEWORK"
            test -d "$BUNDLE"
            codesign --remove-signature "$BUNDLE"
            rm -rf "$BUNDLE/_CodeSignature"
            if codesign -d "$BUNDLE" >/dev/null 2>&1; then
              echo "::error title=Signature cleanup::$FRAMEWORK still has a code signature"
              exit 1
            fi
          done

      - name: Create App Store Connect export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export and upload NavoTap production build with Apple cloud signing
        id: upload
        shell: bash
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          rm -rf "$RUNNER_TEMP/NavoTapProductionExport"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            -exportPath "$RUNNER_TEMP/NavoTapProductionExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee diagnostics/TestFlight-export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          grep -Ei 'upload|uploaded|success|error:|failed|failure' diagnostics/TestFlight-export.log | tail -120 || true
          exit 0

      - name: Upload bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navotap-1.0-build6-production-bridge-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Require successful Apple upload
        if: steps.upload.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Mark successful production TestFlight handoff
        if: steps.upload.outputs.status == '0'
        shell: bash
        run: echo 'NavoTap 1.0 (6) production build handed to TestFlight after compiled AppIcon integrity validation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
