name: Trigger ONE MORE FLOOR TestFlight

on:
  push:
    branches:
      - main
    paths:
      - '.github/testflight-trigger'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-testflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger metadata
        uses: actions/checkout@v5

      - name: Read requested TestFlight build
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          BUILD=$(awk -F= '$1 == "build" { print $2 }' .github/testflight-trigger | tail -1 | tr -d '[:space:]')
          if [[ ! "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number in .github/testflight-trigger: '$BUILD'"
            exit 1
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Dispatching requested TestFlight build $BUILD"

      - name: Dispatch iOS TestFlight workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_BUILD: ${{ steps.trigger.outputs.build }}
        run: |
          set -euo pipefail
          gh workflow run ios-testflight.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --raw-field "build=${TESTFLIGHT_BUILD}"
