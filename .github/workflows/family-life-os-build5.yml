name: Family Life OS Build 9 App Store

on:
  push:
    branches:
      - agent/family-life-os-build9-review-fix
    paths:
      - '.github/workflows/family-life-os-build5.yml'

permissions:
  contents: read

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  APP_ID: '6803079524'
  VERSION_ID: 'e7a061e3-bd05-453c-a911-00e1e8cb4f76'
  BUILD_NUMBER: '9'
  MARKETING_VERSION: '0.1.0'
  SOURCE_REF: '2ba436c7009c5097d3000a2b3849d9b596f9bbbd'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout Family Life OS review fix
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.SOURCE_REF }}
          path: appideenchatgpt

      - name: Verify pinned App Review fixes
        working-directory: appideenchatgpt
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "Pinned Family Life OS source: $ACTUAL" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$ACTUAL" = "$SOURCE_REF"
          CAPTURE='apps/011-family-life-os/prototype/FamilyLifePrototype/Views/CaptureView.swift'
          SETTINGS='apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift'
          grep -F 'ReviewSafeVoiceCaptureModel' "$CAPTURE"
          grep -F 'AVAudioApplication.requestRecordPermission' "$CAPTURE"
          grep -F 'Terms of Use (EULA)' "$SETTINGS"
          grep -F 'https://www.apple.com/legal/internet-services/itunes/dev/stdeula/' "$SETTINGS"
          echo 'Guideline 2.1(a) recording fix and Guideline 3.1.2(c) EULA link are present.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve Swift packages
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project FamilyLifePrototype.xcodeproj -scheme FamilyLifePrototype -resolvePackageDependencies

      - name: Prepare App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive Build 9
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifePrototype.xcarchive"
          xcodebuild \
            -project FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive
          test -d "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Products/Applications/FamilyLifePrototype.app"

      - name: Export and upload Build 9
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          rm -rf "$RUNNER_TEMP/FamilyLifeBuild9Export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            -exportPath "$RUNNER_TEMP/FamilyLifeBuild9Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Prepare App Store Connect JWT
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          header=b(JSON.generate({alg:'ES256', kid:ENV.fetch('ASC_KEY_ID'), typ:'JWT'}))
          payload=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'), iat:now, exp:now+1200, aud:'appstoreconnect-v1'}))
          signing="#{header}.#{payload}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, signing))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{signing}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Wait for Build 9 and attach to version 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BUILD_ID=''
          STATE=''
          for i in $(seq 1 75); do
            BUILDS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds?filter%5Bapp%5D=$APP_ID&filter%5Bversion%5D=$BUILD_NUMBER&sort=-uploadedDate&limit=10")
            BUILD_ID=$(jq -r '.data[0].id // empty' <<<"$BUILDS")
            STATE=$(jq -r '.data[0].attributes.processingState // empty' <<<"$BUILDS")
            echo "Build $BUILD_NUMBER: id=${BUILD_ID:-pending} state=${STATE:-pending}"
            if [[ -n "$BUILD_ID" && "$STATE" == 'VALID' ]]; then break; fi
            if [[ "$STATE" == 'INVALID' || "$STATE" == 'FAILED' ]]; then exit 1; fi
            sleep 20
          done
          test -n "$BUILD_ID"
          test "$STATE" = 'VALID'
          BODY=$(jq -n --arg id "$BUILD_ID" '{data:{type:"builds",id:$id}}')
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $ASC_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "$BASE/v1/appStoreVersions/$VERSION_ID/relationships/build" >/dev/null
          echo "Family Life OS $MARKETING_VERSION ($BUILD_NUMBER) uploaded, processed VALID and attached to App Store version." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
