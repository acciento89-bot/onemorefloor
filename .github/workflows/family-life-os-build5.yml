name: Family Life OS Build 5 TestFlight

on:
  push:
    branches:
      - agent/family-life-os-build5
    paths:
      - '.github/workflows/family-life-os-build5.yml'

permissions:
  contents: read

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  BUILD_NUMBER: '5'
  SOURCE_REF: 'aff7cddf93388f5a1889ccc69e6868a1a14617a4'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Family Life OS release candidate
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.SOURCE_REF }}
          path: appideenchatgpt

      - name: Verify pinned release candidate
        working-directory: appideenchatgpt
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "Pinned Family Life OS source: $ACTUAL" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$ACTUAL" = "$SOURCE_REF"
          SERVICE='apps/011-family-life-os/prototype/FamilyLifePrototype/Data/CompleteV1Services.swift'
          MODELS='apps/011-family-life-os/prototype/FamilyLifePrototype/Domain/Models.swift'
          if grep -Eq 'FamilyProProductID|FamilyProRenewalState' "$SERVICE"; then
            echo 'Unexpected obsolete Family Pro helper symbols found in release candidate.' | tee -a "$GITHUB_STEP_SUMMARY"
            grep -En 'FamilyProProductID|FamilyProRenewalState' "$SERVICE" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          grep -En 'FamilyProPolicy' "$SERVICE" | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          grep -En 'enum FamilyProPolicy' "$MODELS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply Xcode 26 StoreKit isolation fix
        working-directory: appideenchatgpt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/011-family-life-os/prototype/FamilyLifePrototype/Data/CompleteV1Services.swift')
          text = path.read_text()
          old = '    private var transactionUpdatesTask: Task<Void, Never>?\n'
          new = '    @ObservationIgnored\n    nonisolated(unsafe) private var transactionUpdatesTask: Task<Void, Never>?\n'
          if old not in text:
              raise SystemExit('transactionUpdatesTask declaration not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          SERVICE='apps/011-family-life-os/prototype/FamilyLifePrototype/Data/CompleteV1Services.swift'
          grep -En -A2 -B2 'transactionUpdatesTask' "$SERVICE" | head -20 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve Swift packages
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        run: |
          set -euo pipefail
          xcodebuild -project FamilyLifePrototype.xcodeproj -scheme FamilyLifePrototype -resolvePackageDependencies

      - name: Prepare App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive Build 5
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifePrototype.xcarchive"
          xcodebuild \
            -project FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive
          test -d "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Products/Applications/FamilyLifePrototype.app"

      - name: Export and upload Build 5
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            -exportPath "$RUNNER_TEMP/FamilyLifeBuild5Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Mark success
        run: echo 'Family Life OS Build 5 uploaded to App Store Connect/TestFlight successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
