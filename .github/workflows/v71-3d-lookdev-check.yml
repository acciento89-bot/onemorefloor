name: v1.57 Production 3D Lookdev Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v71.gd'
      - 'scripts/menu3d_stage_v157.gd'
      - 'scripts/v71_3d_lookdev_smoke_test.gd'
      - '.github/workflows/v71-3d-lookdev-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v71.gd'
      - 'scripts/menu3d_stage_v157.gd'
      - 'scripts/v71_3d_lookdev_smoke_test.gd'
      - '.github/workflows/v71-3d-lookdev-check.yml'

permissions:
  contents: read

jobs:
  validate-production-lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and parse v1.57 baseline
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|glTF:.*ERROR" parse.log; then
            echo "Godot reported import/parse errors"
            exit 1
          fi

      - name: Validate v1.57 snapshot when v1.57 is active
        run: |
          set -o pipefail
          if grep -q 'path="res://scripts/main_v71.gd"' scenes/main.tscn; then
            ./godot --headless --path . --script res://scripts/v71_3d_lookdev_smoke_test.gd --quit-after 120 2>&1 | tee v71-lookdev.log
            grep -q "v1.57 production 3D lookdev smoke test passed" v71-lookdev.log
          else
            echo "A successor to v1.57 is active; fixed v1.57 camera/composition snapshot is intentionally superseded." | tee v71-lookdev.log
          fi

      - name: Re-run v1.56 full 3D presentation regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v70_full_3d_presentation_smoke_test.gd --quit-after 120 2>&1 | tee v70-presentation.log
          grep -q "v1.56 full 3D presentation smoke test passed" v70-presentation.log

      - name: Re-run v1.55 Wanderer regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v69_wanderer_production_smoke_test.gd --quit-after 120 2>&1 | tee v69-wanderer.log
          grep -q "v1.55 production Wanderer model takeover smoke test passed" v69-wanderer.log

      - name: Re-run v1.52.1 input-flow regression
        env:
          OMF_V66_SCENARIO: all
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v66_input_flow_smoke_test.gd --quit-after 120 2>&1 | tee v66-input-flow.log
          grep -q "v1.52.1 tutorial/game-over input-flow smoke test passed" v66-input-flow.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v71-production-lookdev-failure-logs
          path: |
            parse.log
            v71-lookdev.log
            v70-presentation.log
            v69-wanderer.log
            v66-input-flow.log
          if-no-files-found: ignore
