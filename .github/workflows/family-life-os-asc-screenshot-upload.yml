name: Family Life OS ASC Review Screenshot Upload

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-asc-screenshot-upload.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: family-life-os-asc-review-screenshot
  cancel-in-progress: true

env:
  MONTHLY_PRODUCT: de.kamilunavo.family.familypro.monthly
  MONTHLY_SID: '6804035272'
  ANNUAL_PRODUCT: de.kamilunavo.family.familypro.annual
  ANNUAL_SID: '6804035327'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Reuse verified Family Pro review screenshot
        uses: actions/download-artifact@v4
        with:
          name: family-pro-review-screenshot
          path: review
          repository: acciento89-bot/onemorefloor
          run-id: 32532251259
          github-token: ${{ github.token }}

      - name: Validate review screenshot
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=review/family-pro-review.png
          test -s "$IMAGE"
          WIDTH=$(sips -g pixelWidth "$IMAGE" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$IMAGE" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = '1206'
          test "$HEIGHT" = '2622'

      - name: Stage App Store Connect key
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create App Store Connect API token
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          def b64url(v); Base64.urlsafe_encode64(v, padding: false); end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Upload review screenshot to Monthly and Annual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asc-diagnostics
          IMAGE=review/family-pro-review.png
          FILE_NAME=$(basename "$IMAGE")
          FILE_SIZE=$(stat -f '%z' "$IMAGE")
          CHECKSUM=$(md5 -q "$IMAGE")

          for ROW in "$MONTHLY_PRODUCT|$MONTHLY_SID" "$ANNUAL_PRODUCT|$ANNUAL_SID"; do
            PRODUCT_ID=${ROW%%|*}
            SID=${ROW##*|}
            SAFE=$(echo "$PRODUCT_ID" | tr '.' '-')
            echo "product=$PRODUCT_ID sid=$SID" >> asc-diagnostics/stage.txt

            EXISTING_HTTP=$(curl --silent --show-error -w '%{http_code}' \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' \
              "https://api.appstoreconnect.apple.com/v1/subscriptions/${SID}/appStoreReviewScreenshot" \
              -o "asc-diagnostics/${SAFE}-existing.json")
            echo "existing=$EXISTING_HTTP" >> asc-diagnostics/stage.txt
            [[ "$EXISTING_HTTP" == '200' || "$EXISTING_HTTP" == '404' ]]

            if [[ "$EXISTING_HTTP" == '200' ]]; then
              EXISTING_ID=$(jq -r '.data.id // empty' "asc-diagnostics/${SAFE}-existing.json")
              EXISTING_STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "asc-diagnostics/${SAFE}-existing.json")
              if [[ -n "$EXISTING_ID" && "$EXISTING_STATE" == 'COMPLETE' ]]; then
                echo "$PRODUCT_ID already has COMPLETE screenshot $EXISTING_ID" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              if [[ -n "$EXISTING_ID" ]]; then
                DELETE_HTTP=$(curl --silent --show-error -w '%{http_code}' \
                  -H "Authorization: Bearer $ASC_TOKEN" -X DELETE \
                  "https://api.appstoreconnect.apple.com/v1/subscriptionAppStoreReviewScreenshots/${EXISTING_ID}" -o /dev/null)
                echo "delete=$DELETE_HTTP" >> asc-diagnostics/stage.txt
                [[ "$DELETE_HTTP" == '204' ]]
              fi
            fi

            CREATE_BODY=$(jq -n --arg fn "$FILE_NAME" --argjson fs "$FILE_SIZE" --arg sid "$SID" \
              '{data:{type:"subscriptionAppStoreReviewScreenshots",attributes:{fileName:$fn,fileSize:$fs},relationships:{subscription:{data:{type:"subscriptions",id:$sid}}}}}')
            printf '%s\n' "$CREATE_BODY" > "asc-diagnostics/${SAFE}-reservation-request.json"
            CREATE_HTTP=$(curl --silent --show-error -w '%{http_code}' \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -X POST -d "$CREATE_BODY" \
              'https://api.appstoreconnect.apple.com/v1/subscriptionAppStoreReviewScreenshots' \
              -o "asc-diagnostics/${SAFE}-reservation.json")
            echo "$CREATE_HTTP" > "asc-diagnostics/${SAFE}-reservation.status"
            [[ "$CREATE_HTTP" == '201' || "$CREATE_HTTP" == '200' ]]

            RID=$(jq -r '.data.id // empty' "asc-diagnostics/${SAFE}-reservation.json")
            test -n "$RID"
            OPS=$(jq '.data.attributes.uploadOperations | length' "asc-diagnostics/${SAFE}-reservation.json")
            test "$OPS" -gt 0

            for I in $(seq 0 $((OPS-1))); do
              METHOD=$(jq -r ".data.attributes.uploadOperations[$I].method" "asc-diagnostics/${SAFE}-reservation.json")
              URL=$(jq -r ".data.attributes.uploadOperations[$I].url" "asc-diagnostics/${SAFE}-reservation.json")
              OFFSET=$(jq -r ".data.attributes.uploadOperations[$I].offset" "asc-diagnostics/${SAFE}-reservation.json")
              LENGTH=$(jq -r ".data.attributes.uploadOperations[$I].length" "asc-diagnostics/${SAFE}-reservation.json")
              PART="$RUNNER_TEMP/${SAFE}-${I}.bin"
              dd if="$IMAGE" of="$PART" bs=1 skip="$OFFSET" count="$LENGTH" status=none
              HEADER_ARGS=()
              while IFS=$'\t' read -r N V; do HEADER_ARGS+=( -H "$N: $V" ); done < <(
                jq -r ".data.attributes.uploadOperations[$I].requestHeaders[]? | [.name,.value] | @tsv" "asc-diagnostics/${SAFE}-reservation.json")
              UP_HTTP=$(curl --silent --show-error -w '%{http_code}' -X "$METHOD" "${HEADER_ARGS[@]}" --data-binary "@$PART" "$URL" -o /dev/null)
              echo "upload[$I]=$UP_HTTP" >> asc-diagnostics/stage.txt
              [[ "$UP_HTTP" =~ ^2[0-9][0-9]$ ]]
            done

            COMMIT_BODY=$(jq -n --arg id "$RID" --arg sum "$CHECKSUM" \
              '{data:{type:"subscriptionAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$sum}}}')
            COMMIT_HTTP=$(curl --silent --show-error -w '%{http_code}' \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -X PATCH -d "$COMMIT_BODY" \
              "https://api.appstoreconnect.apple.com/v1/subscriptionAppStoreReviewScreenshots/${RID}" \
              -o "asc-diagnostics/${SAFE}-commit.json")
            echo "$COMMIT_HTTP" > "asc-diagnostics/${SAFE}-commit.status"
            [[ "$COMMIT_HTTP" == '200' ]]

            FINAL=''
            for TRY in $(seq 1 40); do
              curl --silent --show-error --fail -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' \
                "https://api.appstoreconnect.apple.com/v1/subscriptionAppStoreReviewScreenshots/${RID}" \
                -o "asc-diagnostics/${SAFE}-poll.json"
              FINAL=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "asc-diagnostics/${SAFE}-poll.json")
              echo "poll[$TRY]=$FINAL" >> asc-diagnostics/stage.txt
              [[ "$FINAL" == 'COMPLETE' ]] && break
              [[ "$FINAL" == 'FAILED' ]] && exit 1
              sleep 3
            done
            [[ "$FINAL" == 'COMPLETE' ]]
            echo "$PRODUCT_ID review screenshot COMPLETE ($RID)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload ASC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-pro-asc-upload-diagnostics
          path: asc-diagnostics/
          if-no-files-found: warn
          retention-days: 1

      - name: Verify subscription states
        shell: bash
        run: |
          set -euo pipefail
          for ROW in "$MONTHLY_PRODUCT|$MONTHLY_SID" "$ANNUAL_PRODUCT|$ANNUAL_SID"; do
            PRODUCT=${ROW%%|*}; SID=${ROW##*|}
            SHOT=$(curl --silent --show-error --fail -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/subscriptions/${SID}/appStoreReviewScreenshot")
            STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' <<<"$SHOT")
            test "$STATE" = 'COMPLETE'
            echo "$PRODUCT screenshot verified COMPLETE" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
