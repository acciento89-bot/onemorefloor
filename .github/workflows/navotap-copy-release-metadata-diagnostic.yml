name: NavoTap Reusable Metadata Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/navotap-copy-release-metadata-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-26
    env:
      SOURCE_BUNDLE_ID: de.kamilunavo.keepmeter
    steps:
      - name: Prepare ASC key
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inspect reusable KeepMeter metadata
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v)=Base64.urlsafe_encode64(v,padding:false)
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'})); input="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          auth=(-H "Authorization: Bearer $JWT")

          curl --fail-with-body --silent --show-error --get "${auth[@]}" --data-urlencode "filter[bundleId]=$SOURCE_BUNDLE_ID" --data-urlencode 'fields[apps]=name,bundleId,contentRightsDeclaration' https://api.appstoreconnect.apple.com/v1/apps -o "$RUNNER_TEMP/apps.json"
          APP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/apps.json")
          echo "KEEP_APP_ID=$APP_ID"
          jq -c '.data[0] | {id,attributes}' "$RUNNER_TEMP/apps.json"

          curl --fail-with-body --silent --show-error --get "${auth[@]}" --data-urlencode 'limit=200' "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/appInfos" -o "$RUNNER_TEMP/infos.json"
          echo '=== APP INFOS ==='
          jq -c '.data[] | {id,attributes,relationships}' "$RUNNER_TEMP/infos.json"

          curl --fail-with-body --silent --show-error --get "${auth[@]}" --data-urlencode 'filter[platform]=IOS' --data-urlencode 'limit=200' "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/appStoreVersions" -o "$RUNNER_TEMP/versions.json"
          echo '=== VERSIONS ==='
          jq -r '.data[] | "VERSION | ID=\(.id) | STRING=\(.attributes.versionString) | STATE=\(.attributes.appStoreState) | CREATED=\(.attributes.createdDate)"' "$RUNNER_TEMP/versions.json"
          VERSION_ID=$(jq -r '.data[0].id // empty' "$RUNNER_TEMP/versions.json")
          test -n "$VERSION_ID"

          HTTP=$(curl --silent --show-error -w '%{http_code}' -o "$RUNNER_TEMP/review.json" "${auth[@]}" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID/appStoreReviewDetail")
          echo "REVIEW_DETAIL_HTTP=$HTTP"
          if [ "$HTTP" = "200" ]; then jq -c '.data | {id,attributes}' "$RUNNER_TEMP/review.json"; else cat "$RUNNER_TEMP/review.json"; fi

          curl --fail-with-body --silent --show-error --get "${auth[@]}" --data-urlencode 'limit=200' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID/appStoreVersionLocalizations" -o "$RUNNER_TEMP/locs.json"
          echo '=== LOCALIZATIONS ==='
          jq -c '.data[] | {id,attributes}' "$RUNNER_TEMP/locs.json"

          HTTP=$(curl --silent --show-error -w '%{http_code}' -o "$RUNNER_TEMP/age.json" "${auth[@]}" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID/ageRatingDeclaration")
          echo "AGE_HTTP=$HTTP"
          if [ "$HTTP" = "200" ]; then jq -c '.data | {id,attributes}' "$RUNNER_TEMP/age.json"; else cat "$RUNNER_TEMP/age.json"; fi

      - name: Remove ASC key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
