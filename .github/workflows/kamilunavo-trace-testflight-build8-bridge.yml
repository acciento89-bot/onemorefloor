name: Kamilunavo Trace TestFlight Build 8 Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-testflight-build8-bridge.yml'

permissions:
  contents: read

env:
  SOURCE_REF: '74bb5139c81ce6ff611fc81e218f009033a2854b'

jobs:
  upload-kamilunavo-trace:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.SOURCE_REF }}
          path: trace
      - name: Build exact Trace archive only
        working-directory: trace/apps/002-evidaro/prototype
        run: |
          xcodebuild -project EvidaroPrototype.xcodeproj -scheme EvidaroPrototype -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Trace.xcarchive" PRODUCT_BUNDLE_IDENTIFIER=de.kamilunavo.trace CURRENT_PROJECT_VERSION=8 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Inspect source and compiled icon pixels with AppKit
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/iconstats.swift" <<'SWIFT'
          import AppKit
          import Foundation

          func inspect(_ path: String) {
              guard let image = NSImage(contentsOfFile: path),
                    let tiff = image.tiffRepresentation,
                    let rep = NSBitmapImageRep(data: tiff) else {
                  fatalError("Cannot decode \(path)")
              }
              let w = rep.pixelsWide, h = rep.pixelsHigh
              var sr = 0.0, sg = 0.0, sb = 0.0
              var dark = 0, teal = 0, total = 0
              for y in 0..<h {
                  for x in 0..<w {
                      guard let c = rep.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { continue }
                      let r = Double(c.redComponent * 255), g = Double(c.greenComponent * 255), b = Double(c.blueComponent * 255)
                      sr += r; sg += g; sb += b; total += 1
                      if max(r,g,b) < 40 { dark += 1 }
                      if g > r + 20 && b > r + 20 { teal += 1 }
                  }
              }
              func rgb(_ x: Int, _ y: Int) -> String {
                  let c = rep.colorAt(x: x, y: y)!.usingColorSpace(.deviceRGB)!
                  return "(\(Int(c.redComponent*255)),\(Int(c.greenComponent*255)),\(Int(c.blueComponent*255)))"
              }
              print("ICONSTAT \(path) size=\(w)x\(h) avg=(\(Int(sr/Double(total))),\(Int(sg/Double(total))),\(Int(sb/Double(total)))) dark=\(Double(dark)/Double(total)) teal=\(Double(teal)/Double(total)) center=\(rgb(w/2,h/2)) corner=\(rgb(0,0))")
          }
          for p in CommandLine.arguments.dropFirst() { inspect(p) }
          SWIFT
          SRC='trace/apps/002-evidaro/prototype/EvidaroPrototype/Assets.xcassets/AppIcon.appiconset/KamilunavoTrace-AppIcon-1024.png'
          APP="$RUNNER_TEMP/Trace.xcarchive/Products/Applications/EvidaroPrototype.app"
          swift "$RUNNER_TEMP/iconstats.swift" "$SRC" "$APP/AppIcon60x60@2x.png"
          echo '--- ICON PLIST ---'
          plutil -p "$APP/Info.plist" | grep -A25 -E 'CFBundleIcons|CFBundleIcon'
