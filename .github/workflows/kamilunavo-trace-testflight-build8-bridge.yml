name: Kamilunavo Trace TestFlight Build 8 Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-testflight-build8-bridge.yml'

permissions:
  contents: read

env:
  SOURCE_REF: '74bb5139c81ce6ff611fc81e218f009033a2854b'

jobs:
  upload-kamilunavo-trace:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.SOURCE_REF }}
          path: trace
      - name: Build exact Trace archive only
        working-directory: trace/apps/002-evidaro/prototype
        run: |
          xcodebuild -project EvidaroPrototype.xcodeproj -scheme EvidaroPrototype -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Trace.xcarchive" PRODUCT_BUNDLE_IDENTIFIER=de.kamilunavo.trace CURRENT_PROJECT_VERSION=8 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Print source and compiled icon pixel statistics
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/pngstats.py" <<'PY'
          import struct,zlib,sys
          def load(path):
              b=open(path,'rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
              p=8; raw=b''
              while p<len(b):
                  n=struct.unpack('>I',b[p:p+4])[0]; t=b[p+4:p+8]; d=b[p+8:p+8+n]; p+=12+n
                  if t==b'IHDR': w,h,bd,ct,_,_,_=struct.unpack('>IIBBBBB',d)
                  elif t==b'IDAT': raw+=d
                  elif t==b'IEND': break
              chans=3 if ct==2 else 4; data=zlib.decompress(raw); stride=w*chans; prev=[0]*stride; pix=[]; off=0
              for _ in range(h):
                  f=data[off]; off+=1; scan=list(data[off:off+stride]); off+=stride; out=[0]*stride
                  for x,v in enumerate(scan):
                      a=out[x-chans] if x>=chans else 0; bb=prev[x]; c=prev[x-chans] if x>=chans else 0
                      if f==0: val=v
                      elif f==1: val=(v+a)&255
                      elif f==2: val=(v+bb)&255
                      elif f==3: val=(v+((a+bb)//2))&255
                      else:
                          pp=a+bb-c; pa=abs(pp-a); pb=abs(pp-bb); pc=abs(pp-c); pr=a if pa<=pb and pa<=pc else (bb if pb<=pc else c); val=(v+pr)&255
                      out[x]=val
                  prev=out
                  for i in range(0,len(out),chans): pix.append(tuple(out[i:i+3]))
              avg=tuple(sum(q[i] for q in pix)//len(pix) for i in range(3))
              dark=sum(max(q)<40 for q in pix)/len(pix)
              teal=sum(q[1]>q[0]+20 and q[2]>q[0]+20 for q in pix)/len(pix)
              print(f'ICONSTAT {path} size={w}x{h} avg={avg} dark={dark:.4f} teal={teal:.4f} center={pix[(h//2)*w+w//2]} corner={pix[0]}')
          for p in sys.argv[1:]: load(p)
          PY
          SRC='trace/apps/002-evidaro/prototype/EvidaroPrototype/Assets.xcassets/AppIcon.appiconset/KamilunavoTrace-AppIcon-1024.png'
          APP="$RUNNER_TEMP/Trace.xcarchive/Products/Applications/EvidaroPrototype.app"
          python3 "$RUNNER_TEMP/pngstats.py" "$SRC" "$APP/AppIcon60x60@2x.png"
          echo '--- ICON PLIST ---'
          plutil -p "$APP/Info.plist" | grep -A25 -E 'CFBundleIcons|CFBundleIcon'
