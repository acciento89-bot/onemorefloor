name: NavoTap TestFlight Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/navotap-testflight-bridge.yml'
      - '.github/navotap-build2.trigger'

permissions:
  contents: read

concurrency:
  group: navotap-testflight-bridge-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'com.kamilunavo.onemoretap'
  MARKETING_VERSION: '0.2.0'
  BUILD_NUMBER: '2'
  SOURCE_REF: '16daf6697ed34a35917fab71e0f6225ef66b7b2e'

jobs:
  upload-navotap:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout locked NavoTap source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/onemoretap
          ref: ${{ env.SOURCE_REF }}
          path: navotap

      - name: Verify protected App Store Connect secrets
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          echo 'OneMoreFloor protected App Store Connect credentials are available.' >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Validate locked NavoTap release configuration
        working-directory: navotap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          python3 -m json.tool OneMoreTap/Resources/NavoTap.storekit >/dev/null
          plutil -lint OneMoreTap/Resources/Info.plist
          plutil -lint OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'ca-app-pub-8944085355624754~4792390111' OneMoreTap/Resources/Info.plist
          grep -q 'ca-app-pub-8944085355624754/7162618768' OneMoreTap/Monetization/AdService.swift
          grep -q 'ca-app-pub-8944085355624754/3694930864' OneMoreTap/Monetization/AdService.swift
          if grep -R --exclude='*.md' --exclude='*.storekit' -n 'ca-app-pub-3940256099942544' OneMoreTap; then
            echo '::error title=AdMob preflight::Google sample runtime ID remains'
            exit 1
          fi
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.kamilunavo.onemoretap;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 0.2.0;' OneMoreTap.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 2;' OneMoreTap.xcodeproj/project.pbxproj

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify NavoTap App Store Connect record
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          def b64url(v) = Base64.urlsafe_encode64(v, padding: false)
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          header = b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          payload = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          input = "#{header}.#{payload}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          RESPONSE="$RUNNER_TEMP/navotap-app-record.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$RESPONSE"
          test "$(jq '.data | length' "$RESPONSE")" -ge 1
          echo "App Store Connect record found: $(jq -r '.data[0].attributes.name' "$RESPONSE")." >> "$GITHUB_STEP_SUMMARY"

      - name: Create unsigned NavoTap Release archive
        working-directory: navotap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NavoTap.xcarchive"
          xcodebuild \
            -project OneMoreTap.xcodeproj \
            -scheme NavoTap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -d "$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"

      - name: Verify archive identity
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          echo "Archive verified: $BUNDLE_ID $MARKETING_VERSION ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ad-hoc signatures from embedded Google frameworks
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NavoTap.xcarchive/Products/Applications/NavoTap.app"
          for FRAMEWORK in GoogleMobileAds.framework UserMessagingPlatform.framework; do
            BUNDLE="$APP/Frameworks/$FRAMEWORK"
            test -d "$BUNDLE"
            echo "Before removal: $FRAMEWORK"
            codesign -dvv "$BUNDLE" 2>&1 | grep -E 'Signature=|Authority=|TeamIdentifier=' || true
            codesign --remove-signature "$BUNDLE"
            rm -rf "$BUNDLE/_CodeSignature"
            if codesign -d "$BUNDLE" >/dev/null 2>&1; then
              echo "::error title=Signature cleanup::$FRAMEWORK still has a code signature"
              exit 1
            fi
            echo "Removed archive-time ad-hoc signature from $FRAMEWORK"
          done
          echo 'Embedded Google framework ad-hoc signatures removed before Apple cloud export.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create App Store Connect export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export and upload NavoTap with Apple cloud signing
        id: upload
        shell: bash
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          rm -rf "$RUNNER_TEMP/NavoTapTestFlightExport"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NavoTap.xcarchive" \
            -exportPath "$RUNNER_TEMP/NavoTapTestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee diagnostics/TestFlight-export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" = 0 ]]; then
            grep -Ei 'upload|uploaded|success' diagnostics/TestFlight-export.log | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          else
            grep -Ei 'error:|failed|failure|signature|provision|certificate|identifier|app store' diagnostics/TestFlight-export.log | tail -120 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Upload bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navotap-testflight-bridge-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Require successful Apple upload
        if: steps.upload.outputs.status != '0'
        shell: bash
        run: |
          echo "NavoTap TestFlight upload failed with exit code ${{ steps.upload.outputs.status }}."
          exit 1

      - name: Mark successful TestFlight handoff
        if: steps.upload.outputs.status == '0'
        shell: bash
        run: echo 'NavoTap 0.2.0 (2) was successfully handed to App Store Connect/TestFlight.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
