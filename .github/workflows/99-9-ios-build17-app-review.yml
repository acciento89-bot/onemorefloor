name: 99.9 iOS Build 17 App Review

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: acciento89-bot/99-9
  SOURCE_REF: cb31a137e4e407feca0008f3345a89e9ca085652
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.ninenine'
  APP_VERSION: '1.0.0'
  BUILD_NUMBER: '17'

jobs:
  ios-build17-unsigned:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5
        with:
          ref: main
          path: bridge

      - name: Verify source credential
        env:
          REPO_TOKEN: ${{ secrets.NINENINE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"

      - name: Checkout locked Build 17 source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify App Review remediation source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          grep -q 'res://scripts/main_v12_app_review.gd' scenes/main.tscn
          grep -q 'RESTORE PURCHASES' scripts/main_v12_app_review.gd
          grep -q 'restore_theme_purchases' scripts/main_v12_app_review.gd

          grep -q 'Engine.has_singleton("GodotxATT")' scripts/ads_service_ios_safe.gd
          grep -q 'ATT_AUTHORIZED' scripts/ads_service_ios_safe.gd
          grep -q 'not _att_allows_tracking()' scripts/ads_service_ios_safe.gd
          grep -q 'NSUserTrackingUsageDescription' export_presets.cfg
          grep -q 'plugins/GodotxATT=true' export_presets.cfg

          grep -q 'get_node_or_null("/root/GodotIapPlugin")' scripts/iap_service_ios_safe.gd
          grep -q 'iap = autoload_iap' scripts/iap_service_ios_safe.gd
          grep -q 'GodotIapPlugin="\*res://addons/godot-iap/godot_iap_ios_safe.gd"' project.godot
          ! grep -En 'connect\(func|:= *func|= *func\(' scripts/main_v11_ios_shutdown_safe.gd scripts/main_v12_app_review.gd scripts/leaderboard_service_ios_safe.gd scripts/iap_service_ios_safe.gd scripts/ads_service_ios_safe.gd addons/godot-iap/godot_iap_ios_safe.gd

          grep -q 'ca-app-pub-8944085355624754~5700066119' project.godot
          grep -q 'ca-app-pub-8944085355624754/9156045067' scripts/ads_service.gd
          ! grep -q 'com.kamilunavo.game999' project.godot scripts/*.gd export_presets.cfg

          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('export_presets.cfg')
          text=p.read_text()
          text,count=re.subn(r'application/version="[0-9]+"','application/version="17"',text,count=1)
          if count != 1:
              raise SystemExit('Could not set iOS build number')
          p.write_text(text)
          PY

      - name: Install Godot and iOS templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f "$T/ios.zip"

      - name: Install iOS dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          bash scripts/ci_install_share_ios.sh
          bash scripts/ci_install_att_ios.sh
          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd
          test -f addons/godot-iap/bin/ios/GodotIap.framework/GodotIap
          test -f addons/godot-iap/bin/ios/SwiftGodotRuntime.framework/SwiftGodotRuntime
          test -f ios/plugins/share/share.gdip
          test -f ios/plugins/att/att.gdip
          find ios/plugins/att -maxdepth 1 -name 'GodotxATT*.xcframework' -print -quit | grep -q .

      - name: Prepare App Store-only copy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_ios_app_review_export.sh

      - name: Parse active project with Godot
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/parse.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/parse.log"; then exit 1; fi
          "$GODOT" --headless --path . --quit-after 3 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/smoke.log"; then exit 1; fi

      - name: Export and verify iOS Xcode project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          rm -rf build/ios/NineNine build/ios/NineNine.xcodeproj build/ios/NineNine.xcframework build/ios/MoltenVK.xcframework build/ios/PrivacyInfo.xcprivacy
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj
          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh

          grep -q 'GodotIap.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -q 'SwiftGodotRuntime.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -R -q 'GoogleMobileAds' build/ios
          grep -Ei -q 'share(\.release)?\.a|share\.a' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -q 'GodotxATT' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -Fq "$BUNDLE_ID" build/ios/NineNine.xcodeproj/project.pbxproj
          grep -Eq 'CURRENT_PROJECT_VERSION = 17;' build/ios/NineNine.xcodeproj/project.pbxproj

          INFO_PLIST="build/ios/NineNine/NineNine-Info.plist"
          test -f "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$INFO_PLIST" | grep -q 'advertising identifier'

          /usr/libexec/PlistBuddy -c 'Delete :ITSAppUsesNonExemptEncryption' "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$INFO_PLIST")" = "false"

          PCK=$(find build/ios -type f -name 'NineNine.pck' -print -quit)
          test -n "$PCK" -a -s "$PCK"
          ! strings "$PCK" | grep -F 'iOS + ANDROID'
          ! strings "$PCK" | grep -F 'iOS + Android'

          echo "XCODE_PROJECT=$PWD/build/ios/NineNine.xcodeproj" >> "$GITHUB_ENV"

      - name: Resolve Xcode scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode-list.json')).get('project',{})
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY
          )
          test -n "$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Create unsigned iOS archive with export compliance
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf "$RUNNER_TEMP/NineNine.xcarchive"
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NineNine.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$APP_VERSION" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

          APP="$RUNNER_TEMP/NineNine.xcarchive/Products/Applications/NineNine.app"
          test -d "$APP"
          test -d "$APP/Frameworks/GoogleMobileAds.framework"
          test -d "$APP/Frameworks/UserMessagingPlatform.framework"
          test -d "$APP/Frameworks/GodotIap.framework"
          test -d "$APP/Frameworks/SwiftGodotRuntime.framework"
          strings "$APP/Frameworks/GodotIap.framework/GodotIap" | grep -q 'godot_iap_entry_point'
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$APP/Info.plist" | grep -q 'advertising identifier'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = "false"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx "$BUILD_NUMBER"
          ! codesign -dv "$APP" >/dev/null 2>&1

          echo "Unsigned archive verified: $APP"
          echo "Export compliance verified: ITSAppUsesNonExemptEncryption=false"

      - name: Store unsigned Build 17 archive
        uses: actions/upload-artifact@v4
        with:
          name: NineNine-iOS-Build17-unsigned-xcarchive
          path: ${{ runner.temp }}/NineNine.xcarchive
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Store Xcode archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NineNine-iOS-Build17-xcodebuild-archive-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: warn
          retention-days: 7
