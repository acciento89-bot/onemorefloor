name: 99.9 iOS Build 17 App Review

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

env:
  SOURCE_REPO: acciento89-bot/99-9
  SOURCE_REF: cb31a137e4e407feca0008f3345a89e9ca085652
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.ninenine'
  APP_VERSION: '1.0.0'
  BUILD_NUMBER: '17'

jobs:
  ios-build17:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN 99.9 IOS BUILD 17 APP REVIEW'
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - name: Checkout bridge for result recording
        uses: actions/checkout@v5
        with:
          ref: main
          path: bridge

      - name: Verify credentials
        env:
          REPO_TOKEN: ${{ secrets.NINENINE_REPO_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"

      - name: Checkout locked Build 17 source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify App Review remediation source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          grep -q 'res://scripts/main_v12_app_review.gd' scenes/main.tscn
          grep -q 'RESTORE PURCHASES' scripts/main_v12_app_review.gd
          grep -q 'restore_theme_purchases' scripts/main_v12_app_review.gd

          grep -q 'Engine.has_singleton("GodotxATT")' scripts/ads_service_ios_safe.gd
          grep -q 'ATT_AUTHORIZED' scripts/ads_service_ios_safe.gd
          grep -q 'not _att_allows_tracking()' scripts/ads_service_ios_safe.gd
          grep -q 'NSUserTrackingUsageDescription' export_presets.cfg
          grep -q 'plugins/GodotxATT=true' export_presets.cfg

          grep -q 'get_node_or_null("/root/GodotIapPlugin")' scripts/iap_service_ios_safe.gd
          grep -q 'iap = autoload_iap' scripts/iap_service_ios_safe.gd
          grep -q 'GodotIapPlugin="\*res://addons/godot-iap/godot_iap_ios_safe.gd"' project.godot
          ! grep -En 'connect\(func|:= *func|= *func\(' scripts/main_v11_ios_shutdown_safe.gd scripts/main_v12_app_review.gd scripts/leaderboard_service_ios_safe.gd scripts/iap_service_ios_safe.gd scripts/ads_service_ios_safe.gd addons/godot-iap/godot_iap_ios_safe.gd

          grep -q 'ca-app-pub-8944085355624754~5700066119' project.godot
          grep -q 'ca-app-pub-8944085355624754/9156045067' scripts/ads_service.gd
          ! grep -q 'com.kamilunavo.game999' project.godot scripts/*.gd export_presets.cfg

          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('export_presets.cfg')
          text=p.read_text()
          text,count=re.subn(r'application/version="[0-9]+"','application/version="17"',text,count=1)
          if count != 1:
              raise SystemExit('Could not set iOS build number')
          p.write_text(text)
          PY

      - name: Prepare App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install Godot and iOS templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f "$T/ios.zip"

      - name: Install iOS dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          bash scripts/ci_install_share_ios.sh
          bash scripts/ci_install_att_ios.sh
          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd
          test -f addons/godot-iap/bin/ios/GodotIap.framework/GodotIap
          test -f addons/godot-iap/bin/ios/SwiftGodotRuntime.framework/SwiftGodotRuntime
          test -f ios/plugins/share/share.gdip
          test -f ios/plugins/att/att.gdip
          find ios/plugins/att -maxdepth 1 -name 'GodotxATT*.xcframework' -print -quit | grep -q .

      - name: Prepare App Store-only copy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_ios_app_review_export.sh

      - name: Parse active project with Godot
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/parse.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/parse.log"; then exit 1; fi
          "$GODOT" --headless --path . --quit-after 3 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/smoke.log"; then exit 1; fi

      - name: Export and verify iOS Xcode project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          rm -rf build/ios/NineNine build/ios/NineNine.xcodeproj build/ios/NineNine.xcframework build/ios/MoltenVK.xcframework build/ios/PrivacyInfo.xcprivacy
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj
          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh

          grep -q 'GodotIap.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -q 'SwiftGodotRuntime.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -R -q 'GoogleMobileAds' build/ios
          grep -Ei -q 'share(\.release)?\.a|share\.a' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -q 'GodotxATT' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -Fq "$BUNDLE_ID" build/ios/NineNine.xcodeproj/project.pbxproj
          grep -Eq 'CURRENT_PROJECT_VERSION = 17;' build/ios/NineNine.xcodeproj/project.pbxproj

          INFO_PLIST="build/ios/NineNine/NineNine-Info.plist"
          test -f "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$INFO_PLIST" | grep -q 'advertising identifier'

          PCK=$(find build/ios -type f -name 'NineNine.pck' -print -quit)
          test -n "$PCK" -a -s "$PCK"
          ! strings "$PCK" | grep -F 'iOS + ANDROID'
          ! strings "$PCK" | grep -F 'iOS + Android'

          echo "XCODE_PROJECT=$PWD/build/ios/NineNine.xcodeproj" >> "$GITHUB_ENV"

      - name: Resolve Xcode scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode-list.json')).get('project',{})
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY
          )
          test -n "$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Create unsigned iOS archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NineNine.xcarchive"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NineNine.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          APP="$RUNNER_TEMP/NineNine.xcarchive/Products/Applications/NineNine.app"
          test -d "$APP"
          test -d "$APP/Frameworks/GoogleMobileAds.framework"
          test -d "$APP/Frameworks/UserMessagingPlatform.framework"
          test -d "$APP/Frameworks/GodotIap.framework"
          test -d "$APP/Frameworks/SwiftGodotRuntime.framework"
          strings "$APP/Frameworks/GodotIap.framework/GodotIap" | grep -q 'godot_iap_entry_point'
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$APP/Info.plist" | grep -q 'advertising identifier'
          echo "ARCHIVE_APP=$APP" >> "$GITHUB_ENV"

      - name: Prime embedded frameworks for cloud signing
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' FW; do
            codesign --force --sign - --timestamp=none "$FW"
            codesign --verify --strict --verbose=2 "$FW"
            COUNT=$((COUNT + 1))
          done < <(find "$ARCHIVE_APP/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0)
          while IFS= read -r -d '' DYLIB; do
            codesign --force --sign - --timestamp=none "$DYLIB"
            codesign --verify --strict --verbose=2 "$DYLIB"
            COUNT=$((COUNT + 1))
          done < <(find "$ARCHIVE_APP/Frameworks" -maxdepth 1 -type f -name '*.dylib' -print0)
          test "$COUNT" -ge 4

      - name: Create App Store export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Cloud-sign Build 17 IPA
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Build17Export"
          mkdir -p "$RUNNER_TEMP/Build17Export"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NineNine.xcarchive" -exportPath "$RUNNER_TEMP/Build17Export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/Build17Export" -maxdepth 2 -type f -name '*.ipa' -print -quit)
          test -n "$IPA" -a -s "$IPA"
          echo "SIGNED_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Verify signed Build 17 identity and signatures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/SignedPayload"
          mkdir -p "$RUNNER_TEMP/SignedPayload"
          unzip -q "$SIGNED_IPA" -d "$RUNNER_TEMP/SignedPayload"
          SIGNED_APP=$(find "$RUNNER_TEMP/SignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$SIGNED_APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_APP/Info.plist" | grep -qx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SIGNED_APP/Info.plist" | grep -qx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SIGNED_APP/Info.plist" | grep -qx "$BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$SIGNED_APP/Info.plist" | grep -q 'advertising identifier'
          for FW in GoogleMobileAds.framework UserMessagingPlatform.framework GodotIap.framework SwiftGodotRuntime.framework; do
            P="$SIGNED_APP/Frameworks/$FW"
            test -d "$P"
            codesign --verify --strict --verbose=2 "$P"
            INFO=$(codesign -dvv "$P" 2>&1)
            grep -q '^Authority=Apple Distribution' <<<"$INFO"
          done
          codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"
          cp "$SIGNED_IPA" "$GITHUB_WORKSPACE/NineNine-iOS-Build17-app-review.ipa"

      - name: Upload Build 17 to App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app --file "$SIGNED_IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: Store Build 17 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NineNine-iOS-Build17-app-review
          path: NineNine-iOS-Build17-app-review.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove App Store Connect key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

      - name: Record Build 17 result
        if: always()
        working-directory: bridge
        env:
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          LOCKED_SOURCE: cb31a137e4e407feca0008f3345a89e9ca085652
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          printf 'result=%s\nrun_id=%s\nsource_ref=%s\nbuild=17\nbundle=%s\natt_gate=true\nrestore_purchases=true\nios_copy_neutralized=true\ntestflight_upload_attempted=true\n' "$RESULT" "$RUN_ID" "$LOCKED_SOURCE" "$BUNDLE_ID" > validation/99-9-ios-build17-app-review-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/99-9-ios-build17-app-review-result.txt
          git commit -m "Record 99.9 iOS Build 17 App Review result" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
