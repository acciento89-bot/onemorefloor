name: Family Life OS Release Audit Ubuntu v2

on:
  push:
    branches: [agent/family-life-os-testflight-bridge]
    paths:
      - '.github/workflows/family-life-os-release-audit-ubuntu-v2.yml'

permissions:
  contents: read
  statuses: write
  id-token: write

env:
  BUNDLE_ID: de.kamilunavo.familyprototype
  APP_ID: '6803079524'
  INFO_LOC_ID: 4200e95c-e36b-4867-b697-e1fe53d61be2
  VERSION_ID: e7a061e3-bd05-453c-a911-00e1e8cb4f76
  VLOC_ID: 557ca16e-28b4-44d0-83ec-11d8890f0376
  REVIEW_EMAIL: apple-review@kamilunavo.com
  REVIEW_SECRET_URL: https://bqctetqraszsvknczjjr.supabase.co/functions/v1/release-review-secret

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD=$(jq -n --arg target_url "$TARGET_URL" '{state:"pending",target_url:$target_url,description:"Family Life OS release finalization running",context:"family-life-os/release-audit-v2"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$PAYLOAD" >/dev/null

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); input="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Retrieve dedicated App Review credential
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=family-life-os-release")
          OIDC_TOKEN=$(jq -r '.value // empty' <<<"$OIDC_JSON")
          test -n "$OIDC_TOKEN"
          SECRET_JSON=$(curl -fsSL -H "Authorization: Bearer $OIDC_TOKEN" "$REVIEW_SECRET_URL")
          REVIEW_PASSWORD=$(jq -r '.secret // empty' <<<"$SECRET_JSON")
          test -n "$REVIEW_PASSWORD"
          echo "::add-mask::$REVIEW_PASSWORD"
          echo "REVIEW_PASSWORD=$REVIEW_PASSWORD" >> "$GITHUB_ENV"
          echo 'Dedicated App Review credential loaded through repository-scoped GitHub OIDC.' >> "$GITHUB_STEP_SUMMARY"

      - name: Patch required App Store metadata
        run: |
          set -euo pipefail
          patch() {
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$2" "https://api.appstoreconnect.apple.com$1" >/dev/null
          }

          INFO=$(jq -n --arg id "$INFO_LOC_ID" '{data:{type:"appInfoLocalizations",id:$id,attributes:{subtitle:"Familienalltag organisiert",privacyPolicyUrl:"https://www.kamilunavo.com/family/privacy",privacyChoicesUrl:"https://www.kamilunavo.com/family/privacy-choices"}}}')
          patch "/v1/appInfoLocalizations/$INFO_LOC_ID" "$INFO"

          DESCRIPTION=$(cat <<'EOF'
Family Life OS macht aus verstreuten Familieninfos einen gemeinsamen Plan. Erfasse Elternbriefe, Screenshots, PDFs, Text oder Sprache. Die App erkennt Termine, Aufgaben, Fristen und Vorbereitungen und zeigt sie dir zuerst zur Prüfung – erst danach werden sie in den Familienplan übernommen.

• Heute: Was jetzt wichtig ist
• Inbox: Fotos, PDFs, Text und Sprache sammeln
• Import prüfen: erkannte Termine, Aufgaben und Erinnerungen bearbeiten
• Plan: gemeinsame Agenda und Wochenübersicht
• Familie: Mitglieder, Rollen und Einladungen verwalten
• Erinnerungen: Termine, Aufgaben und Vorbereitung
• Family Pro: mehr AI-Importe, Automationen, Speicher und Verlauf

Datenschutz bleibt zentral: private Haushaltsdaten, serverseitige AI-Verarbeitung und keine Werbe-SDKs oder appübergreifendes Tracking.

Datenschutz: https://www.kamilunavo.com/family/privacy
Nutzungsbedingungen: https://www.kamilunavo.com/family/terms
EOF
          )
          VLOC=$(jq -n \
            --arg id "$VLOC_ID" \
            --arg d "$DESCRIPTION" \
            --arg k 'familie,kalender,aufgaben,termine,eltern,organisation,planer,erinnerungen,haushalt,schule' \
            --arg p 'Elternbrief, Screenshot oder Sprachnotiz rein – Termine, Aufgaben und Fristen gemeinsam organisieren.' \
            '{data:{type:"appStoreVersionLocalizations",id:$id,attributes:{description:$d,keywords:$k,promotionalText:$p,supportUrl:"https://www.kamilunavo.com/family/support"}}}')
          patch "/v1/appStoreVersionLocalizations/$VLOC_ID" "$VLOC"

          VER=$(jq -n --arg id "$VERSION_ID" '{data:{type:"appStoreVersions",id:$id,attributes:{copyright:"2026 Piotr Kaminski – Kamilunavo"}}}')
          patch "/v1/appStoreVersions/$VERSION_ID" "$VER"

      - name: Resolve an existing verified review contact
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"
          }
          APPS=$(api '/v1/apps?limit=200')
          CONTACT=''
          while read -r aid; do
            [[ -z "$aid" || "$aid" == "$APP_ID" ]] && continue
            VERS=$(api "/v1/apps/${aid}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50" || true)
            while read -r vid; do
              [[ -z "$vid" ]] && continue
              DETAIL=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${vid}/appStoreReviewDetail" || true)
              FIRST=$(jq -r '.data.attributes.contactFirstName // empty' <<<"$DETAIL" 2>/dev/null || true)
              LAST=$(jq -r '.data.attributes.contactLastName // empty' <<<"$DETAIL" 2>/dev/null || true)
              PHONE=$(jq -r '.data.attributes.contactPhone // empty' <<<"$DETAIL" 2>/dev/null || true)
              EMAIL=$(jq -r '.data.attributes.contactEmail // empty' <<<"$DETAIL" 2>/dev/null || true)
              if [[ -n "$FIRST" && -n "$LAST" && -n "$PHONE" && -n "$EMAIL" ]]; then
                CONTACT=$(jq -n --arg f "$FIRST" --arg l "$LAST" --arg p "$PHONE" --arg e "$EMAIL" '{first:$f,last:$l,phone:$p,email:$e}')
                break 2
              fi
            done < <(jq -r '.data[]?.id' <<<"$VERS")
          done < <(jq -r '.data[]?.id' <<<"$APPS")
          test -n "$CONTACT"
          echo "CONTACT_B64=$(printf '%s' "$CONTACT" | base64 -w0)" >> "$GITHUB_ENV"
          echo 'Existing verified App Review contact reused without printing personal contact fields.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update App Review information
        run: |
          set -euo pipefail
          CONTACT=$(printf '%s' "$CONTACT_B64" | base64 -d)
          FIRST=$(jq -r '.first' <<<"$CONTACT")
          LAST=$(jq -r '.last' <<<"$CONTACT")
          PHONE=$(jq -r '.phone' <<<"$CONTACT")
          EMAIL=$(jq -r '.email' <<<"$CONTACT")
          NOTES=$(cat <<'EOF'
Family Life OS requires sign-in. Use the dedicated demo account supplied in App Review Information.

Recommended review path:
1. Open Heute for the current family overview.
2. Open Inbox and add text such as: "Elternabend am 26.08.2026 um 18:30".
3. Wait for "Import prüfen", review the proposed action, then confirm it.
4. Open Plan to see the confirmed item.
5. Open Familie to view household members and the visible Family Pro subscription entry point.
6. Open Einstellungen for Restore Purchases, Privacy/Terms links, notification controls and "Account und Daten löschen".

Family Pro Monthly and Annual are Apple StoreKit auto-renewable subscriptions. No external payment method is used. Restore Purchases is available in the app. AI-derived import proposals require explicit user confirmation before becoming plan items.
EOF
          )
          ATTR=$(jq -n \
            --arg f "$FIRST" --arg l "$LAST" --arg p "$PHONE" --arg e "$EMAIL" \
            --arg u "$REVIEW_EMAIL" --arg pw "$REVIEW_PASSWORD" --arg n "$NOTES" \
            '{contactFirstName:$f,contactLastName:$l,contactPhone:$p,contactEmail:$e,demoAccountName:$u,demoAccountPassword:$pw,demoAccountRequired:true,notes:$n}')

          EXIST=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${VERSION_ID}/appStoreReviewDetail" || true)
          REVIEW_ID=$(jq -r '.data.id // empty' <<<"$EXIST" 2>/dev/null || true)
          if [[ -n "$REVIEW_ID" ]]; then
            BODY=$(jq -n --arg id "$REVIEW_ID" --argjson a "$ATTR" '{data:{type:"appStoreReviewDetails",id:$id,attributes:$a}}')
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' \
              -d "$BODY" "https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails/${REVIEW_ID}" >/dev/null
          else
            BODY=$(jq -n --arg vid "$VERSION_ID" --argjson a "$ATTR" '{data:{type:"appStoreReviewDetails",attributes:$a,relationships:{appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' \
              -d "$BODY" 'https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails' >/dev/null
          fi

      - name: Verify release metadata
        run: |
          set -euo pipefail
          I=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appInfoLocalizations/$INFO_LOC_ID")
          V=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersionLocalizations/$VLOC_ID")
          R=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID")
          D=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID/appStoreReviewDetail")
          SUBS=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/apps/${APP_ID}/subscriptionGroups?include=subscriptions&limit%5Bsubscriptions%5D=50")

          test "$(jq -r '.data.attributes.privacyPolicyUrl' <<<"$I")" = 'https://www.kamilunavo.com/family/privacy'
          test "$(jq -r '.data.attributes.privacyChoicesUrl' <<<"$I")" = 'https://www.kamilunavo.com/family/privacy-choices'
          test "$(jq -r '.data.attributes.supportUrl' <<<"$V")" = 'https://www.kamilunavo.com/family/support'
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.keywords // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.promotionalText // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.copyright // empty' <<<"$R")"
          test "$(jq -r '.data.attributes.demoAccountRequired' <<<"$D")" = 'true'
          test "$(jq -r '.data.attributes.demoAccountName' <<<"$D")" = "$REVIEW_EMAIL"
          test -n "$(jq -r '.data.attributes.demoAccountPassword // empty' <<<"$D")"
          test -n "$(jq -r '.data.attributes.notes // empty' <<<"$D")"

          MONTHLY_STATE=$(jq -r '.included[]? | select(.type=="subscriptions" and .attributes.productId=="de.kamilunavo.family.familypro.monthly") | .attributes.state' <<<"$SUBS")
          ANNUAL_STATE=$(jq -r '.included[]? | select(.type=="subscriptions" and .attributes.productId=="de.kamilunavo.family.familypro.annual") | .attributes.state' <<<"$SUBS")
          test "$MONTHLY_STATE" = 'READY_TO_SUBMIT'
          test "$ANNUAL_STATE" = 'READY_TO_SUBMIT'

          {
            echo '## Family Life OS release metadata finalization'
            echo '- Privacy Policy URL: verified'
            echo '- Privacy Choices URL: verified'
            echo '- Subtitle / description / keywords / promotional text: verified'
            echo '- Support URL: verified'
            echo '- Copyright: verified'
            echo '- App Review contact and review notes: verified'
            echo '- Dedicated review account: verified in App Store Connect'
            echo "- Family Pro Monthly: $MONTHLY_STATE"
            echo "- Family Pro Annual: $ANNUAL_STATE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${{ job.status }}" == "success" ]]; then STATE=success; DESC='Family Life OS release metadata finalized'; else STATE=failure; DESC='Family Life OS release finalization failed'; fi
          PAYLOAD=$(jq -n --arg state "$STATE" --arg target_url "$TARGET_URL" --arg description "$DESC" '{state:$state,target_url:$target_url,description:$description,context:"family-life-os/release-audit-v2"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$PAYLOAD" >/dev/null

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
