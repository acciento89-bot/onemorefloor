name: Premium Reference Check

on:
  push:
    branches:
      - agent/v1.6-concept-final
      - agent/v1.6.2-premium-reference-pass
      - main
  pull_request:

jobs:
  premium-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Parse premium renderer
        run: |
          ./godot --headless --path . --script res://scripts/main_v18.gd --check-only
          ./godot --headless --path . --script res://scripts/v18_smoke_test.gd --check-only

      - name: Import premium assets
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee premium-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Error.*SVG" premium-import.log; then
            exit 1
          fi

      - name: Run premium reference regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v18_smoke_test.gd --quit-after 120 | tee premium-reference.log
          grep -q "ONE MORE FLOOR v1.6.2 premium reference smoke test passed" premium-reference.log
