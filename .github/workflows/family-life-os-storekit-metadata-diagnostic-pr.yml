name: Family Life OS StoreKit Metadata Diagnostic PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-storekit-metadata-diagnostic-pr.yml'

permissions:
  contents: read

env:
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  GROUP_NAME: 'Family Pro'
  MONTHLY_ID: 'de.kamilunavo.family.familypro.monthly'
  ANNUAL_ID: 'de.kamilunavo.family.familypro.annual'

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Prepare App Store Connect credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Inspect required subscription metadata
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'})); input="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          AUTH="Authorization: Bearer $JWT"; API='https://api.appstoreconnect.apple.com/v1'; TMP="$RUNNER_TEMP/asc.json"

          curl --fail-with-body --silent --show-error --get -H "$AUTH" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/apps" -o "$TMP"
          APP_ID=$(jq -r '.data[0].id // empty' "$TMP"); test -n "$APP_ID"
          curl --fail-with-body --silent --show-error --get -H "$AUTH" \
            --data-urlencode "filter[referenceName]=$GROUP_NAME" \
            --data-urlencode 'include=subscriptions' \
            --data-urlencode 'fields[subscriptionGroups]=referenceName,subscriptions' \
            --data-urlencode 'fields[subscriptions]=name,productId,state,subscriptionPeriod,reviewNote,groupLevel' \
            "$API/apps/$APP_ID/subscriptionGroups" -o "$TMP"
          MONTHLY=$(jq -r --arg id "$MONTHLY_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .id' "$TMP" | head -1)
          ANNUAL=$(jq -r --arg id "$ANNUAL_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .id' "$TMP" | head -1)
          test -n "$MONTHLY"; test -n "$ANNUAL"

          inspect_subscription() {
            local sid="$1" label="$2"
            local detail="$RUNNER_TEMP/${label}-detail.json"
            local locales="$RUNNER_TEMP/${label}-locales.json"
            local versions="$RUNNER_TEMP/${label}-versions.json"
            local screenshot="$RUNNER_TEMP/${label}-screenshot.json"
            local prices="$RUNNER_TEMP/${label}-prices.json"
            local plans="$RUNNER_TEMP/${label}-plans.json"

            curl --fail-with-body --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'fields[subscriptions]=name,productId,state,subscriptionPeriod,reviewNote,groupLevel' \
              "$API/subscriptions/$sid" -o "$detail"
            curl --fail-with-body --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'fields[subscriptionLocalizations]=name,locale,description,state' \
              "$API/subscriptions/$sid/subscriptionLocalizations" -o "$locales"
            curl --fail-with-body --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'fields[subscriptionVersions]=version,state' \
              "$API/subscriptions/$sid/versions" -o "$versions"
            code=$(curl --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'fields[subscriptionAppStoreReviewScreenshots]=fileSize,fileName,assetDeliveryState' \
              "$API/subscriptions/$sid/appStoreReviewScreenshot" -o "$screenshot" -w '%{http_code}')
            curl --fail-with-body --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'filter[territory]=DEU' \
              --data-urlencode 'include=subscriptionPricePoint,territory' \
              --data-urlencode 'fields[subscriptionPrices]=startDate,preserved,planType,territory,subscriptionPricePoint' \
              --data-urlencode 'fields[subscriptionPricePoints]=customerPrice,territory' \
              "$API/subscriptions/$sid/prices" -o "$prices"
            curl --fail-with-body --silent --show-error --get -H "$AUTH" \
              --data-urlencode 'fields[subscriptionPlanAvailabilities]=planType,availableInNewTerritories,availableTerritories' \
              "$API/subscriptions/$sid/planAvailabilities" -o "$plans"

            echo "## $label" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "- state: $(jq -r '.data.attributes.state' "$detail")" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "- period: $(jq -r '.data.attributes.subscriptionPeriod' "$detail")" | tee -a "$GITHUB_STEP_SUMMARY"
            rn=$(jq -r '.data.attributes.reviewNote // empty' "$detail")
            if [[ -n "$rn" ]]; then echo '- review note: PRESENT' | tee -a "$GITHUB_STEP_SUMMARY"; else echo '- review note: MISSING' | tee -a "$GITHUB_STEP_SUMMARY"; fi
            echo "- localizations: $(jq -r '[.data[].attributes.locale] | join(", ")' "$locales")" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "- localization states: $(jq -r '[.data[] | (.attributes.locale + "=" + (.attributes.state // "?"))] | join(", ")' "$locales")" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "- versions: $(jq -r '[.data[] | ((.attributes.version|tostring) + "=" + .attributes.state)] | join(", ")' "$versions")" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$code" == '200' ]]; then
              echo "- review screenshot: PRESENT / $(jq -r '.data.attributes.fileName // "?"' "$screenshot") / $(jq -r '.data.attributes.assetDeliveryState.state // .data.attributes.assetDeliveryState // "?"' "$screenshot")" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [[ "$code" == '404' ]]; then
              echo '- review screenshot: MISSING' | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- review screenshot query: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
              jq -r '.errors[]? | "  - \(.code // ""): \(.detail // .title // "")"' "$screenshot" | tee -a "$GITHUB_STEP_SUMMARY" || true
            fi
            echo "- DE prices: $(jq -r '[.included[]? | select(.type=="subscriptionPricePoints") | .attributes.customerPrice] | unique | join(", ")' "$prices")" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "- plan availability: $(jq -r '[.data[] | .attributes.planType] | join(", ")' "$plans")" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          inspect_subscription "$MONTHLY" 'Monthly'
          inspect_subscription "$ANNUAL" 'Annual'

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
