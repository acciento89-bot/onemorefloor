name: Family Life OS TestFlight Bridge

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Family Life OS App Store Connect build number'
        required: false
        default: '1'
  pull_request:
    paths:
      - '.github/family-life-os-bridge-trigger.txt'

permissions:
  contents: read
  issues: write

concurrency:
  group: family-life-os-testflight-bridge
  cancel-in-progress: true

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  PROJECT_DIR: 'family-source/apps/011-family-life-os/prototype'
  XCODE_PROJECT: 'FamilyLifePrototype.xcodeproj'
  SCHEME: 'FamilyLifePrototype'

jobs:
  family-life-os-testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Family Life OS source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: agent/family-life-os-app-icons
          path: family-source

      - name: Select effective build number
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          BUILD="${REQUESTED_BUILD:-1}"
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          echo "EFFECTIVE_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Family Life OS build: 0.1.0 ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve Swift packages
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build unsigned iPhone/iPad release app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifeDerivedData"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FamilyLifeDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Require existing ONE MORE FLOOR ASC credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          echo 'Existing App Store Connect credentials are available; values were not printed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned Family Life OS archive
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifePrototype.xcarchive"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -f "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Info.plist"
          test -d "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Products/Applications/FamilyLifePrototype.app"

      - name: Compile AppIcon into archive and verify Apple metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Products/Applications/FamilyLifePrototype.app"
          CATALOG="FamilyLifePrototype/Assets.xcassets"
          PARTIAL="$RUNNER_TEMP/FamilyLife-AppIcon-Info.plist"
          test -f "$CATALOG/AppIcon.appiconset/AppIcon-1024.png"
          xcrun actool "$CATALOG" \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 18.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist "$PARTIAL" \
            --compress-pngs \
            --enable-on-demand-resources NO
          test -f "$PARTIAL"
          /usr/libexec/PlistBuddy -c "Merge $PARTIAL" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIconName AppIcon' "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" | grep -qx 'AppIcon'
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' "$APP/Info.plist"
          test -f "$APP/Assets.car"
          find "$APP" -maxdepth 1 -type f \( -name 'AppIcon*.png' -o -name '*60x60*.png' -o -name '*76x76*.png' \) -print
          echo 'AppIcon asset catalog compiled and Info.plist metadata verified before Apple cloud signing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create TestFlight export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Upload Family Life OS to TestFlight with Apple cloud signing
        id: testflight
        continue-on-error: true
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            -exportPath "$RUNNER_TEMP/FamilyLifeTestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/family-life-testflight-export.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          mkdir -p build/family-life-os
          cp "$RUNNER_TEMP/family-life-testflight-export.log" build/family-life-os/TestFlight-export.log
          DIST_LOG=$(find /var/folders "$RUNNER_TEMP" -name '*.xcdistributionlogs' -type d -print 2>/dev/null | tail -1 || true)
          if [[ -n "$DIST_LOG" && -d "$DIST_LOG" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$DIST_LOG" build/family-life-os/FamilyLifePrototype-xcdistributionlogs.zip
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TestFlight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-testflight-bridge-diagnostics
          path: |
            build/family-life-os/TestFlight-export.log
            build/family-life-os/FamilyLifePrototype-xcdistributionlogs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Report bridge run for handoff
        if: always()
        uses: actions/github-script@v7
        env:
          TESTFLIGHT_STATUS: ${{ steps.testflight.outputs.status }}
          TESTFLIGHT_CONCLUSION: ${{ steps.testflight.conclusion }}
        with:
          script: |
            const status = process.env.TESTFLIGHT_STATUS || 'not-run';
            const conclusion = process.env.TESTFLIGHT_CONCLUSION || 'not-run';
            const title = `Family Life OS TestFlight bridge run ${context.runId}`;
            const body = [
              'Automated internal handoff for the Family Life OS TestFlight bridge.',
              '',
              `- run_id: ${context.runId}`,
              `- source_sha: ${context.sha}`,
              `- testflight_exit_status: ${status}`,
              `- testflight_step_conclusion: ${conclusion}`,
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No App Store Connect secret values are included in this issue.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Fail if Family Life OS TestFlight upload failed
        if: always() && steps.testflight.outputs.status != '0'
        shell: bash
        run: |
          echo "Family Life OS TestFlight upload failed with exit code ${{ steps.testflight.outputs.status }}."
          exit 1

      - name: Record upload success
        if: steps.testflight.outputs.status == '0'
        shell: bash
        run: echo 'Family Life OS TestFlight upload completed successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
