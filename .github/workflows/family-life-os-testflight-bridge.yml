name: Family Life OS TestFlight Bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/family-life-os-testflight-bridge.yml'

permissions:
  contents: read

concurrency:
  group: family-life-os-testflight-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  BUILD_NUMBER: '3'
  SOURCE_REF: 'main'

jobs:
  upload-family-life-os:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Family Life OS source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.SOURCE_REF }}
          path: appideenchatgpt

      - name: Verify App Store Connect secrets
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          echo 'Existing ONE MORE FLOOR App Store Connect credentials are available to the bridge.' >> "$GITHUB_STEP_SUMMARY"

      - name: Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve Swift packages
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -resolvePackageDependencies

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Ensure Apple Bundle ID and check App Store Connect record
        id: apple_preflight
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          JWT=$(ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'

          def b64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end

          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          header = b64url(JSON.generate({ alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT' }))
          payload = b64url(JSON.generate({ iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }))
          signing_input = "#{header}.#{payload}"
          der = key.sign(OpenSSL::Digest::SHA256.new, signing_input)
          sequence = OpenSSL::ASN1.decode(der)
          raw = sequence.value.map do |integer|
            hex = integer.value.to_i.to_s(16).rjust(64, '0')
            [hex].pack('H*')
          end.join
          puts "#{signing_input}.#{b64url(raw)}"
          RUBY
          )

          AUTH_HEADER="Authorization: Bearer $JWT"
          BUNDLE_RESPONSE="$RUNNER_TEMP/bundle-id.json"
          APP_RESPONSE="$RUNNER_TEMP/app-record.json"

          curl --silent --show-error --get \
            -H "$AUTH_HEADER" \
            --data-urlencode "filter[identifier]=$BUNDLE_ID" \
            --data-urlencode 'fields[bundleIds]=identifier,name,platform' \
            'https://api.appstoreconnect.apple.com/v1/bundleIds' \
            -o "$BUNDLE_RESPONSE"

          BUNDLE_COUNT=$(jq '.data | length' "$BUNDLE_RESPONSE")
          if [[ "$BUNDLE_COUNT" == '0' ]]; then
            CREATE_BODY=$(jq -n --arg identifier "$BUNDLE_ID" '{data:{type:"bundleIds",attributes:{identifier:$identifier,name:"Family Life Prototype",platform:"IOS"}}}')
            HTTP_CODE=$(curl --silent --show-error \
              -H "$AUTH_HEADER" \
              -H 'Content-Type: application/json' \
              -X POST \
              -d "$CREATE_BODY" \
              -o "$BUNDLE_RESPONSE" \
              -w '%{http_code}' \
              'https://api.appstoreconnect.apple.com/v1/bundleIds')
            if [[ "$HTTP_CODE" != '201' ]]; then
              echo "Apple Bundle ID registration failed (HTTP $HTTP_CODE)." >> "$GITHUB_STEP_SUMMARY"
              jq -r '.errors[]? | "- \(.status // "?") \(.code // ""): \(.title // "") — \(.detail // "")"' "$BUNDLE_RESPONSE" >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
            echo "Apple Bundle ID registered: $BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Apple Bundle ID already registered: $BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
          fi

          curl --silent --show-error --get \
            -H "$AUTH_HEADER" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId,sku,primaryLocale' \
            'https://api.appstoreconnect.apple.com/v1/apps' \
            -o "$APP_RESPONSE"

          APP_COUNT=$(jq '.data | length' "$APP_RESPONSE")
          if [[ "$APP_COUNT" == '0' ]]; then
            echo 'app_record=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Manual Apple gate'
              echo "The Bundle ID is ready, but App Store Connect has no app record for $BUNDLE_ID."
              echo 'Apple currently requires new app records to be created in the App Store Connect website.'
              echo 'Use: Apps -> + -> New App, platform iOS, bundle ID de.kamilunavo.familyprototype.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          APP_NAME=$(jq -r '.data[0].attributes.name' "$APP_RESPONSE")
          echo 'app_record=true' >> "$GITHUB_OUTPUT"
          echo "App Store Connect record found for $BUNDLE_ID ($APP_NAME)." >> "$GITHUB_STEP_SUMMARY"

      - name: Create unsigned Family Life OS archive
        if: steps.apple_preflight.outputs.app_record == 'true'
        working-directory: appideenchatgpt/apps/011-family-life-os/prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifePrototype.xcarchive"
          xcodebuild \
            -project FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -f "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Info.plist"
          test -d "$RUNNER_TEMP/FamilyLifePrototype.xcarchive/Products/Applications/FamilyLifePrototype.app"

      - name: Create App Store Connect export options
        if: steps.apple_preflight.outputs.app_record == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Upload Family Life OS to TestFlight
        id: upload
        if: steps.apple_preflight.outputs.app_record == 'true'
        continue-on-error: true
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/FamilyLifePrototype.xcarchive" \
            -exportPath "$RUNNER_TEMP/FamilyLifeTestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/family-life-testflight-export.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          mkdir -p diagnostics
          cp "$RUNNER_TEMP/family-life-testflight-export.log" diagnostics/TestFlight-export.log
          DIST_LOG=$(find /var/folders "$RUNNER_TEMP" -name '*.xcdistributionlogs' -type d -print 2>/dev/null | tail -1 || true)
          if [[ -n "$DIST_LOG" && -d "$DIST_LOG" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$DIST_LOG" diagnostics/FamilyLifePrototype-xcdistributionlogs.zip
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Surface Apple export diagnostics
        if: always() && steps.upload.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          LOG=diagnostics/TestFlight-export.log
          if [[ ! -f "$LOG" ]]; then
            exit 0
          fi
          grep -Ei 'error:|failed|failure|provision|bundle|app store|profile|certificate|identifier|registered|account|authentication|permission|not found|does not exist|missingApp' "$LOG" \
            | tail -120 \
            | sed -E 's/API Key <identifier: [^;>]+; issuer: [^>]+>/API Key [REDACTED]/g' \
            | tee diagnostics/TestFlight-errors.txt || true
          if [[ -s diagnostics/TestFlight-errors.txt ]]; then
            {
              echo '### Apple export diagnostics'
              echo '```text'
              cat diagnostics/TestFlight-errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload TestFlight diagnostics
        if: always() && steps.upload.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-testflight-bridge-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Family Life OS upload failed
        if: steps.upload.outcome != 'skipped' && steps.upload.outputs.status != '0'
        shell: bash
        run: |
          echo "Family Life OS TestFlight upload failed with exit code ${{ steps.upload.outputs.status }}."
          exit 1

      - name: Mark successful bridge upload
        if: steps.upload.outcome != 'skipped' && steps.upload.outputs.status == '0'
        shell: bash
        run: |
          echo 'Family Life OS 0.1.0 (3) was handed to App Store Connect/TestFlight successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8