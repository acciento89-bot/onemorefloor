name: Family Life OS Apple Registration Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/family-life-os-apple-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      BUNDLE_ID: 'de.kamilunavo.familyprototype'
    steps:
      - name: Require App Store Connect credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate short-lived App Store Connect JWT
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'

          def b64url(value)
            Base64.urlsafe_encode64(value).delete('=')
          end

          now = Time.now.to_i
          header = { alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT' }
          payload = {
            iss: ENV.fetch('ASC_ISSUER_ID'),
            iat: now,
            exp: now + 600,
            aud: 'appstoreconnect-v1'
          }
          signing_input = [b64url(JSON.generate(header)), b64url(JSON.generate(payload))].join('.')
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          der_signature = key.sign(OpenSSL::Digest::SHA256.new, signing_input)
          sequence = OpenSSL::ASN1.decode(der_signature)
          r = sequence.value[0].value.to_i
          s = sequence.value[1].value.to_i
          raw_signature = [r.to_s(16).rjust(64, '0') + s.to_s(16).rjust(64, '0')].pack('H*')
          puts signing_input + '.' + b64url(raw_signature)
          RUBY
          )
          test -n "$JWT"
          echo "ASC_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Query Bundle ID and App Store Connect app record
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ASC_JWT" \
            --get 'https://api.appstoreconnect.apple.com/v1/bundleIds' \
            --data-urlencode "filter[identifier]=$BUNDLE_ID" \
            --data-urlencode 'fields[bundleIds]=name,platform,identifier' \
            > "$RUNNER_TEMP/bundle-ids.json"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ASC_JWT" \
            --get 'https://api.appstoreconnect.apple.com/v1/apps' \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId,sku,primaryLocale' \
            > "$RUNNER_TEMP/apps.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          bundles = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bundle-ids.json').read_text()).get('data', [])
          apps = json.loads((Path(os.environ['RUNNER_TEMP']) / 'apps.json').read_text()).get('data', [])
          env = Path(os.environ['GITHUB_ENV'])
          with env.open('a') as f:
              f.write(f"BUNDLE_COUNT={len(bundles)}\n")
              f.write(f"APP_COUNT={len(apps)}\n")
              f.write(f"BUNDLE_RESOURCE_ID={bundles[0]['id'] if bundles else ''}\n")
              f.write(f"APP_RESOURCE_ID={apps[0]['id'] if apps else ''}\n")
          print(f"Bundle ID matches: {len(bundles)}")
          print(f"App records: {len(apps)}")
          PY

      - name: Query provisioning profiles for Bundle ID
        if: env.BUNDLE_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ASC_JWT" \
            --get "https://api.appstoreconnect.apple.com/v1/bundleIds/$BUNDLE_RESOURCE_ID/profiles" \
            --data-urlencode 'fields[profiles]=name,platform,profileType,profileState,expirationDate' \
            > "$RUNNER_TEMP/profiles.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          profiles = json.loads((Path(os.environ['RUNNER_TEMP']) / 'profiles.json').read_text()).get('data', [])
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"PROFILE_COUNT={len(profiles)}\n")
              f.write('PROFILE_SUMMARY=' + '; '.join(
                  f"{p.get('attributes', {}).get('name', '?')} [{p.get('attributes', {}).get('profileType', '?')}/{p.get('attributes', {}).get('profileState', '?')}]"
                  for p in profiles[:10]
              ).replace('\n', ' ') + '\n')
          print(f"Profiles: {len(profiles)}")
          PY

      - name: Default profile result when Bundle ID is absent
        if: env.BUNDLE_COUNT == '0'
        shell: bash
        run: |
          echo 'PROFILE_COUNT=0' >> "$GITHUB_ENV"
          echo 'PROFILE_SUMMARY=' >> "$GITHUB_ENV"

      - name: Report Apple registration state
        if: always()
        uses: actions/github-script@v7
        env:
          BUNDLE_COUNT: ${{ env.BUNDLE_COUNT }}
          APP_COUNT: ${{ env.APP_COUNT }}
          PROFILE_COUNT: ${{ env.PROFILE_COUNT }}
          BUNDLE_RESOURCE_ID: ${{ env.BUNDLE_RESOURCE_ID }}
          APP_RESOURCE_ID: ${{ env.APP_RESOURCE_ID }}
          PROFILE_SUMMARY: ${{ env.PROFILE_SUMMARY }}
        with:
          script: |
            const body = [
              'Family Life OS Apple registration probe.',
              '',
              `- run_id: ${context.runId}`,
              `- bundle_identifier: ${process.env.BUNDLE_ID}`,
              `- bundle_id_matches: ${process.env.BUNDLE_COUNT ?? 'unknown'}`,
              `- bundle_resource_id: ${process.env.BUNDLE_RESOURCE_ID || 'none'}`,
              `- app_store_connect_app_records: ${process.env.APP_COUNT ?? 'unknown'}`,
              `- app_resource_id: ${process.env.APP_RESOURCE_ID || 'none'}`,
              `- provisioning_profiles: ${process.env.PROFILE_COUNT ?? 'unknown'}`,
              `- profile_summary: ${process.env.PROFILE_SUMMARY || 'none'}`,
              '',
              'No secret values or JWT contents are included.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Family Life OS Apple registration probe ${context.runId}`,
              body
            });

      - name: Remove API material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/bundle-ids.json "$RUNNER_TEMP"/apps.json "$RUNNER_TEMP"/profiles.json
