name: 99.9 App Store Finalize Issue Kick

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write

jobs:
  kick:
    if: contains(github.event.issue.title, 'RUN 99.9 APPSTORE FINALIZE BUILD 15')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalization workflow and record run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/acciento89-bot/onemorefloor
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/actions/workflows/99-9-appstore-finalize.yml/dispatches" \
            -d '{"ref":"main"}'
          sleep 4
          RUNS=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/actions/workflows/99-9-appstore-finalize.yml/runs?event=workflow_dispatch&per_page=10")
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' <<<"$RUNS")
          RUN_STATUS=$(jq -r '.workflow_runs[0].status // empty' <<<"$RUNS")
          RUN_SHA=$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$RUNS")
          test -n "$RUN_ID"
          printf 'run_id=%s\nstatus=%s\nhead_sha=%s\nissue=%s\n' "$RUN_ID" "$RUN_STATUS" "$RUN_SHA" "${{ github.event.issue.number }}" > /tmp/kick.txt
          CONTENT=$(base64 -w0 /tmp/kick.txt)
          OUT="$API/contents/validation/99-9-appstore-finalize-kick-result.txt"
          EXISTING=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$OUT")
          SHA=$(jq -r '.sha // empty' <<<"$EXISTING")
          PAYLOAD=$(jq -n --arg message 'Record 99.9 App Store finalize dispatch' --arg content "$CONTENT" --arg sha "$SHA" '{message:$message,content:$content,branch:"main"} + (if $sha!="" then {sha:$sha} else {} end)')
          curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d "$PAYLOAD" "$OUT" >/dev/null
