name: 99.9 App Store Finalize Issue Kick

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  kick:
    if: github.event.issue.title == 'RUN 99.9 APPSTORE FINALIZE BUILD 15'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalization workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/acciento89-bot/onemorefloor/actions/workflows/99-9-appstore-finalize.yml/dispatches \
            -d '{"ref":"main"}'
