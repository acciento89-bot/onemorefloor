name: v1.65 Environment Depth r1 macOS Review

on:
  push:
    branches:
      - agent/v1.65-environment-depth
    paths:
      - 'assets/shaders/v165_environment_surface.gdshader'
      - 'scripts/world3d_chamber_v165_environment_depth.gd'
      - 'scripts/main_v86.gd'
      - 'scenes/main.tscn'
      - 'scripts/v90_environment_depth_r1_smoke_test.gd'
      - 'scripts/v90_environment_depth_r1_capture.gd'
      - '.github/workflows/v90-environment-depth-r1-macos.yml'
  pull_request:
    paths:
      - 'assets/shaders/v165_environment_surface.gdshader'
      - 'scripts/world3d_chamber_v165_environment_depth.gd'
      - 'scripts/main_v86.gd'
      - 'scenes/main.tscn'
      - 'scripts/v90_environment_depth_r1_smoke_test.gd'
      - 'scripts/v90_environment_depth_r1_capture.gd'
      - '.github/workflows/v90-environment-depth-r1-macos.yml'

permissions:
  contents: read

env:
  GODOT_TAG: 4.7.1-stable

jobs:
  environment-depth-r1-macos:
    runs-on: macos-15
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 for macOS
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Compile active v1.65 stack
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee v165-macos-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Shader error|Failed to load script|Failed loading resource" v165-macos-import.log; then
            echo "Godot reported v1.65 compile/import errors"
            exit 1
          fi
          grep -q 'path="res://scripts/main_v86.gd"' scenes/main.tscn

      - name: Validate v1.65 environment depth r1
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://scripts/v90_environment_depth_r1_smoke_test.gd --quit-after 360 2>&1 | tee v165-macos-smoke.log
          grep -q "v1.65 environment surface and depth r1 smoke test passed" v165-macos-smoke.log

      - name: Preserve hardened v1.64 runtime material ordering
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://scripts/v89_character_lighting_r1_smoke_test.gd --quit-after 340 2>&1 | tee v164-macos-hardened.log
          grep -q "v1.64 character lighting r1 smoke test passed" v164-macos-hardened.log

      - name: Render five matched 720x1280 realm pairs
        shell: bash
        run: |
          set -o pipefail
          rm -rf artifacts/v165_environment_depth_r1
          mkdir -p artifacts/v165_environment_depth_r1
          "$GODOT" --path . --rendering-method gl_compatibility --script res://scripts/v90_environment_depth_r1_capture.gd --quit-after 520 2>&1 | tee v165-macos-capture.log
          grep -q "v1.65 environment surface and depth r1 matched visual capture passed" v165-macos-capture.log
          for realm in lower_halls ossuary iron_warden rift_descent starless_spire; do
            test -s "artifacts/v165_environment_depth_r1/before_${realm}.png"
            test -s "artifacts/v165_environment_depth_r1/after_${realm}.png"
          done

      - name: Upload v1.65 macOS matched visual review
        uses: actions/upload-artifact@v4
        with:
          name: v90-environment-depth-r1-macos-before-after
          path: artifacts/v165_environment_depth_r1/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v90-environment-depth-r1-macos-failure-logs
          path: |
            v165-macos-import.log
            v165-macos-smoke.log
            v164-macos-hardened.log
            v165-macos-capture.log
          if-no-files-found: ignore
