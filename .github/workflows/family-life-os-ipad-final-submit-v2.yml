name: Family Life OS iPad Final Submit v2

on:
  pull_request:

permissions:
  contents: read

env:
  APP_ID: '6803079524'
  VERSION_ID: 'e7a061e3-bd05-453c-a911-00e1e8cb4f76'
  VLOC_ID: '557ca16e-28b4-44d0-83ec-11d8890f0376'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  REVIEW_SUBMISSION_ID: '3b4e487e-d776-471e-abff-0fae824a72cd'

jobs:
  final-submit:
    name: Create iPad screenshots and submit Build 8
    if: github.head_ref == 'family-finalizer-trigger-2'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Family Life OS
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: main
          path: apprepo

      - name: App Store Connect authentication
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ['ASC_KEY_PATH']).write_bytes(base64.b64decode(os.environ['ASC_PRIVATE_KEY_B64']))
          PY
          chmod 600 "$ASC_KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Create compatible 13-inch iPad simulator
        id: sim
        working-directory: apprepo/apps/011-family-life-os/prototype
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project FamilyLifePrototype.xcodeproj -scheme FamilyLifePrototype -resolvePackageDependencies
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable==true and (.name|startswith("iOS")))] | sort_by(.version) | last | .identifier')
          TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name|test("iPad (Pro|Air).*13-inch"))] | last | .identifier')
          echo "Runtime=$RUNTIME"
          echo "DeviceType=$TYPE"
          if [[ -z "$TYPE" || "$TYPE" == null ]]; then
            echo 'Available iPad device types:'
            xcrun simctl list devicetypes | grep -i iPad || true
            exit 1
          fi
          UDID=$(xcrun simctl create 'FamilyLife-AppStore-iPad13' "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and capture iPad screenshots
        working-directory: apprepo/apps/011-family-life-os/prototype
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData"
          xcodebuild -project FamilyLifePrototype.xcodeproj -scheme FamilyLifePrototype -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGNING_ALLOWED=NO build
          APP=$(find "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"; test -d "$APP"
          mkdir -p "$RUNNER_TEMP/family-ipad-shots"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" >/dev/null
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/family-ipad-shots/Family-Life-OS-iPad-01.png"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -familyProReviewScreenshot >/dev/null
          sleep 3
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/family-ipad-shots/Family-Life-OS-iPad-02-Family-Pro.png"
          for f in "$RUNNER_TEMP"/family-ipad-shots/*.png; do
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "$(basename "$f"): ${W}x${H}"
            if [[ "$W" == '2064' && "$H" == '2752' ]]; then :
            elif [[ "$W" == '2048' && "$H" == '2732' ]]; then :
            else echo "Unexpected iPad screenshot size ${W}x${H}"; exit 1; fi
          done

      - name: Upload iPad screenshots
        shell: bash
        env:
          SHOT_DIR: ${{ runner.temp }}/family-ipad-shots
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib,json,os,pathlib,time,urllib.error,urllib.request
          BASE='https://api.appstoreconnect.apple.com/v1'; TOKEN=os.environ['ASC_TOKEN']; VLOC=os.environ['VLOC_ID']
          files=[pathlib.Path(os.environ['SHOT_DIR'])/n for n in ['Family-Life-OS-iPad-01.png','Family-Life-OS-iPad-02-Family-Pro.png']]
          def api(method,path,body=None):
              h={'Authorization':f'Bearer {TOKEN}','Accept':'application/json'}; data=None
              if body is not None: h['Content-Type']='application/json'; data=json.dumps(body).encode()
              req=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      raw=r.read(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: {e.read().decode()}')
          sets=api('GET',f'/appStoreVersionLocalizations/{VLOC}/appScreenshotSets?limit=50')
          set_id=next((x['id'] for x in sets.get('data',[]) if x.get('attributes',{}).get('screenshotDisplayType')=='APP_IPAD_PRO_3GEN_129'),None)
          if not set_id:
              set_id=api('POST','/appScreenshotSets',{'data':{'type':'appScreenshotSets','attributes':{'screenshotDisplayType':'APP_IPAD_PRO_3GEN_129'},'relationships':{'appStoreVersionLocalization':{'data':{'type':'appStoreVersionLocalizations','id':VLOC}}}}})['data']['id']
              print('Created iPad set',set_id)
          existing=api('GET',f'/appScreenshotSets/{set_id}/appScreenshots?limit=50')
          by_name={x.get('attributes',{}).get('fileName'):x for x in existing.get('data',[])}
          for p in files:
              name=p.name; ex=by_name.get(name)
              if ex and ex.get('attributes',{}).get('assetDeliveryState',{}).get('state')=='COMPLETE': print('Already COMPLETE',name); continue
              if ex: api('DELETE',f"/appScreenshots/{ex['id']}")
              raw=p.read_bytes(); size=len(raw)
              res=api('POST','/appScreenshots',{'data':{'type':'appScreenshots','attributes':{'fileName':name,'fileSize':size},'relationships':{'appScreenshotSet':{'data':{'type':'appScreenshotSets','id':set_id}}}}})
              sid=res['data']['id']
              for op in res['data']['attributes']['uploadOperations']:
                  off=int(op['offset']); ln=int(op['length']); chunk=raw[off:off+ln]
                  headers={x['name']:x['value'] for x in op.get('requestHeaders',[])}
                  req=urllib.request.Request(op['url'],data=chunk,headers=headers,method=op['method'])
                  with urllib.request.urlopen(req,timeout=180) as r: assert 200<=r.status<300
              api('PATCH',f'/appScreenshots/{sid}',{'data':{'type':'appScreenshots','id':sid,'attributes':{'uploaded':True,'sourceFileChecksum':hashlib.md5(raw).hexdigest()}}})
              state=''
              for _ in range(60):
                  time.sleep(2); state=api('GET',f'/appScreenshots/{sid}')['data']['attributes']['assetDeliveryState']['state']; print(name,state)
                  if state=='COMPLETE': break
                  if state=='FAILED': raise RuntimeError(f'{name} failed')
              if state!='COMPLETE': raise RuntimeError(f'{name} did not complete: {state}')
          final=api('GET',f'/appScreenshotSets/{set_id}/appScreenshots?limit=50')
          complete=[x for x in final.get('data',[]) if x.get('attributes',{}).get('assetDeliveryState',{}).get('state')=='COMPLETE']
          print('iPad screenshots COMPLETE:',len(complete))
          if len(complete)<2: raise RuntimeError('Need two COMPLETE iPad screenshots')
          PY

      - name: Attach Build 8 and add App Version to review package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BUILDS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds?filter%5Bapp%5D=$APP_ID&filter%5Bversion%5D=8&sort=-uploadedDate&limit=10")
          BID=$(jq -r '.data[0].id // empty' <<<"$BUILDS"); test -n "$BID"
          B=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds/$BID")
          test "$(jq -r '.data.attributes.version' <<<"$B")" = 8
          test "$(jq -r '.data.attributes.processingState' <<<"$B")" = VALID
          BODY=$(jq -n --arg id "$BID" '{data:{type:"builds",id:$id}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/appStoreVersions/$VERSION_ID/relationships/build" >/dev/null
          SID="$REVIEW_SUBMISSION_ID"
          S=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$S")
          if [[ "$STATE" != READY_FOR_REVIEW ]]; then
            ALL=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID/reviewSubmissions?filter%5Bplatform%5D=IOS&filter%5Bstate%5D=READY_FOR_REVIEW&limit=50")
            SID=$(jq -r '.data[0].id // empty' <<<"$ALL")
          fi
          test -n "$SID"
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          if [[ "$HAVE" -eq 0 ]]; then
            BODY=$(jq -n --arg sid "$SID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems" >/dev/null
          fi
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          SUBS=$(jq '[.data[]? | select(.relationships.subscriptionVersion.data.id != null)] | length' <<<"$ITEMS")
          echo "Package: appVersion=$HAVE subscriptions=$SUBS total=$(jq '.data|length' <<<"$ITEMS")"
          test "$HAVE" -ge 1; test "$SUBS" -ge 2
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      - name: Submit to Apple App Review
        id: submit
        shell: bash
        env:
          SID: ${{ steps.pkg.outputs.sid }}
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$R"); echo "Before submit: $STATE"
          if [[ "$STATE" == READY_FOR_REVIEW ]]; then
            BODY=$(jq -n --arg id "$SID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
            OUT="$RUNNER_TEMP/submit.json"; CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$SID")
            echo "Submit HTTP $CODE"; if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then cat "$OUT"; exit 1; fi
          fi
          FINAL=''
          for i in {1..45}; do
            sleep 4; R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID"); FINAL=$(jq -r '.data.attributes.state // empty' <<<"$R"); echo "Review state: $FINAL"
            case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
          done
          case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) ;; *) exit 1 ;; esac
          echo "state=$FINAL" >> "$GITHUB_OUTPUT"
          printf '### Family Life OS 1.0 vollständig eingereicht ✅\n- Build **8**\n- **2** iPad-13-Zoll-Screenshots\n- Family Pro Monthly + Annual\n- Apple Status **%s**\n' "$FINAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Save screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-ipad-appstore-screenshots-v2
          path: ${{ runner.temp }}/family-ipad-shots/*.png
          if-no-files-found: ignore
          retention-days: 14
