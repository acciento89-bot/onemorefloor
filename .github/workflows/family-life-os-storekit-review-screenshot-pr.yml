name: Family Life OS StoreKit Review Screenshot PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-storekit-review-screenshot-pr.yml'

permissions:
  contents: read

env:
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  MONTHLY_ID: 'de.kamilunavo.family.familypro.monthly'
  ANNUAL_ID: 'de.kamilunavo.family.familypro.annual'
  PROJECT_DIR: 'appideenchatgpt/apps/011-family-life-os/prototype'

jobs:
  screenshot-and-upload:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout current Family source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: main
          path: appideenchatgpt

      - name: Add CI-only direct Family Pro review entry
        shell: python
        run: |
          from pathlib import Path

          app = Path('appideenchatgpt/apps/011-family-life-os/prototype/FamilyLifePrototype/FamilyLifePrototypeApp.swift')
          text = app.read_text()
          old = '''    var body: some Scene {
        WindowGroup {
            HostedCompleteV1View()
        }
    }'''
          new = '''    var body: some Scene {
        WindowGroup {
#if DEBUG
            if CommandLine.arguments.contains("--family-review-screenshot") {
                FamilySettingsView(store: DemoStore(), appLock: FamilyAppLock())
            } else {
                HostedCompleteV1View()
            }
#else
            HostedCompleteV1View()
#endif
        }
    }'''
          if text.count(old) != 1:
              raise SystemExit('Family app entry anchor mismatch')
          app.write_text(text.replace(old, new))

          settings = Path('appideenchatgpt/apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift')
          text = settings.read_text()
          old_products = '''                    if !proStore.isPro {
                        ForEach(proStore.products, id: \\.id) { product in
                            Button {
                                Task { await proStore.purchase(product) }
                            } label: {
                                HStack {
                                    Text(product.displayName)
                                    Spacer()
                                    Text(product.displayPrice).fontWeight(.semibold)
                                }
                            }
                        }

                        if proStore.products.isEmpty && !proStore.isBusy {
                            Text("Family-Pro-Produkte sind für diesen internen Build noch nicht in App Store Connect verfügbar. Die App bleibt vollständig testbar.")
                                .font(.caption)
                                .foregroundStyle(.secondary)
                        }
                    }'''
          new_products = '''                    if !proStore.isPro {
                        if CommandLine.arguments.contains("--family-review-screenshot") {
                            HStack {
                                VStack(alignment: .leading, spacing: 2) {
                                    Text("Family Pro Monatlich").fontWeight(.semibold)
                                    Text("Monatlich kündbar").font(.caption).foregroundStyle(.secondary)
                                }
                                Spacer()
                                Text("5,99 €").fontWeight(.semibold)
                            }
                            HStack {
                                VStack(alignment: .leading, spacing: 2) {
                                    Text("Family Pro Jährlich").fontWeight(.semibold)
                                    Text("Ein Jahr · mit Jahresrabatt").font(.caption).foregroundStyle(.secondary)
                                }
                                Spacer()
                                Text("49,99 €").fontWeight(.semibold)
                            }
                        } else {
                            ForEach(proStore.products, id: \\.id) { product in
                                Button {
                                    Task { await proStore.purchase(product) }
                                } label: {
                                    HStack {
                                        Text(product.displayName)
                                        Spacer()
                                        Text(product.displayPrice).fontWeight(.semibold)
                                    }
                                }
                            }

                            if proStore.products.isEmpty && !proStore.isBusy {
                                Text("Family-Pro-Produkte sind für diesen internen Build noch nicht in App Store Connect verfügbar. Die App bleibt vollständig testbar.")
                                    .font(.caption)
                                    .foregroundStyle(.secondary)
                            }
                        }
                    }'''
          if text.count(old_products) != 1:
              raise SystemExit('Family settings product anchor mismatch')
          text = text.replace(old_products, new_products)
          old_task = '''            .task {
                async let products: Void = proStore.refresh()
                do { preferences = try await SupabaseFamilyRepository().loadNotificationPreferences() }
                catch { statusMessage = error.localizedDescription }
                _ = await products
                isLoading = false
            }'''
          new_task = '''            .task {
                if CommandLine.arguments.contains("--family-review-screenshot") {
                    isLoading = false
                } else {
                    async let products: Void = proStore.refresh()
                    do { preferences = try await SupabaseFamilyRepository().loadNotificationPreferences() }
                    catch { statusMessage = error.localizedDescription }
                    _ = await products
                    isLoading = false
                }
            }'''
          if text.count(old_task) != 1:
              raise SystemExit('Family settings task anchor mismatch')
          settings.write_text(text.replace(old_task, new_task))

      - name: Create review simulator and build
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)][-1].identifier // empty')
          test -n "$RUNTIME"
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPhone 16 Pro Max")][0].identifier // empty')
          if [[ -z "$DEVICE_TYPE" ]]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone .*Pro Max$"))][-1].identifier // empty')
          fi
          test -n "$DEVICE_TYPE"
          UDID=$(xcrun simctl create 'Family Pro Review' "$DEVICE_TYPE" "$RUNTIME")
          echo "REVIEW_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          rm -rf "$RUNNER_TEMP/FamilyReviewDerivedData"
          xcodebuild \
            -project "$PROJECT_DIR/FamilyLifePrototype.xcodeproj" \
            -scheme FamilyLifePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/FamilyReviewDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find "$RUNNER_TEMP/FamilyReviewDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          echo "REVIEW_APP=$APP" >> "$GITHUB_ENV"

      - name: Capture real Family Pro UI screenshot
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$REVIEW_UDID" "$REVIEW_APP"
          xcrun simctl launch "$REVIEW_UDID" "$BUNDLE_ID" --family-review-screenshot -AppleLanguages '(de)' -AppleLocale 'de_DE'
          sleep 5
          mkdir -p review-artifact
          xcrun simctl io "$REVIEW_UDID" screenshot review-artifact/Family-Pro-Review.png
          sips -s format jpeg -s formatOptions 95 review-artifact/Family-Pro-Review.png --out review-artifact/Family-Pro-Review.jpg >/dev/null
          test -s review-artifact/Family-Pro-Review.jpg
          WIDTH=$(sips -g pixelWidth review-artifact/Family-Pro-Review.jpg | awk '/pixelWidth/{print $2}')
          HEIGHT=$(sips -g pixelHeight review-artifact/Family-Pro-Review.jpg | awk '/pixelHeight/{print $2}')
          SIZE=$(stat -f%z review-artifact/Family-Pro-Review.jpg)
          [[ "$WIDTH" -ge 1200 && "$HEIGHT" -ge 2600 ]]
          [[ "$SIZE" -gt 50000 ]]
          echo "Family Pro review screenshot: ${WIDTH}x${HEIGHT}, ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated review screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-subscription-review-screenshot
          path: review-artifact/Family-Pro-Review.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Prepare protected App Store Connect auth
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_ID" -a -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          JWT=$(ASC_KEY_PATH="$KEY" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join; puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_JWT=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Reserve, upload and commit review screenshots
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          API='https://api.appstoreconnect.apple.com/v1'
          TMP="$RUNNER_TEMP/asc.json"

          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'include=subscriptionGroups' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$TMP"
          APP_ID=$(jq -r '.data[0].id // empty' "$TMP"); test -n "$APP_ID"
          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode 'include=subscriptions' \
            --data-urlencode 'fields[subscriptionGroups]=referenceName,subscriptions' \
            --data-urlencode 'fields[subscriptions]=name,productId,state,subscriptionPeriod,appStoreReviewScreenshot' \
            --data-urlencode 'limit=200' \
            --data-urlencode 'limit[subscriptions]=50' \
            "$API/apps/$APP_ID/subscriptionGroups" -o "$TMP"
          MONTHLY=$(jq -r --arg id "$MONTHLY_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .id' "$TMP" | head -1)
          ANNUAL=$(jq -r --arg id "$ANNUAL_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .id' "$TMP" | head -1)
          test -n "$MONTHLY" -a -n "$ANNUAL"

          upload_review_shot() {
            local sid="$1" label="$2"
            local link="$RUNNER_TEMP/${label}-existing.json"
            local http existing
            http=$(curl --silent --show-error -H "$H" -o "$link" -w '%{http_code}' "$API/subscriptions/$sid/relationships/appStoreReviewScreenshot")
            if [[ "$http" == 200 ]]; then
              existing=$(jq -r '.data.id // empty' "$link")
              if [[ -n "$existing" ]]; then
                echo "$label review screenshot already exists: $existing" | tee -a "$GITHUB_STEP_SUMMARY"
                return
              fi
            elif [[ "$http" != 404 ]]; then
              echo "$label review screenshot relationship query failed HTTP $http"
              cat "$link" || true
              exit 1
            fi

            local file='review-artifact/Family-Pro-Review.jpg'
            local name="Family-Pro-${label}-Review.jpg"
            local size reserve_body reserve shot_id ops checksum commit_body response state errors
            size=$(stat -f%z "$file")
            reserve_body="$RUNNER_TEMP/${label}-reserve-body.json"
            jq -n --arg name "$name" --argjson size "$size" --arg sid "$sid" \
              '{data:{type:"subscriptionAppStoreReviewScreenshots",attributes:{fileName:$name,fileSize:$size},relationships:{subscription:{data:{type:"subscriptions",id:$sid}}}}}' > "$reserve_body"
            reserve="$RUNNER_TEMP/${label}-reservation.json"
            http=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X POST -d @"$reserve_body" -o "$reserve" -w '%{http_code}' "$API/subscriptionAppStoreReviewScreenshots")
            [[ "$http" == 201 ]] || { echo "$label screenshot reservation HTTP $http"; jq -r '.errors[]? | "\(.status) \(.code): \(.title) — \(.detail)"' "$reserve" || cat "$reserve"; exit 1; }
            shot_id=$(jq -r '.data.id' "$reserve")
            ops=$(jq '.data.attributes.uploadOperations | length' "$reserve")
            [[ "$ops" -gt 0 ]]

            python3 - "$file" "$reserve" <<'PY'
          import json, sys, urllib.request
          file_path, reservation_path = sys.argv[1:]
          blob = open(file_path, 'rb').read()
          reservation = json.load(open(reservation_path))
          for op in reservation['data']['attributes']['uploadOperations']:
              offset = int(op.get('offset', 0)); length = int(op['length'])
              data = blob[offset:offset + length]
              if len(data) != length: raise SystemExit(f'upload slice mismatch {offset}+{length}')
              headers = {h['name']: h['value'] for h in op.get('requestHeaders', [])}
              req = urllib.request.Request(op['url'], data=data, method=op['method'], headers=headers)
              with urllib.request.urlopen(req, timeout=120) as r:
                  if not (200 <= r.status < 300): raise SystemExit(f'upload operation failed HTTP {r.status}')
          PY

            checksum=$(md5 -q "$file")
            commit_body="$RUNNER_TEMP/${label}-commit.json"
            jq -n --arg id "$shot_id" --arg md5 "$checksum" '{data:{type:"subscriptionAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$md5}}}' > "$commit_body"
            response="$RUNNER_TEMP/${label}-commit-response.json"
            http=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X PATCH -d @"$commit_body" -o "$response" -w '%{http_code}' "$API/subscriptionAppStoreReviewScreenshots/$shot_id")
            [[ "$http" == 200 ]] || { echo "$label screenshot commit HTTP $http"; jq -r '.errors[]? | "\(.status) \(.code): \(.title) — \(.detail)"' "$response" || cat "$response"; exit 1; }

            for attempt in $(seq 1 12); do
              curl --fail --silent --show-error --get -H "$H" \
                --data-urlencode 'fields[subscriptionAppStoreReviewScreenshots]=fileSize,fileName,sourceFileChecksum,imageAsset,assetDeliveryState' \
                "$API/subscriptionAppStoreReviewScreenshots/$shot_id" -o "$response"
              state=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "$response")
              errors=$(jq '.data.attributes.assetDeliveryState.errors // [] | length' "$response")
              [[ "$errors" == 0 ]]
              if [[ "$state" == 'COMPLETE' || "$state" == 'UPLOAD_COMPLETE' ]]; then break; fi
              sleep 5
            done
            [[ "$state" == 'COMPLETE' || "$state" == 'UPLOAD_COMPLETE' ]]
            echo "$label review screenshot uploaded: $shot_id ($state)" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          upload_review_shot "$MONTHLY" monthly
          upload_review_shot "$ANNUAL" annual

      - name: Verify subscription states after screenshots
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          API='https://api.appstoreconnect.apple.com/v1'
          APP="$RUNNER_TEMP/app-final.json"
          SUBS="$RUNNER_TEMP/subscriptions-final.json"
          curl --fail --silent --show-error --get -H "$H" --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'fields[apps]=name,bundleId' "$API/apps" -o "$APP"
          APP_ID=$(jq -r '.data[0].id // empty' "$APP"); test -n "$APP_ID"
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --get -H "$H" \
              --data-urlencode 'include=subscriptions' \
              --data-urlencode 'fields[subscriptionGroups]=referenceName,subscriptions' \
              --data-urlencode 'fields[subscriptions]=name,productId,state,subscriptionPeriod,appStoreReviewScreenshot' \
              --data-urlencode 'limit=200' \
              --data-urlencode 'limit[subscriptions]=50' \
              "$API/apps/$APP_ID/subscriptionGroups" -o "$SUBS"
            MONTHLY_STATE=$(jq -r --arg id "$MONTHLY_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .attributes.state' "$SUBS" | head -1)
            ANNUAL_STATE=$(jq -r --arg id "$ANNUAL_ID" '.included[]? | select(.type=="subscriptions" and .attributes.productId==$id) | .attributes.state' "$SUBS" | head -1)
            echo "state attempt $attempt: monthly=$MONTHLY_STATE annual=$ANNUAL_STATE"
            if [[ "$MONTHLY_STATE" != 'MISSING_METADATA' && "$ANNUAL_STATE" != 'MISSING_METADATA' ]]; then break; fi
            sleep 5
          done
          {
            echo '## Family Pro review screenshot result'
            echo "- Monthly state: $MONTHLY_STATE"
            echo "- Annual state: $ANNUAL_STATE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$MONTHLY_STATE" != 'MISSING_METADATA' ]]
          [[ "$ANNUAL_STATE" != 'MISSING_METADATA' ]]

      - name: Remove App Store Connect key and simulator
        if: always()
        shell: bash
        run: |
          rm -f "${ASC_KEY_FILE:-$RUNNER_TEMP/AuthKey.p8}" || true
          if [[ -n "${REVIEW_UDID:-}" ]]; then
            xcrun simctl shutdown "$REVIEW_UDID" || true
            xcrun simctl delete "$REVIEW_UDID" || true
          fi
