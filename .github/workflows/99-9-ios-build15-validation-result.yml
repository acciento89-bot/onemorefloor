name: 99.9 iOS Build 15 Validation Result

on:
  workflow_run:
    workflows: ["99.9 iOS Build 15 Crashlog Root Fix Validate"]
    types: [completed]

permissions:
  contents: write

jobs:
  record-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Record validation result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p validation
          cat > validation/99-9-build15-result.txt <<EOF
          run_id=$RUN_ID
          conclusion=$CONCLUSION
          head_sha=$HEAD_SHA
          run_url=$RUN_URL
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/99-9-build15-result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record 99.9 Build 15 validation result"
          git push origin HEAD:main
