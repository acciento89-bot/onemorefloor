name: 99.9 Apple Store State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-store-state.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  BUNDLE_ID: de.kamilunavo.ninenine

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Inspect 99.9 premium catalog
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          APPS=$(curl -fsSL -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          test -n "$APP_ID"
          PRODUCTS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")
          echo "APP_ID=$APP_ID"
          echo '=== PRODUCTS ==='
          jq -c '.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | {id, productId:.attributes.productId, name:.attributes.name, state:.attributes.state, type:.attributes.inAppPurchaseType}' <<<"$PRODUCTS"
          COUNT=$(jq '[.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme."))] | length' <<<"$PRODUCTS")
          echo "PREMIUM_COUNT=$COUNT"
          test "$COUNT" -eq 3

          while IFS=$'\t' read -r IID SKU; do
            echo "=== $SKU / $IID ==="
            ITEM=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IID")
            jq -c '{state:.data.attributes.state,type:.data.attributes.inAppPurchaseType}' <<<"$ITEM"
            echo '-- versions --'
            VERSIONS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IID/versions?limit=50")
            jq -c '.data[]? | {id,state:.attributes.state}' <<<"$VERSIONS"
            echo '-- availability --'
            curl -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IID/inAppPurchaseAvailability" | jq -c '{id:(.data.id // null),availableInNewTerritories:(.data.attributes.availableInNewTerritories // null)}' || true
            echo '-- manual prices --'
            curl -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchasePriceSchedules/$IID/manualPrices?limit=10" | jq -c '.data[]? | {id,startDate:.attributes.startDate,endDate:.attributes.endDate}' || true
          done < <(jq -r '.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | [.id,.attributes.productId] | @tsv' <<<"$PRODUCTS")

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$RESULT" == success ]]; then STATE=success; DESC='99.9 Apple premium catalog diagnostic passed'; else STATE=failure; DESC='99.9 Apple premium catalog diagnostic failed'; fi
          BODY=$(jq -n --arg s "$STATE" --arg d "$DESC" --arg u "$U" '{state:$s,description:$d,target_url:$u,context:"99-9/store-state"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
