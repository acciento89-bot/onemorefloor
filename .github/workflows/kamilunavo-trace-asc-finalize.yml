name: Kamilunavo Trace App Store Submit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-asc-finalize.yml'

permissions:
  contents: read

env:
  APP_ID: '6803765449'
  INFO_ID: '4d8e959a-99c5-4ba5-ad95-b294748cf2c8'
  VERSION_ID: 'a895fc57-7ee4-40e6-9f19-2881323068ea'
  DE_VLOC_ID: '70a7114f-1aa1-43fe-9f53-826a7acbda5c'
  BUILD_ID: '95961211-cde4-44a8-a821-353d6b5d26ce'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Final pre-submit gate
        run: |
          set -euo pipefail
          api(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          APP=$(api "/v1/apps/${APP_ID}?fields%5Bapps%5D=bundleId,contentRightsDeclaration")
          INFO=$(api "/v1/appInfos/${INFO_ID}?include=primaryCategory")
          VER=$(api "/v1/appStoreVersions/${VERSION_ID}")
          BUILD=$(api "/v1/builds/${BUILD_ID}?fields%5Bbuilds%5D=version,processingState,usesNonExemptEncryption")
          VLOC=$(api "/v1/appStoreVersionLocalizations/${DE_VLOC_ID}")
          REVIEW=$(api "/v1/appStoreVersions/${VERSION_ID}/appStoreReviewDetail")
          IAP=$(api "/v1/apps/${APP_ID}/inAppPurchasesV2?filter%5BproductId%5D=${PRODUCT_ID}&limit=10")
          SHOTS=$(api "/v1/appStoreVersionLocalizations/${DE_VLOC_ID}/appScreenshotSets?include=appScreenshots&limit=50&limit%5BappScreenshots%5D=50")
          AGE=$(api "/v1/appInfos/${INFO_ID}/ageRatingDeclaration")
          CURRENT=$(api "/v1/reviewSubmissions?filter%5Bapp%5D=${APP_ID}&limit=50")

          test "$(jq -r '.data.attributes.bundleId' <<<"$APP")" = 'de.kamilunavo.trace'
          test "$(jq -r '.data.attributes.contentRightsDeclaration' <<<"$APP")" = 'USES_THIRD_PARTY_CONTENT'
          test "$(jq -r '.included[]? | select(.type=="appCategories") | .id' <<<"$INFO" | head -n1)" = 'PRODUCTIVITY'
          test "$(jq -r '.data.attributes.versionString' <<<"$VER")" = '1.0'
          test "$(jq -r '.data.attributes.version' <<<"$BUILD")" = '9'
          test "$(jq -r '.data.attributes.processingState' <<<"$BUILD")" = 'VALID'
          test "$(jq -r '.data.attributes.usesNonExemptEncryption' <<<"$BUILD")" = 'false'
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.keywords // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.supportUrl // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.copyright // empty' <<<"$VER")"
          test -n "$(jq -r '.data.attributes.contactFirstName // empty' <<<"$REVIEW")"
          test -n "$(jq -r '.data.attributes.contactEmail // empty' <<<"$REVIEW")"
          test "$(jq -r '.data[0].attributes.state // empty' <<<"$IAP")" = 'READY_TO_SUBMIT'
          test "$(jq '[.included[]? | select(.type=="appScreenshots")] | length' <<<"$SHOTS")" -gt 0
          test "$(jq -r '.data.attributes.unrestrictedWebAccess' <<<"$AGE")" = 'false'
          test "$(jq -r '.data.attributes.gambling' <<<"$AGE")" = 'false'
          ACTIVE=$(jq '[.data[]? | select(.attributes.state=="READY_FOR_REVIEW" or .attributes.state=="WAITING_FOR_REVIEW" or .attributes.state=="IN_REVIEW")] | length' <<<"$CURRENT")
          test "$ACTIVE" = '0'

          IAP_ID=$(jq -r '.data[0].id' <<<"$IAP")
          test -n "$IAP_ID"
          echo "IAP_ID=$IAP_ID" >> "$GITHUB_ENV"

      - name: Resolve Lifetime Pro review version
        run: |
          set -euo pipefail
          RESP=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v2/inAppPurchases/${IAP_ID}/versions?limit=50")
          IAP_VERSION_ID=$(jq -r '[.data[] | select(.attributes.state=="PREPARE_FOR_SUBMISSION" or .attributes.state=="READY_FOR_REVIEW")][0].id // empty' <<<"$RESP")
          if [[ -n "$IAP_VERSION_ID" ]]; then
            echo "IAP_VERSION_ID=$IAP_VERSION_ID" >> "$GITHUB_ENV"
            echo "TRACE_IAP_REVIEW_VERSION=$IAP_VERSION_ID"
          else
            echo "IAP_VERSION_ID=" >> "$GITHUB_ENV"
            echo 'TRACE_IAP_REVIEW_VERSION=legacy-metadata-no-v2-version'
          fi

      - name: Create App Review submission and add app version
        run: |
          set -euo pipefail
          CREATE=$(jq -n --arg app "$APP_ID" '{data:{type:"reviewSubmissions",attributes:{platform:"IOS"},relationships:{app:{data:{type:"apps",id:$app}}}}}')
          RESP=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$CREATE" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissions')
          RID=$(jq -r '.data.id // empty' <<<"$RESP")
          test -n "$RID"
          echo "REVIEW_SUBMISSION_ID=$RID" >> "$GITHUB_ENV"

          ITEM=$(jq -n --arg rid "$RID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$ITEM" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' >/dev/null

      - name: Add Lifetime Pro to same submission when API review version exists
        if: env.IAP_VERSION_ID != ''
        run: |
          set -euo pipefail
          ITEM=$(jq -n --arg rid "$REVIEW_SUBMISSION_ID" --arg iid "$IAP_VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},inAppPurchaseVersion:{data:{type:"inAppPurchaseVersions",id:$iid}}}}}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$ITEM" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' >/dev/null

      - name: Submit for Review
        run: |
          set -euo pipefail
          BODY=$(jq -n --arg id "$REVIEW_SUBMISSION_ID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}" >/dev/null

      - name: Read back submitted state
        run: |
          set -euo pipefail
          sleep 5
          SUB=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}?include=items")
          VER=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${VERSION_ID}")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$SUB")
          VSTATE=$(jq -r '.data.attributes.appVersionState // .data.attributes.appStoreState // empty' <<<"$VER")
          ITEMS=$(jq -c '[.included[]? | select(.type=="reviewSubmissionItems") | {id,state:.attributes.state}]' <<<"$SUB")
          echo "TRACE_REVIEW_SUBMISSION_ID=$REVIEW_SUBMISSION_ID"
          echo "TRACE_REVIEW_SUBMISSION_STATE=$STATE"
          echo "TRACE_APP_VERSION_STATE=$VSTATE"
          echo "TRACE_REVIEW_ITEMS=$ITEMS"
          test "$STATE" = 'WAITING_FOR_REVIEW' -o "$STATE" = 'IN_REVIEW'
          {
            echo '## Kamilunavo Trace submitted to App Review'
            echo "- Review submission: $REVIEW_SUBMISSION_ID"
            echo "- Submission state: $STATE"
            echo "- App version state: $VSTATE"
            echo '- App Store version: 1.0'
            echo '- Build: 9'
            echo "- Lifetime Pro review version included: ${IAP_VERSION_ID:-legacy metadata path}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup protected key
        if: always()
        run: rm -f "${ASC_KEY_PATH:-}" || true
