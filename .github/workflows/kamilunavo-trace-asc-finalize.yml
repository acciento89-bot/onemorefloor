name: Kamilunavo Trace App Store Metadata Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-asc-finalize.yml'

permissions:
  contents: read

env:
  APP_ID: '6803765449'
  BUNDLE_ID: 'de.kamilunavo.trace'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Discover Trace resources read-only
        run: |
          set -euo pipefail
          api(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          APP=$(api "/v1/apps/${APP_ID}?fields%5Bapps%5D=name,bundleId,contentRightsDeclaration")
          echo "APP=$(jq -c '{id:.data.id,name:.data.attributes.name,bundleId:.data.attributes.bundleId,contentRightsDeclaration:.data.attributes.contentRightsDeclaration}' <<<"$APP")"
          INFOS=$(api "/v1/apps/${APP_ID}/appInfos?limit=50")
          echo 'APP_INFOS:'
          jq -c '.data[] | {id,attributes}' <<<"$INFOS"
          while read -r iid; do
            [[ -z "$iid" ]] && continue
            LOCS=$(api "/v1/appInfos/${iid}/appInfoLocalizations?limit=50")
            echo "APP_INFO_LOCALIZATIONS for $iid:"
            jq -c '.data[] | {id,locale:.attributes.locale,name:.attributes.name,subtitle:.attributes.subtitle,privacyPolicyUrl:.attributes.privacyPolicyUrl}' <<<"$LOCS"
          done < <(jq -r '.data[]?.id' <<<"$INFOS")
          VERSIONS=$(api "/v1/apps/${APP_ID}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50")
          echo 'APP_STORE_VERSIONS:'
          jq -c '.data[] | {id,versionString:.attributes.versionString,appVersionState:.attributes.appVersionState,appStoreState:.attributes.appStoreState,copyright:.attributes.copyright}' <<<"$VERSIONS"
          while read -r vid; do
            [[ -z "$vid" ]] && continue
            VLOCS=$(api "/v1/appStoreVersions/${vid}/appStoreVersionLocalizations?limit=200")
            echo "VERSION_LOCALIZATIONS for $vid:"
            jq -c '.data[] | {id,locale:.attributes.locale,descriptionPresent:((.attributes.description//"")|length>0),keywords:.attributes.keywords,supportUrl:.attributes.supportUrl}' <<<"$VLOCS"
            BUILD=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${vid}/build" || true)
            echo "BUILD for $vid: $(jq -c '{id:.data.id,version:.data.attributes.version}' <<<"$BUILD" 2>/dev/null || echo '{}')"
          done < <(jq -r '.data[]?.id' <<<"$VERSIONS")

      - name: Cleanup protected key
        if: always()
        run: rm -f "${ASC_KEY_PATH:-}" || true
