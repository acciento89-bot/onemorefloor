name: Kamilunavo Trace App Store Metadata Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-asc-finalize.yml'

permissions:
  contents: read

env:
  APP_ID: '6803765449'
  INFO_ID: '4d8e959a-99c5-4ba5-ad95-b294748cf2c8'
  VERSION_ID: 'a895fc57-7ee4-40e6-9f19-2881323068ea'
  DE_VLOC_ID: '70a7114f-1aa1-43fe-9f53-826a7acbda5c'
  BUILD_ID: '95961211-cde4-44a8-a821-353d6b5d26ce'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Final Trace submission audit read only
        run: |
          set -euo pipefail
          api(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          VER=$(api "/v1/appStoreVersions/${VERSION_ID}")
          BUILD=$(api "/v1/builds/${BUILD_ID}?fields%5Bbuilds%5D=version,processingState,usesNonExemptEncryption,preReleaseVersion,appStoreVersion")
          PRE=$(api "/v1/builds/${BUILD_ID}/preReleaseVersion")
          ASV=$(api "/v1/builds/${BUILD_ID}/appStoreVersion")
          INFO=$(api "/v1/appInfos/${INFO_ID}")
          AGE=$(api "/v1/appInfos/${INFO_ID}/ageRatingDeclaration")
          IAP=$(api "/v1/apps/${APP_ID}/inAppPurchasesV2?filter%5BproductId%5D=${PRODUCT_ID}&limit=10")
          SHOTS=$(api "/v1/appStoreVersionLocalizations/${DE_VLOC_ID}/appScreenshotSets?include=appScreenshots&limit=50&limit%5BappScreenshots%5D=50")
          REVIEWS=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/reviewSubmissions?filter%5Bapp%5D=${APP_ID}&limit=50" || true)

          STORE_VERSION=$(jq -r '.data.attributes.versionString' <<<"$VER")
          BUILD_NUM=$(jq -r '.data.attributes.version' <<<"$BUILD")
          PROCESSING=$(jq -r '.data.attributes.processingState' <<<"$BUILD")
          ENCRYPTION=$(jq -r '.data.attributes.usesNonExemptEncryption' <<<"$BUILD")
          BINARY_VERSION=$(jq -r '.data.attributes.version // empty' <<<"$PRE")
          ATTACHED_STORE_VERSION=$(jq -r '.data.attributes.versionString // empty' <<<"$ASV")
          INFO_STATE=$(jq -r '.data.attributes.appStoreState // .data.attributes.state // empty' <<<"$INFO")
          IAP_STATE=$(jq -r '.data[0].attributes.state // empty' <<<"$IAP")
          SHOT_COUNT=$(jq '[.included[]? | select(.type=="appScreenshots")] | length' <<<"$SHOTS")
          SETS=$(jq -c '[.data[] | {displayType:.attributes.screenshotDisplayType,count:(.relationships.appScreenshots.data|length)}]' <<<"$SHOTS")
          REVIEW_STATES=$(jq -c '[.data[]? | {id,state:.attributes.state,submittedDate:.attributes.submittedDate}]' <<<"$REVIEWS" 2>/dev/null || echo '[]')
          APP_RATING=$(jq -r '.data.attributes.appStoreAgeRating // empty' <<<"$INFO")
          AGE_WEB=$(jq -r '.data.attributes.unrestrictedWebAccess' <<<"$AGE")
          AGE_GAMBLING=$(jq -r '.data.attributes.gambling' <<<"$AGE")

          echo "TRACE_STORE_VERSION=$STORE_VERSION"
          echo "TRACE_BINARY_MARKETING_VERSION=$BINARY_VERSION"
          echo "TRACE_BUILD_NUMBER=$BUILD_NUM"
          echo "TRACE_BUILD_PROCESSING=$PROCESSING"
          echo "TRACE_USES_NON_EXEMPT_ENCRYPTION=$ENCRYPTION"
          echo "TRACE_ATTACHED_STORE_VERSION=$ATTACHED_STORE_VERSION"
          echo "TRACE_INFO_STATE=$INFO_STATE"
          echo "TRACE_APP_STORE_AGE_RATING=${APP_RATING:-pending-calculation}"
          echo "TRACE_AGE_WEB=$AGE_WEB"
          echo "TRACE_AGE_GAMBLING=$AGE_GAMBLING"
          echo "TRACE_SCREENSHOT_COUNT=$SHOT_COUNT"
          echo "TRACE_SCREENSHOT_SETS=$SETS"
          echo "TRACE_IAP_STATE=$IAP_STATE"
          echo "TRACE_REVIEW_SUBMISSIONS=$REVIEW_STATES"

          test "$BUILD_NUM" = '9'
          test "$PROCESSING" = 'VALID'
          test "$ENCRYPTION" = 'false'
          test "$IAP_STATE" = 'READY_TO_SUBMIT'
          test "$SHOT_COUNT" -gt 0
          test "$AGE_WEB" = 'false'
          test "$AGE_GAMBLING" = 'false'

          {
            echo '## Trace final read-only submission audit'
            echo "- App Store version: $STORE_VERSION"
            echo "- Binary marketing version: $BINARY_VERSION"
            echo "- Build number: $BUILD_NUM"
            echo "- Build processing: $PROCESSING"
            echo "- Uses non-exempt encryption: $ENCRYPTION"
            echo "- Build attached App Store version: $ATTACHED_STORE_VERSION"
            echo "- App info state: $INFO_STATE"
            echo "- Calculated App Store age rating: ${APP_RATING:-pending-calculation}"
            echo "- Screenshot count: $SHOT_COUNT"
            echo "- Screenshot sets: $SETS"
            echo "- Lifetime Pro: $IAP_STATE"
            echo "- Review submissions: $REVIEW_STATES"
            echo '- No mutation performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup protected key
        if: always()
        run: rm -f "${ASC_KEY_PATH:-}" || true
