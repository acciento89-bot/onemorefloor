name: v1.2 Source Fix

on:
  push:
    branches:
      - agent/v1.2-production-art-integration
    paths:
      - '.github/workflows/v12-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.2-production-art-integration
      - name: Apply strict GDScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/main_v12.gd')
          s = p.read_text()
          old1 = '\t\tvar q := base+dir*61.0'
          new1 = '\t\tvar q: Vector2 = base + dir * 61.0'
          old2 = '\tvar size_px: float = maxf(68.0,radius*2.9); if kind=="warden": size_px = radius*2.85'
          new2 = '\tvar size_px: float = maxf(68.0, radius * 2.9)\n\tif kind == "warden":\n\t\tsize_px = radius * 2.85'
          if old1 not in s:
              raise SystemExit('q source pattern not found')
          if old2 not in s:
              raise SystemExit('warden size source pattern not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'acciento89-bot'
          git config user.email 'acciento89@gmail.com'
          git add scripts/main_v12.gd
          git commit -m 'Fix strict v1.2 GDScript typing'
          git push origin HEAD:agent/v1.2-production-art-integration
