name: 99.9 Build 13 Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-build13-kick.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build 13 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/acciento89-bot/onemorefloor/actions/workflows/99-9-ios-build13-termination-fix.yml/dispatches \
            -d '{"ref":"main"}'
