name: Family Life OS Build 5 ASC Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-build5-asc-check.yml'

permissions:
  contents: read

env:
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  BUILD_NUMBER: '5'

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Prepare App Store Connect credentials
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Verify Build 5 exists
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'})); input="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          AUTH="Authorization: Bearer $JWT"; API='https://api.appstoreconnect.apple.com/v1'; TMP="$RUNNER_TEMP/asc.json"
          curl --fail-with-body --silent --show-error --get -H "$AUTH" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/apps" -o "$TMP"
          APP_ID=$(jq -r '.data[0].id // empty' "$TMP"); test -n "$APP_ID"
          curl --fail-with-body --silent --show-error --get -H "$AUTH" \
            --data-urlencode "filter[app]=$APP_ID" \
            --data-urlencode "filter[version]=$BUILD_NUMBER" \
            --data-urlencode 'fields[builds]=version,uploadedDate,processingState,expired' \
            --data-urlencode 'sort=-uploadedDate' \
            --data-urlencode 'limit=10' \
            "$API/builds" -o "$TMP"
          COUNT=$(jq '.data | length' "$TMP")
          if [[ "$COUNT" == '0' ]]; then
            echo "Build $BUILD_NUMBER not visible in App Store Connect yet." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Build $BUILD_NUMBER visible in App Store Connect." | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.data[] | "- version=\(.attributes.version) state=\(.attributes.processingState) uploaded=\(.attributes.uploadedDate) expired=\(.attributes.expired)"' "$TMP" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
