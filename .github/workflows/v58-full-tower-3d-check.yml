name: v1.45 Full Tower 3D Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v58.gd'
      - 'scripts/world3d_chamber_v145.gd'
      - 'scripts/v58_full_tower_3d_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v58-full-tower-3d-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v58.gd'
      - 'scripts/world3d_chamber_v145.gd'
      - 'scripts/v58_full_tower_3d_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v58-full-tower-3d-check.yml'

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.1-stable'

jobs:
  full-tower-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Parse full-tower 3D runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Run full-tower 3D smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v58_full_tower_3d_smoke_test.gd
