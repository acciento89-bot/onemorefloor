name: v1.63 Boss Dominance r2.1 Check

on:
  push:
    branches:
      - agent/v1.63-combat-identity
    paths:
      - 'scripts/world3d_chamber_v163_boss_dominance.gd'
      - 'scripts/main_v84.gd'
      - 'scripts/v86_boss_dominance_smoke_test.gd'
      - 'scripts/v86_boss_dominance_capture.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v86-boss-dominance-check.yml'
  pull_request:
    paths:
      - 'scripts/world3d_chamber_v163_boss_dominance.gd'
      - 'scripts/main_v84.gd'
      - 'scripts/v86_boss_dominance_smoke_test.gd'
      - 'scripts/v86_boss_dominance_capture.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v86-boss-dominance-check.yml'

permissions:
  contents: read

jobs:
  validate-boss-dominance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Compile v1.63 boss dominance r2.1
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee v163-r21-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Shader error|Failed to load script|Failed loading resource" v163-r21-import.log; then
            echo "Godot reported v1.63 r2.1 compile/import errors"
            exit 1
          fi

      - name: Validate active BossDominance correction
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v86_boss_dominance_smoke_test.gd --quit-after 340 2>&1 | tee v163-r21-smoke.log
          grep -q "v1.63 boss dominance r2.1 smoke test passed" v163-r21-smoke.log

      - name: Preserve technical r2 boss-frame layer
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v85_boss_identity_smoke_test.gd --quit-after 320 2>&1 | tee v163-r2.log
          grep -q "v1.63 boss identity r2 smoke test passed" v163-r2.log

      - name: Preserve accepted r1 projectile identity
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v83_projectile_identity_smoke_test.gd --quit-after 300 2>&1 | tee v163-r1.log
          grep -q "v1.63 projectile identity r1 smoke test passed" v163-r1.log

      - name: Preserve frozen boss baseline contract
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v84_boss_presentation_baseline_smoke_test.gd --quit-after 260 2>&1 | tee v163-boss-baseline-smoke.log
          grep -q "v1.63 boss presentation baseline smoke test passed" v163-boss-baseline-smoke.log

      - name: Preserve v1.61 r3.2 danger language
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v75_combat_presentation_r32_smoke_test.gd --quit-after 260 2>&1 | tee v161-r32.log
          grep -q "v1.61 combat presentation r3.2 smoke test passed" v161-r32.log

      - name: Render frozen boss baseline
        run: |
          set -o pipefail
          rm -rf artifacts/v163_boss_baseline
          mkdir -p artifacts/v163_boss_baseline
          xvfb-run -a ./godot --path . --script res://scripts/v84_boss_presentation_baseline_capture.gd --quit-after 300 2>&1 | tee v163-boss-baseline-capture.log
          grep -q "v1.63 boss presentation baseline visual capture passed" v163-boss-baseline-capture.log

      - name: Render v1.63 r2.1 boss dominance
        run: |
          set -o pipefail
          rm -rf artifacts/v163_boss_dominance
          mkdir -p artifacts/v163_boss_dominance
          xvfb-run -a ./godot --path . --script res://scripts/v86_boss_dominance_capture.gd --quit-after 300 2>&1 | tee v163-r21-capture.log
          grep -q "v1.63 boss dominance r2.1 visual capture passed" v163-r21-capture.log
          test -s artifacts/v163_boss_dominance/r21_boss_intro.png
          test -s artifacts/v163_boss_dominance/r21_boss_fan.png
          test -s artifacts/v163_boss_dominance/r21_boss_crown_slam.png

      - name: Upload v1.63 r2.1 before/after gate
        uses: actions/upload-artifact@v4
        with:
          name: v86-boss-dominance-before-after
          path: |
            artifacts/v163_boss_baseline/*.png
            artifacts/v163_boss_dominance/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Preserve v1.62 r3 UI contract
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v80_ui_runtime_cta_smoke_test.gd --quit-after 260 2>&1 | tee v162-r3-ui.log
          grep -q "v1.62 UI foundation r3 runtime CTA smoke test passed" v162-r3-ui.log

      - name: Preserve v1.52.1 input flow
        env:
          OMF_V66_SCENARIO: all
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v66_input_flow_smoke_test.gd --quit-after 260 2>&1 | tee v66-input.log
          grep -q "v1.52.1 tutorial/game-over input-flow smoke test passed" v66-input.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v86-boss-dominance-failure-logs
          path: |
            v163-r21-import.log
            v163-r21-smoke.log
            v163-r2.log
            v163-r1.log
            v163-boss-baseline-smoke.log
            v161-r32.log
            v163-boss-baseline-capture.log
            v163-r21-capture.log
            v162-r3-ui.log
            v66-input.log
          if-no-files-found: ignore
