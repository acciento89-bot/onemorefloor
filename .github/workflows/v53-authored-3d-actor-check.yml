name: v1.40 Authored 3D Actor Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v53.gd'
      - 'scripts/world3d_chamber.gd'
      - 'scripts/world3d_actor_factory.gd'
      - 'scripts/v53_authored_3d_actor_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v53-authored-3d-actor-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v53.gd'
      - 'scripts/world3d_chamber.gd'
      - 'scripts/world3d_actor_factory.gd'
      - 'scripts/v53_authored_3d_actor_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v53-authored-3d-actor-check.yml'

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.1-stable'

jobs:
  authored-3d-actors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Parse authored 3D actor runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Run authored 3D actor smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v53_authored_3d_actor_smoke_test.gd
