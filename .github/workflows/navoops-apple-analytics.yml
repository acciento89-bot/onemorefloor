name: NavoOps Apple Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-apple-analytics.yml'

permissions:
  contents: write

env:
  ANALYTICS_PATH: generated/navoops/apple-analytics.json

concurrency:
  group: navoops-apple-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v5

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b(JSON.generate({alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT'}))
          p = b(JSON.generate({iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 900, aud: 'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64, '0')].pack('H*') }.join
          puts "#{input}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Collect Apple analytics
        env:
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          mkdir -p "$(dirname "$ANALYTICS_PATH")"

          NOTES='[]'
          APPLE_AVAILABLE=false
          COMMERCIAL_AVAILABLE=false
          MONETIZATION_AVAILABLE=false

          safe_error_note() {
            local path="$1"
            local fallback="$2"
            if jq -e . "$path" >/dev/null 2>&1; then
              jq -r --arg fallback "$fallback" '(.errors[0]? | [(.status // ""), (.code // ""), (.title // ""), (.detail // "")] | map(select(length > 0)) | join(" · ")) // $fallback' "$path"
            else
              printf '%s' "$fallback"
            fi
          }

          request_json() {
            local output="$1"
            local url="$2"
            shift 2
            curl --retry 3 --retry-all-errors --retry-delay 2 -sSL -G \
              -o "$output" -w '%{http_code}' \
              -H "Authorization: Bearer $ASC_TOKEN" \
              "$@" "$url" || true
          }

          APPS_FILE="$RUNNER_TEMP/asc-apps.json"
          APPS_HTTP=$(request_json "$APPS_FILE" "$API/v1/apps" \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[apps]=name,bundleId')

          if [[ "$APPS_HTTP" =~ ^2 ]]; then
            APPS=$(cat "$APPS_FILE")
            APPLE_AVAILABLE=true
            echo "App Store Connect app inventory: HTTP $APPS_HTTP"
          elif [[ -s generated/navoops/store-status.json ]]; then
            APPS=$(jq -c '{data:[.apps[]? | select(.provider == "apple") | {id:.externalID,attributes:{name:.appName,bundleId:.bundleOrPackageID}}]}' generated/navoops/store-status.json)
            SAFE=$(safe_error_note "$APPS_FILE" "HTTP ${APPS_HTTP:-000}")
            NOTES=$(jq -c --arg note "Direct Apple app inventory unavailable ($SAFE); using the latest sanitized store-status inventory as fallback." '. + [$note]' <<<"$NOTES")
            echo "Direct app inventory unavailable: $SAFE; continuing with store-status fallback."
          else
            SAFE=$(safe_error_note "$APPS_FILE" "HTTP ${APPS_HTTP:-000}")
            NOTES=$(jq -c --arg note "Apple app inventory unavailable ($SAFE); no fallback inventory exists." '. + [$note]' <<<"$NOTES")
            APPS='{"data":[]}'
            echo "Apple app inventory unavailable: $SAFE"
          fi

          SALES_MAP='{}'
          if [[ -n "${ASC_VENDOR_NUMBER:-}" ]]; then
            SALES_GZ="$RUNNER_TEMP/apple-sales.tsv.gz"
            SALES_HTTP=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sSL -G \
              -o "$SALES_GZ" -w '%{http_code}' \
              -H "Authorization: Bearer $ASC_TOKEN" \
              -H 'Accept: application/a-gzip' \
              --data-urlencode "filter[vendorNumber]=$ASC_VENDOR_NUMBER" \
              --data-urlencode 'filter[reportType]=SALES' \
              --data-urlencode 'filter[reportSubType]=SUMMARY' \
              --data-urlencode 'filter[frequency]=DAILY' \
              --data-urlencode 'filter[version]=1_0' \
              "$API/v1/salesReports" || true)

            if [[ "$SALES_HTTP" =~ ^2 ]] && gzip -t "$SALES_GZ" >/dev/null 2>&1; then
              export SALES_GZ
              SALES_MAP=$(python3 <<'PY'
          import csv, gzip, json, os
          from collections import defaultdict

          result = defaultdict(lambda: {'units': 0, 'proceeds': defaultdict(float)})
          with gzip.open(os.environ['SALES_GZ'], 'rt', encoding='utf-8-sig', errors='replace', newline='') as handle:
              reader = csv.DictReader(handle, delimiter='\t')
              for row in reader:
                  app_id = (row.get('Apple Identifier') or row.get('Apple ID') or '').strip()
                  if not app_id:
                      continue
                  try:
                      units = int(float((row.get('Units') or '0').replace(',', '.')))
                  except ValueError:
                      units = 0
                  result[app_id]['units'] += units
                  currency = (row.get('Developer Proceeds Currency') or row.get('Currency of Proceeds') or row.get('Customer Currency') or '').strip()
                  raw = (row.get('Developer Proceeds') or '0').strip().replace(',', '.')
                  try:
                      per_unit = float(raw)
                  except ValueError:
                      per_unit = 0.0
                  if currency:
                      result[app_id]['proceeds'][currency] += per_unit * units

          clean = {
              app_id: {
                  'units': item['units'],
                  'proceeds': [
                      {'currency': currency, 'amount': round(amount, 6)}
                      for currency, amount in sorted(item['proceeds'].items())
                  ]
              }
              for app_id, item in result.items()
          }
          print(json.dumps(clean, separators=(',', ':')))
          PY
              )
              COMMERCIAL_AVAILABLE=true
              APPLE_AVAILABLE=true
              echo "Apple Sales and Trends: HTTP $SALES_HTTP"
            else
              SAFE=$(safe_error_note "$SALES_GZ" "HTTP ${SALES_HTTP:-000}")
              NOTES=$(jq -c --arg note "Apple Sales and Trends unavailable ($SAFE). Check the API role and ASC_VENDOR_NUMBER." '. + [$note]' <<<"$NOTES")
              echo "Apple Sales and Trends unavailable: $SAFE"
            fi
          else
            NOTES=$(jq -c '. + ["ASC_VENDOR_NUMBER is not configured; Apple Sales and Trends units/proceeds remain unavailable."]' <<<"$NOTES")
          fi

          ITEMS='[]'
          MONETIZATION_FAILURES=0
          while IFS=$'\t' read -r APP_ID APP_NAME BUNDLE_ID; do
            [[ -n "$APP_ID" ]] || continue

            IAPS_FILE="$RUNNER_TEMP/iaps-${APP_ID}.json"
            IAPS_HTTP=$(request_json "$IAPS_FILE" "$API/v1/apps/$APP_ID/inAppPurchasesV2" \
              --data-urlencode 'limit=200' \
              --data-urlencode 'fields[inAppPurchases]=name,productId,inAppPurchaseType,state')
            if [[ "$IAPS_HTTP" =~ ^2 ]]; then
              IAPS=$(cat "$IAPS_FILE")
              IAP_COUNT_JSON=$(jq '[.data[]?] | length' <<<"$IAPS")
              IAP_ACTION=$(jq '[.data[]? | .attributes.state // "" | select(. == "DEVELOPER_ACTION_NEEDED" or . == "REJECTED" or . == "MISSING_METADATA")] | length' <<<"$IAPS")
              MONETIZATION_AVAILABLE=true
              APPLE_AVAILABLE=true
            else
              IAP_COUNT_JSON='null'
              IAP_ACTION=0
              MONETIZATION_FAILURES=$((MONETIZATION_FAILURES + 1))
            fi

            GROUPS_FILE="$RUNNER_TEMP/subscriptions-${APP_ID}.json"
            GROUPS_HTTP=$(request_json "$GROUPS_FILE" "$API/v1/apps/$APP_ID/subscriptionGroups" \
              --data-urlencode 'limit=200' \
              --data-urlencode 'include=subscriptions' \
              --data-urlencode 'fields[subscriptionGroups]=referenceName,subscriptions' \
              --data-urlencode 'fields[subscriptions]=name,productId,state,subscriptionPeriod,groupLevel')
            if [[ "$GROUPS_HTTP" =~ ^2 ]]; then
              GROUPS=$(cat "$GROUPS_FILE")
              SUB_COUNT_JSON=$(jq '[.included[]? | select(.type == "subscriptions")] | length' <<<"$GROUPS")
              SUB_ACTION=$(jq '[.included[]? | select(.type == "subscriptions") | .attributes.state // "" | select(. == "DEVELOPER_ACTION_NEEDED" or . == "REJECTED" or . == "MISSING_METADATA")] | length' <<<"$GROUPS")
              MONETIZATION_AVAILABLE=true
              APPLE_AVAILABLE=true
            else
              SUB_COUNT_JSON='null'
              SUB_ACTION=0
              MONETIZATION_FAILURES=$((MONETIZATION_FAILURES + 1))
            fi

            if [[ "$IAP_COUNT_JSON" == 'null' && "$SUB_COUNT_JSON" == 'null' ]]; then
              ACTION_JSON='null'
            else
              ACTION_JSON=$((IAP_ACTION + SUB_ACTION))
            fi

            SALES=$(jq -c --arg id "$APP_ID" '.[$id] // {}' <<<"$SALES_MAP")
            UNITS=$(jq -r '.units // empty' <<<"$SALES")
            PROCEEDS=$(jq -c '.proceeds // []' <<<"$SALES")

            ITEM=$(jq -n \
              --arg provider 'apple' \
              --arg appName "$APP_NAME" \
              --arg externalID "$APP_ID" \
              --arg bundle "$BUNDLE_ID" \
              --arg periodStart "$NOW" \
              --arg periodEnd "$NOW" \
              --arg units "$UNITS" \
              --argjson proceeds "$PROCEEDS" \
              --argjson subscriptions "$SUB_COUNT_JSON" \
              --argjson oneTime "$IAP_COUNT_JSON" \
              --argjson action "$ACTION_JSON" \
              '{provider:$provider,appName:$appName,externalID:$externalID,bundleOrPackageID:$bundle,periodStart:$periodStart,periodEnd:$periodEnd,units:(if $units=="" then null else ($units|tonumber) end),downloads:null,proceeds:$proceeds,activeSubscriptions:null,subscriptionProducts:$subscriptions,oneTimeProducts:$oneTime,productsNeedingAction:$action,crashRate:null,userPerceivedCrashRate:null,anrRate:null,userPerceivedAnrRate:null,detail:"App Store Connect inventory, monetization and optional Sales & Trends"}')
            ITEMS=$(jq -c --argjson item "$ITEM" '. + [$item]' <<<"$ITEMS")
          done < <(jq -r '.data[]? | [.id,.attributes.name,.attributes.bundleId] | @tsv' <<<"$APPS")

          if [[ "$MONETIZATION_AVAILABLE" != 'true' ]]; then
            NOTES=$(jq -c '. + ["Apple in-app purchase/subscription inventory is unavailable with the current App Store Connect API role."]' <<<"$NOTES")
          elif (( MONETIZATION_FAILURES > 0 )); then
            NOTES=$(jq -c --arg count "$MONETIZATION_FAILURES" '. + [($count + " Apple monetization endpoint requests were unavailable; affected fields remain null.")]' <<<"$NOTES")
          fi

          jq -n \
            --argjson schemaVersion 1 \
            --arg generatedAt "$NOW" \
            --arg sourceRepository "$GITHUB_REPOSITORY" \
            --argjson appleAvailable "$APPLE_AVAILABLE" \
            --argjson googleAvailable false \
            --argjson commercialAvailable "$COMMERCIAL_AVAILABLE" \
            --argjson reliabilityAvailable false \
            --argjson apps "$ITEMS" \
            --argjson notes "$NOTES" \
            '{schemaVersion:$schemaVersion,generatedAt:$generatedAt,sourceRepository:$sourceRepository,appleAvailable:$appleAvailable,googleAvailable:$googleAvailable,commercialAvailable:$commercialAvailable,reliabilityAvailable:$reliabilityAvailable,apps:$apps,notes:$notes}' \
            > "$ANALYTICS_PATH"

          jq empty "$ANALYTICS_PATH"
          echo "Apple analytics snapshots: $(jq '.apps | length' "$ANALYTICS_PATH")"
          echo "Apple source available: $APPLE_AVAILABLE; monetization: $MONETIZATION_AVAILABLE; commercial: $COMMERCIAL_AVAILABLE"

      - name: Commit refreshed analytics feed
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/apple-analytics.json"
          cp "$ANALYTICS_PATH" "$SNAPSHOT"
          git config user.name 'kamilunavo-ops-bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$ANALYTICS_PATH")"
            cp "$SNAPSHOT" "$ANALYTICS_PATH"
            git add "$ANALYTICS_PATH"
            if git diff --cached --quiet; then
              echo 'Apple analytics feed unchanged.'
              exit 0
            fi
            git commit -m 'chore: refresh NavoOps Apple analytics'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
