name: NavoOps Apple Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-apple-analytics.yml'

permissions:
  contents: write

env:
  ANALYTICS_PATH: generated/navoops/apple-analytics.json

concurrency:
  group: navoops-apple-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v5

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b(JSON.generate({alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT'}))
          p = b(JSON.generate({iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 900, aud: 'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64, '0')].pack('H*') }.join
          puts "#{input}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Collect Apple analytics
        env:
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ANALYTICS_PATH")"
          test -n "${ASC_TOKEN:-}"

          ANALYTICS_PATH="$ANALYTICS_PATH" ASC_TOKEN="$ASC_TOKEN" ASC_VENDOR_NUMBER="${ASC_VENDOR_NUMBER:-}" python3 <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API = 'https://api.appstoreconnect.apple.com'
          TOKEN = os.environ['ASC_TOKEN']
          VENDOR = os.environ.get('ASC_VENDOR_NUMBER', '').strip()
          FEED_PATH = os.environ['ANALYTICS_PATH']
          NOW = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          notes = []
          apple_available = False
          commercial_available = False
          monetization_available = False

          def note(message):
              if message not in notes:
                  notes.append(message)

          def error_detail(data, fallback):
              try:
                  payload = json.loads(data.decode('utf-8', errors='replace')) if isinstance(data, (bytes, bytearray)) else data
                  first = (payload.get('errors') or [{}])[0]
                  parts = [str(first.get(key, '')).strip() for key in ('status', 'code', 'title', 'detail')]
                  parts = [part for part in parts if part]
                  return ' · '.join(parts) if parts else fallback
              except Exception:
                  return fallback

          def request(path, params=None, accept='application/json', attempts=4):
              query = urllib.parse.urlencode(params or {}, doseq=True)
              url = API + path + (('?' + query) if query else '')
              headers = {
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': accept,
                  'User-Agent': 'Kamilunavo-NavoOps/1.3'
              }
              last_status = 0
              last_body = b''
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers, method='GET')
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.status, response.read(), dict(response.headers)
                  except urllib.error.HTTPError as exc:
                      last_status = exc.code
                      last_body = exc.read()
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == attempts - 1:
                          return last_status, last_body, dict(exc.headers)
                  except Exception as exc:
                      last_status = 0
                      last_body = str(exc).encode('utf-8', errors='replace')
                      if attempt == attempts - 1:
                          return last_status, last_body, {}
                  time.sleep(2 ** attempt)
              return last_status, last_body, {}

          def request_json(path, params=None):
              status, body, headers = request(path, params=params)
              payload = None
              if 200 <= status < 300:
                  try:
                      payload = json.loads(body.decode('utf-8'))
                  except Exception:
                      note(f'{path}: Apple returned HTTP {status} but the response was not valid JSON.')
              return status, payload, body, headers

          def paginated_json(path, params=None):
              items = []
              next_url = None
              base_params = dict(params or {})
              while True:
                  if next_url:
                      parsed = urllib.parse.urlparse(next_url)
                      status, payload, body, _ = request_json(parsed.path, dict(urllib.parse.parse_qsl(parsed.query)))
                  else:
                      status, payload, body, _ = request_json(path, base_params)
                  if not (200 <= status < 300) or payload is None:
                      return status, None, body
                  items.extend(payload.get('data') or [])
                  next_url = ((payload.get('links') or {}).get('next'))
                  if not next_url:
                      break
              return 200, {'data': items}, b''

          # App inventory
          apps_status, apps_payload, apps_body = paginated_json('/v1/apps', {
              'limit': '200',
              'fields[apps]': 'name,bundleId'
          })

          if apps_payload is None:
              fallback_path = 'generated/navoops/store-status.json'
              if os.path.exists(fallback_path):
                  try:
                      with open(fallback_path, 'r', encoding='utf-8') as handle:
                          fallback = json.load(handle)
                      apps_payload = {
                          'data': [
                              {
                                  'id': item.get('externalID'),
                                  'attributes': {
                                      'name': item.get('appName'),
                                      'bundleId': item.get('bundleOrPackageID')
                                  }
                              }
                              for item in fallback.get('apps', [])
                              if item.get('provider') == 'apple' and item.get('externalID')
                          ]
                      }
                      note(f'Direct Apple app inventory unavailable ({error_detail(apps_body, f"HTTP {apps_status or 0}")}); using sanitized store-status inventory.')
                  except Exception as exc:
                      apps_payload = {'data': []}
                      note(f'Apple app inventory unavailable and fallback could not be read: {exc}')
              else:
                  apps_payload = {'data': []}
                  note(f'Apple app inventory unavailable ({error_detail(apps_body, f"HTTP {apps_status or 0}")}).')
          else:
              apple_available = True
              print(f'App Store Connect app inventory: HTTP {apps_status}; apps={len(apps_payload.get("data") or [])}')

          # Sales & Trends (daily report; Apple does not require reportDate for DAILY).
          sales_map = {}
          if VENDOR:
              sales_status, sales_body, _ = request('/v1/salesReports', {
                  'filter[vendorNumber]': VENDOR,
                  'filter[reportType]': 'SALES',
                  'filter[reportSubType]': 'SUMMARY',
                  'filter[frequency]': 'DAILY',
                  'filter[version]': '1_0'
              }, accept='application/a-gzip')

              if 200 <= sales_status < 300:
                  try:
                      raw = gzip.decompress(sales_body)
                      reader = csv.DictReader(io.StringIO(raw.decode('utf-8-sig', errors='replace')), delimiter='\t')
                      for row in reader:
                          app_id = (row.get('Apple Identifier') or row.get('Apple ID') or '').strip()
                          if not app_id:
                              continue
                          try:
                              units = int(float((row.get('Units') or '0').replace(',', '.')))
                          except (TypeError, ValueError):
                              units = 0
                          currency = (row.get('Developer Proceeds Currency') or row.get('Currency of Proceeds') or row.get('Customer Currency') or '').strip()
                          try:
                              per_unit = float((row.get('Developer Proceeds') or '0').strip().replace(',', '.'))
                          except (TypeError, ValueError):
                              per_unit = 0.0
                          entry = sales_map.setdefault(app_id, {'units': 0, 'proceeds': {}})
                          entry['units'] += units
                          if currency:
                              entry['proceeds'][currency] = entry['proceeds'].get(currency, 0.0) + (per_unit * units)
                      commercial_available = True
                      apple_available = True
                      print(f'Apple Sales and Trends: HTTP {sales_status}; apps-with-sales={len(sales_map)}')
                  except Exception as exc:
                      note(f'Apple Sales and Trends returned HTTP {sales_status}, but parsing failed: {type(exc).__name__}: {exc}')
              else:
                  note(f'Apple Sales and Trends unavailable ({error_detail(sales_body, f"HTTP {sales_status or 0}")}). Check ASC role/vendor number.')
          else:
              note('ASC_VENDOR_NUMBER is not configured; Apple Sales and Trends units/proceeds remain unavailable.')

          apps = []
          monetization_failures = 0

          for app in apps_payload.get('data') or []:
              app_id = str(app.get('id') or '').strip()
              attrs = app.get('attributes') or {}
              app_name = str(attrs.get('name') or '').strip() or app_id
              bundle_id = str(attrs.get('bundleId') or '').strip()
              if not app_id:
                  continue

              iap_count = None
              sub_count = None
              action_count = None
              app_action = 0
              app_money_accessible = False

              iap_status, iap_payload, iap_body = paginated_json(f'/v1/apps/{urllib.parse.quote(app_id)}/inAppPurchasesV2', {
                  'limit': '200',
                  'fields[inAppPurchases]': 'name,productId,inAppPurchaseType,state'
              })
              if iap_payload is not None:
                  iaps = iap_payload.get('data') or []
                  iap_count = len(iaps)
                  app_action += sum(1 for item in iaps if ((item.get('attributes') or {}).get('state') or '') in {'DEVELOPER_ACTION_NEEDED', 'REJECTED', 'MISSING_METADATA'})
                  app_money_accessible = True
              else:
                  monetization_failures += 1
                  note(f'{app_name}: IAP inventory unavailable ({error_detail(iap_body, f"HTTP {iap_status or 0}")}).')

              sub_status, sub_payload, sub_body, _ = request_json(f'/v1/apps/{urllib.parse.quote(app_id)}/subscriptionGroups', {
                  'limit': '200',
                  'include': 'subscriptions',
                  'fields[subscriptionGroups]': 'referenceName,subscriptions',
                  'fields[subscriptions]': 'name,productId,state,subscriptionPeriod,groupLevel'
              })
              if sub_payload is not None:
                  subscriptions = [item for item in (sub_payload.get('included') or []) if item.get('type') == 'subscriptions']
                  sub_count = len(subscriptions)
                  app_action += sum(1 for item in subscriptions if ((item.get('attributes') or {}).get('state') or '') in {'DEVELOPER_ACTION_NEEDED', 'REJECTED', 'MISSING_METADATA'})
                  app_money_accessible = True
              else:
                  monetization_failures += 1
                  note(f'{app_name}: subscription inventory unavailable ({error_detail(sub_body, f"HTTP {sub_status or 0}")}).')

              if app_money_accessible:
                  monetization_available = True
                  apple_available = True
                  action_count = app_action

              sale = sales_map.get(app_id, {})
              proceeds = [
                  {'currency': currency, 'amount': round(amount, 6)}
                  for currency, amount in sorted((sale.get('proceeds') or {}).items())
              ]

              apps.append({
                  'provider': 'apple',
                  'appName': app_name,
                  'externalID': app_id,
                  'bundleOrPackageID': bundle_id,
                  'periodStart': NOW,
                  'periodEnd': NOW,
                  'units': sale.get('units') if app_id in sales_map else None,
                  'downloads': None,
                  'proceeds': proceeds,
                  'activeSubscriptions': None,
                  'subscriptionProducts': sub_count,
                  'oneTimeProducts': iap_count,
                  'productsNeedingAction': action_count,
                  'crashRate': None,
                  'userPerceivedCrashRate': None,
                  'anrRate': None,
                  'userPerceivedAnrRate': None,
                  'detail': 'App Store Connect inventory, monetization and Sales & Trends'
              })

          if not monetization_available:
              note('Apple in-app purchase/subscription inventory is unavailable with the current App Store Connect API role.')
          elif monetization_failures:
              note(f'{monetization_failures} Apple monetization endpoint requests were unavailable; affected fields remain null.')

          feed = {
              'schemaVersion': 1,
              'generatedAt': NOW,
              'sourceRepository': os.environ.get('GITHUB_REPOSITORY', 'acciento89-bot/onemorefloor'),
              'appleAvailable': apple_available,
              'googleAvailable': False,
              'commercialAvailable': commercial_available,
              'reliabilityAvailable': False,
              'apps': apps,
              'notes': notes
          }

          os.makedirs(os.path.dirname(FEED_PATH), exist_ok=True)
          with open(FEED_PATH, 'w', encoding='utf-8') as handle:
              json.dump(feed, handle, ensure_ascii=False, indent=2)
              handle.write('\n')

          print(f'Apple analytics snapshots: {len(apps)}')
          print(f'Apple source available: {apple_available}; monetization: {monetization_available}; commercial: {commercial_available}')
          print(f'Notes: {len(notes)}')
          PY

          jq empty "$ANALYTICS_PATH"

      - name: Commit refreshed analytics feed
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/apple-analytics.json"
          cp "$ANALYTICS_PATH" "$SNAPSHOT"
          git config user.name 'kamilunavo-ops-bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$ANALYTICS_PATH")"
            cp "$SNAPSHOT" "$ANALYTICS_PATH"
            git add "$ANALYTICS_PATH"
            if git diff --cached --quiet; then
              echo 'Apple analytics feed unchanged.'
              exit 0
            fi
            git commit -m 'chore: refresh NavoOps Apple analytics'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
