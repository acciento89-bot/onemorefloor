name: Kamilunavo Trace Build 5 IAP Review Screenshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-iap-review-screenshot-build5.yml'

permissions:
  contents: read

env:
  BUNDLE_ID: 'de.kamilunavo.trace'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'
  TRACE_REF: '128da643cb8b5320546242ba511118d18a2edb07'
  PROJECT_DIR: 'appideenchatgpt/apps/002-evidaro/prototype'

jobs:
  screenshot-and-upload:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout accepted Trace Build 5 source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.TRACE_REF }}
          path: appideenchatgpt

      - name: Verify Trace release identity
        shell: bash
        run: |
          set -euo pipefail
          cd appideenchatgpt
          test "$(git rev-parse HEAD)" = "$TRACE_REF"
          python3 apps/002-evidaro/ci/preflight.py
          python3 apps/002-evidaro/ci/release_preflight.py
          python3 apps/002-evidaro/ci/public_identity_preflight.py

      - name: Add CI-only direct Pro review entry
        shell: python
        run: |
          from pathlib import Path

          app = Path('appideenchatgpt/apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift')
          text = app.read_text()
          old = '''        WindowGroup {
            AppLockGateView(store: store, appLock: appLock)
#if DEBUG
                .task {
                    await PersistenceSmokeRunner.runIfRequested(using: store)
                    await AppLockSmokeRunner.runIfRequested()
                    await EvidenceBundleSmokeRunner.runIfRequested(using: store)
                }
#endif
        }'''
          new = '''        WindowGroup {
#if DEBUG
            if CommandLine.arguments.contains("--trace-review-screenshot") {
                ProUpgradeView(entitlement: EntitlementStore.shared)
            } else {
                AppLockGateView(store: store, appLock: appLock)
                    .task {
                        await PersistenceSmokeRunner.runIfRequested(using: store)
                        await AppLockSmokeRunner.runIfRequested()
                        await EvidenceBundleSmokeRunner.runIfRequested(using: store)
                    }
            }
#else
            AppLockGateView(store: store, appLock: appLock)
#endif
        }'''
          if text.count(old) != 1:
              raise SystemExit('Trace app entry anchor mismatch')
          app.write_text(text.replace(old, new))

          pro = Path('appideenchatgpt/apps/002-evidaro/prototype/EvidaroPrototype/ProUpgradeView.swift')
          text = pro.read_text()
          text = text.replace(
              'Text(entitlement.displayPrice)',
              'Text(CommandLine.arguments.contains("--trace-review-screenshot") ? "14,99 €" : entitlement.displayPrice)',
              1
          )
          old_error = '''                    if let message = entitlement.lastErrorMessage, !message.isEmpty {
                        Text(message)
                            .font(.footnote)
                            .foregroundStyle(.red)
                            .frame(maxWidth: .infinity, alignment: .leading)
                    }'''
          new_error = '''                    if !CommandLine.arguments.contains("--trace-review-screenshot"),
                       let message = entitlement.lastErrorMessage, !message.isEmpty {
                        Text(message)
                            .font(.footnote)
                            .foregroundStyle(.red)
                            .frame(maxWidth: .infinity, alignment: .leading)
                    }'''
          if text.count(old_error) != 1:
              raise SystemExit('Trace Pro error anchor mismatch')
          pro.write_text(text.replace(old_error, new_error))

      - name: Create review simulator and build
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)][-1].identifier // empty')
          test -n "$RUNTIME"
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPhone 16 Pro Max")][0].identifier // empty')
          if [[ -z "$DEVICE_TYPE" ]]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone .*Pro Max$"))][-1].identifier // empty')
          fi
          test -n "$DEVICE_TYPE"
          UDID=$(xcrun simctl create 'Trace IAP Review Build 5' "$DEVICE_TYPE" "$RUNTIME")
          echo "REVIEW_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          rm -rf "$RUNNER_TEMP/TraceReviewDerivedData"
          xcodebuild \
            -project "$PROJECT_DIR/EvidaroPrototype.xcodeproj" \
            -scheme EvidaroPrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/TraceReviewDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find "$RUNNER_TEMP/TraceReviewDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          echo "REVIEW_APP=$APP" >> "$GITHUB_ENV"

      - name: Capture Kamilunavo Trace Pro review screenshot
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$REVIEW_UDID" "$REVIEW_APP"
          xcrun simctl launch "$REVIEW_UDID" "$BUNDLE_ID" --trace-review-screenshot -AppleLanguages '(de)' -AppleLocale 'de_DE'
          sleep 6
          mkdir -p review-artifact
          xcrun simctl io "$REVIEW_UDID" screenshot review-artifact/Trace-Pro-Review.png
          sips -s format jpeg -s formatOptions 95 review-artifact/Trace-Pro-Review.png --out review-artifact/Trace-Pro-Review.jpg >/dev/null
          test -s review-artifact/Trace-Pro-Review.jpg
          WIDTH=$(sips -g pixelWidth review-artifact/Trace-Pro-Review.jpg | awk '/pixelWidth/{print $2}')
          HEIGHT=$(sips -g pixelHeight review-artifact/Trace-Pro-Review.jpg | awk '/pixelHeight/{print $2}')
          SIZE=$(stat -f%z review-artifact/Trace-Pro-Review.jpg)
          [[ "$WIDTH" -ge 1200 && "$HEIGHT" -ge 2600 ]]
          [[ "$SIZE" -gt 50000 ]]
          echo "Trace Pro review screenshot: ${WIDTH}x${HEIGHT}, ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve generated review screenshot
        uses: actions/upload-artifact@v4
        with:
          name: kamilunavo-trace-build5-iap-review-screenshot
          path: review-artifact/Trace-Pro-Review.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Prepare protected App Store Connect auth
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_ID" -a -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          JWT=$(ASC_KEY_PATH="$KEY" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_JWT=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Upload App Review screenshot to Lifetime Pro
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          API='https://api.appstoreconnect.apple.com/v1'
          APP="$RUNNER_TEMP/app.json"
          IAP="$RUNNER_TEMP/iap.json"

          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            "$API/apps" -o "$APP"
          APP_ID=$(jq -r '.data[0].id // empty' "$APP"); test -n "$APP_ID"

          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[productId]=$PRODUCT_ID" \
            --data-urlencode 'fields[inAppPurchases]=productId,state,appStoreReviewScreenshot' \
            "$API/apps/$APP_ID/inAppPurchasesV2" -o "$IAP"
          IAP_ID=$(jq -r '.data[0].id // empty' "$IAP"); test -n "$IAP_ID"
          BEFORE_STATE=$(jq -r '.data[0].attributes.state // empty' "$IAP")
          echo "Lifetime Pro state before screenshot: $BEFORE_STATE" >> "$GITHUB_STEP_SUMMARY"

          LINK="$RUNNER_TEMP/existing-shot.json"
          HTTP=$(curl --silent --show-error -H "$H" -o "$LINK" -w '%{http_code}' "https://api.appstoreconnect.apple.com/v2/inAppPurchases/$IAP_ID/relationships/appStoreReviewScreenshot")
          EXISTING=''
          if [[ "$HTTP" == 200 ]]; then EXISTING=$(jq -r '.data.id // empty' "$LINK"); fi
          if [[ -n "$EXISTING" ]]; then
            echo "App Review screenshot already exists: $EXISTING" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "SHOT_ID=$EXISTING" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ "$HTTP" == 200 || "$HTTP" == 404 ]]

          FILE='review-artifact/Trace-Pro-Review.jpg'
          NAME='Kamilunavo-Trace-Pro-Review.jpg'
          SIZE=$(stat -f%z "$FILE")
          RESERVE_BODY="$RUNNER_TEMP/reserve.json"
          jq -n --arg name "$NAME" --argjson size "$SIZE" --arg iap "$IAP_ID" \
            '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",attributes:{fileName:$name,fileSize:$size},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iap}}}}}' > "$RESERVE_BODY"
          RESERVE="$RUNNER_TEMP/reservation.json"
          HTTP=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X POST -d @"$RESERVE_BODY" -o "$RESERVE" -w '%{http_code}' "$API/inAppPurchaseAppStoreReviewScreenshots")
          [[ "$HTTP" == 201 ]] || { echo "Screenshot reservation HTTP $HTTP"; jq -r '.errors[]? | "\(.status) \(.code): \(.title) — \(.detail)"' "$RESERVE" || cat "$RESERVE"; exit 1; }
          SHOT_ID=$(jq -r '.data.id' "$RESERVE")
          echo "SHOT_ID=$SHOT_ID" >> "$GITHUB_ENV"
          [[ "$(jq '.data.attributes.uploadOperations | length' "$RESERVE")" -gt 0 ]]

          python3 - "$FILE" "$RESERVE" <<'PY'
          import json, sys, urllib.request
          file_path, reservation_path = sys.argv[1:]
          blob = open(file_path, 'rb').read()
          reservation = json.load(open(reservation_path))
          for op in reservation['data']['attributes']['uploadOperations']:
              offset = int(op.get('offset', 0)); length = int(op['length'])
              data = blob[offset:offset + length]
              if len(data) != length: raise SystemExit(f'upload slice mismatch {offset}+{length}')
              headers = {h['name']: h['value'] for h in op.get('requestHeaders', [])}
              request = urllib.request.Request(op['url'], data=data, method=op['method'], headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status < 200 or response.status >= 300:
                      raise SystemExit(f'upload operation failed HTTP {response.status}')
          PY

          CHECKSUM=$(md5 -q "$FILE")
          COMMIT_BODY="$RUNNER_TEMP/commit.json"
          jq -n --arg id "$SHOT_ID" --arg md5 "$CHECKSUM" '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$md5}}}' > "$COMMIT_BODY"
          COMMIT="$RUNNER_TEMP/commit-response.json"
          HTTP=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X PATCH -d @"$COMMIT_BODY" -o "$COMMIT" -w '%{http_code}' "$API/inAppPurchaseAppStoreReviewScreenshots/$SHOT_ID")
          [[ "$HTTP" == 200 ]] || { echo "Screenshot commit HTTP $HTTP"; jq -r '.errors[]? | "\(.status) \(.code): \(.title) — \(.detail)"' "$COMMIT" || cat "$COMMIT"; exit 1; }
          echo "Lifetime Pro App Review screenshot uploaded: $SHOT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify screenshot delivery and Lifetime Pro state
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          API='https://api.appstoreconnect.apple.com/v1'
          if [[ -n "${SHOT_ID:-}" ]]; then
            for attempt in $(seq 1 12); do
              OUT="$RUNNER_TEMP/shot-status.json"
              HTTP=$(curl --silent --show-error --get -H "$H" \
                --data-urlencode 'fields[inAppPurchaseAppStoreReviewScreenshots]=fileSize,fileName,sourceFileChecksum,imageAsset,assetDeliveryState' \
                -o "$OUT" -w '%{http_code}' "$API/inAppPurchaseAppStoreReviewScreenshots/$SHOT_ID")
              if [[ "$HTTP" != 200 ]]; then sleep 5; continue; fi
              STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "$OUT")
              ERRORS=$(jq '.data.attributes.assetDeliveryState.errors // [] | length' "$OUT")
              echo "review screenshot delivery attempt $attempt: ${STATE:-unknown}"
              [[ "$ERRORS" == 0 ]]
              if [[ "$STATE" == 'COMPLETE' || "$STATE" == 'UPLOAD_COMPLETE' ]]; then break; fi
              sleep 5
            done
          fi

          APP_ID=$(jq -r '.data[0].id // empty' "$RUNNER_TEMP/app.json")
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --get -H "$H" \
              --data-urlencode "filter[productId]=$PRODUCT_ID" \
              --data-urlencode 'fields[inAppPurchases]=productId,state,appStoreReviewScreenshot,inAppPurchaseAvailability' \
              "$API/apps/$APP_ID/inAppPurchasesV2" -o "$RUNNER_TEMP/final-iap.json"
            IAP_STATE=$(jq -r '.data[0].attributes.state // empty' "$RUNNER_TEMP/final-iap.json")
            echo "Lifetime Pro state attempt $attempt: $IAP_STATE"
            if [[ "$IAP_STATE" != 'MISSING_METADATA' ]]; then break; fi
            sleep 5
          done
          echo "Lifetime Pro final state: $IAP_STATE" >> "$GITHUB_STEP_SUMMARY"
          [[ "$IAP_STATE" != 'MISSING_METADATA' ]]
          case "$IAP_STATE" in
            DEVELOPER_ACTION_NEEDED|REJECTED|DEVELOPER_REMOVED_FROM_SALE|REMOVED_FROM_SALE) exit 1 ;;
          esac

      - name: Remove App Store Connect key and simulator
        if: always()
        shell: bash
        run: |
          rm -f "${ASC_KEY_FILE:-$RUNNER_TEMP/AuthKey.p8}" || true
          if [[ -n "${REVIEW_UDID:-}" ]]; then
            xcrun simctl shutdown "$REVIEW_UDID" || true
            xcrun simctl delete "$REVIEW_UDID" || true
          fi
