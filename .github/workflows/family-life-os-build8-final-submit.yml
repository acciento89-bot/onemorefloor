name: Family Life OS Build 8 Final Submit

on:
  pull_request:

permissions:
  contents: read

env:
  APP_ID: '6803079524'
  APP_INFO_ID: '8a251f47-904a-4333-b2a8-3a3a06bb4fa2'
  VERSION_ID: 'e7a061e3-bd05-453c-a911-00e1e8cb4f76'
  VLOC_ID: '557ca16e-28b4-44d0-83ec-11d8890f0376'
  REVIEW_SUBMISSION_ID: '3b4e487e-d776-471e-abff-0fae824a72cd'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  TEAM_ID: 'TKG684N5GL'
  BUILD_NUMBER: '8'
  MARKETING_VERSION: '1.0'
  REVIEW_EMAIL: 'apple-review@kamilunavo.com'
  SUPABASE_URL: 'https://bqctetqraszsvknczjjr.supabase.co'
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_g4PeQGT99Tz2ltwdAzyXrA_NoYDXsP9'

jobs:
  family-build8-submit:
    name: Family Life OS Build 8 + App Review submit
    if: github.head_ref == 'family-finalizer-trigger-2'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify App Store metadata and review login credentials
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          APP=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID")
          test "$(jq -r '.data.attributes.contentRightsDeclaration // empty' <<<"$APP")" = 'USES_THIRD_PARTY_CONTENT'
          CAT=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appInfos/$APP_INFO_ID/primaryCategory")
          test "$(jq -r '.data.id // empty' <<<"$CAT")" = 'PRODUCTIVITY'
          LOC=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersionLocalizations/$VLOC_ID")
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$LOC")"
          test -n "$(jq -r '.data.attributes.keywords // empty' <<<"$LOC")"
          test -n "$(jq -r '.data.attributes.supportUrl // empty' <<<"$LOC")"
          REVIEW=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersions/$VERSION_ID/appStoreReviewDetail")
          test "$(jq -r '.data.attributes.demoAccountRequired // false' <<<"$REVIEW")" = true
          test "$(jq -r '.data.attributes.demoAccountName // empty' <<<"$REVIEW")" = "$REVIEW_EMAIL"
          REVIEW_PASSWORD=$(jq -r '.data.attributes.demoAccountPassword // empty' <<<"$REVIEW")
          test -n "$REVIEW_PASSWORD"
          AUTH_BODY=$(jq -n --arg e "$REVIEW_EMAIL" --arg p "$REVIEW_PASSWORD" '{email:$e,password:$p}')
          HTTP=$(curl -sS -o "$RUNNER_TEMP/review-auth.json" -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d "$AUTH_BODY")
          test "$HTTP" = 200
          test -n "$(jq -r '.access_token // empty' "$RUNNER_TEMP/review-auth.json")"
          echo '✅ App Review email/password credentials authenticate successfully.' >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Family Life OS source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/acciento89-bot/appideenchatgpt.git "$RUNNER_TEMP/appideenchatgpt"
          cd "$RUNNER_TEMP/appideenchatgpt"
          git log -1 --oneline
          grep -F 'auth.signIn(' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/HostedCompleteV1View.swift
          grep -F 'SecureField("Passwort"' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/HostedCompleteV1View.swift

      - name: Build signed-release archive for Build 8
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/appideenchatgpt/apps/011-family-life-os/prototype"
          xcodebuild -project FamilyLifePrototype.xcodeproj -scheme FamilyLifePrototype -resolvePackageDependencies
          ARCHIVE="$RUNNER_TEMP/FamilyLifePrototype-Build8.xcarchive"
          rm -rf "$ARCHIVE"
          xcodebuild \
            -project FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive
          test -f "$ARCHIVE/Info.plist"
          test -d "$ARCHIVE/Products/Applications/FamilyLifePrototype.app"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/FamilyLifeBuild8Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo '✅ Build 8 upload handed to App Store Connect.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Build 8 processing and attach it to version 1.0
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BUILD_ID=''
          STATE=''
          for i in {1..60}; do
            sleep 10
            BUILDS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds?filter%5Bapp%5D=$APP_ID&filter%5Bversion%5D=$BUILD_NUMBER&include=preReleaseVersion&sort=-uploadedDate&limit=10")
            BUILD_ID=$(jq -r --arg mv "$MARKETING_VERSION" '[.data[] as $b | select(any(.included[]?; .type=="preReleaseVersions" and .id==$b.relationships.preReleaseVersion.data.id and .attributes.version==$mv)) | $b.id] | first // empty' <<<"$BUILDS")
            if [[ -z "$BUILD_ID" ]]; then BUILD_ID=$(jq -r '.data[0].id // empty' <<<"$BUILDS"); fi
            if [[ -n "$BUILD_ID" ]]; then
              ONE=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds/$BUILD_ID")
              STATE=$(jq -r '.data.attributes.processingState // empty' <<<"$ONE")
              echo "Build 8 processing: $STATE"
              [[ "$STATE" == VALID ]] && break
              [[ "$STATE" == INVALID ]] && exit 1
            fi
          done
          test -n "$BUILD_ID"
          test "$STATE" = VALID
          REL=$(jq -n --arg bid "$BUILD_ID" '{data:{type:"builds",id:$bid}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/build-rel.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$REL" "$BASE/v1/appStoreVersions/$VERSION_ID/relationships/build")
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then cat "$RUNNER_TEMP/build-rel.json" >&2; exit 1; fi
          ATTACHED=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersions/$VERSION_ID/build")
          test "$(jq -r '.data.id // empty' <<<"$ATTACHED")" = "$BUILD_ID"
          test "$(jq -r '.data.attributes.version // empty' <<<"$ATTACHED")" = "$BUILD_NUMBER"
          echo '✅ Build 8 is VALID and attached to App Store version 1.0.' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate real iPad Pro App Store screenshot
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/appideenchatgpt"
          DEVICES=$(xcrun simctl list devices available -j)
          UDID=$(jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true) | select(.name | test("iPad Pro 13-inch|iPad Pro \\(12.9-inch\\) \\(6th generation\\)"))] | last | .udid // empty' <<<"$DEVICES")
          if [[ -z "$UDID" ]]; then
            UDID=$(jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true) | select(.name | contains("iPad Pro"))] | last | .udid // empty' <<<"$DEVICES")
          fi
          test -n "$UDID"
          echo "Using iPad simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 09:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          DD="$RUNNER_TEMP/FamilyLifeScreenshotDerivedData"
          xcodebuild \
            -project apps/011-family-life-os/prototype/FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$DD" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find "$DD/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -familyProReviewScreenshot
          sleep 5
          SHOT="$RUNNER_TEMP/Family-Life-OS-iPad-Pro.png"
          xcrun simctl io "$UDID" screenshot "$SHOT"
          test -s "$SHOT"
          W=$(sips -g pixelWidth "$SHOT" 2>/dev/null | awk '/pixelWidth/ {print $2}')
          H=$(sips -g pixelHeight "$SHOT" 2>/dev/null | awk '/pixelHeight/ {print $2}')
          echo "Screenshot size: ${W}x${H}"
          case "${W}x${H}" in 2048x2732|2064x2752|2732x2048|2752x2064) ;; *) echo 'Unexpected iPad screenshot size' >&2; exit 1 ;; esac
          echo "IPAD_SCREENSHOT=$SHOT" >> "$GITHUB_ENV"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Upload required iPad screenshot
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          get(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "$BASE$1"; }
          post(){ curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$2" "$BASE$1"; }
          patch(){ curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$2" "$BASE$1"; }
          SETS=$(get "/v1/appStoreVersionLocalizations/$VLOC_ID/appScreenshotSets?filter%5BscreenshotDisplayType%5D=APP_IPAD_PRO_3GEN_129&include=appScreenshots&limit=50")
          SET_ID=$(jq -r '.data[0].id // empty' <<<"$SETS")
          if [[ -z "$SET_ID" ]]; then
            BODY=$(jq -n --arg loc "$VLOC_ID" '{data:{type:"appScreenshotSets",attributes:{screenshotDisplayType:"APP_IPAD_PRO_3GEN_129"},relationships:{appStoreVersionLocalization:{data:{type:"appStoreVersionLocalizations",id:$loc}}}}}')
            CREATED=$(post '/v1/appScreenshotSets' "$BODY")
            SET_ID=$(jq -r '.data.id // empty' <<<"$CREATED")
          fi
          test -n "$SET_ID"
          CURRENT=$(get "/v1/appScreenshotSets/$SET_ID/appScreenshots?limit=50")
          COMPLETE_COUNT=$(jq '[.data[]? | select(.attributes.assetDeliveryState.state=="COMPLETE")] | length' <<<"$CURRENT")
          if [[ "$COMPLETE_COUNT" -eq 0 ]]; then
            SIZE=$(stat -f%z "$IPAD_SCREENSHOT")
            NAME=$(basename "$IPAD_SCREENSHOT")
            BODY=$(jq -n --arg set "$SET_ID" --arg name "$NAME" --argjson size "$SIZE" '{data:{type:"appScreenshots",attributes:{fileName:$name,fileSize:$size},relationships:{appScreenshotSet:{data:{type:"appScreenshotSets",id:$set}}}}}')
            RESERVED=$(post '/v1/appScreenshots' "$BODY")
            SCREENSHOT_ID=$(jq -r '.data.id // empty' <<<"$RESERVED")
            test -n "$SCREENSHOT_ID"
            printf '%s' "$RESERVED" > "$RUNNER_TEMP/screenshot-reservation.json"
            python3 - "$RUNNER_TEMP/screenshot-reservation.json" "$IPAD_SCREENSHOT" <<'PY'
          import json, sys, urllib.request
          rp, image_path = sys.argv[1:3]
          with open(rp, encoding='utf-8') as f: reservation=json.load(f)
          with open(image_path,'rb') as image:
              for op in reservation['data']['attributes']['uploadOperations']:
                  image.seek(op['offset']); data=image.read(op['length'])
                  headers={h['name']:h['value'] for h in op.get('requestHeaders',[])}
                  req=urllib.request.Request(op['url'],data=data,method=op['method'],headers=headers)
                  with urllib.request.urlopen(req) as response:
                      if not 200 <= response.status < 300: raise RuntimeError(response.status)
          PY
            SUM=$(md5 -q "$IPAD_SCREENSHOT")
            COMMIT=$(jq -n --arg id "$SCREENSHOT_ID" --arg sum "$SUM" '{data:{type:"appScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$sum}}}')
            patch "/v1/appScreenshots/$SCREENSHOT_ID" "$COMMIT" >/dev/null
            STATE=''
            for i in {1..30}; do
              sleep 4
              S=$(get "/v1/appScreenshots/$SCREENSHOT_ID")
              STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' <<<"$S")
              echo "Screenshot state: $STATE"
              [[ "$STATE" == COMPLETE ]] && break
              [[ "$STATE" == FAILED ]] && { jq '.data.attributes.assetDeliveryState' <<<"$S" >&2; exit 1; }
            done
            test "$STATE" = COMPLETE
          fi
          echo '✅ Required iPad Pro screenshot is present.' >> "$GITHUB_STEP_SUMMARY"

      - name: Add app version to Family Pro review package
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SID="$REVIEW_SUBMISSION_ID"
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?include=appStoreVersion,subscriptionVersion,subscriptionGroupVersion&limit=50")
          if ! jq -e --arg vid "$VERSION_ID" '.included[]? | select(.type=="appStoreVersions" and .id==$vid)' <<<"$ITEMS" >/dev/null; then
            BODY=$(jq -n --arg sid "$SID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            OUT="$RUNNER_TEMP/app-item.json"
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems")
            echo "Add app version item HTTP $CODE"
            if [[ "$CODE" != 201 ]]; then cat "$OUT" >&2; exit 1; fi
          fi
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?include=appStoreVersion,subscriptionVersion,subscriptionGroupVersion&limit=50")
          COUNT=$(jq '.data | length' <<<"$ITEMS")
          echo "Review package item count: $COUNT"
          test "$COUNT" -ge 4
          test "$(jq '[.included[]? | select(.type=="appStoreVersions" and .id=="'"$VERSION_ID"'")] | length' <<<"$ITEMS")" -ge 1
          echo '✅ App 1.0 + Family Pro monthly + annual are in one review package.' >> "$GITHUB_STEP_SUMMARY"

      - name: Submit Family Life OS to Apple App Review
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SID="$REVIEW_SUBMISSION_ID"
          BEFORE=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          BEFORE_STATE=$(jq -r '.data.attributes.state // empty' <<<"$BEFORE")
          echo "Before submit: $BEFORE_STATE"
          if [[ "$BEFORE_STATE" == READY_FOR_REVIEW ]]; then
            BODY=$(jq -n --arg id "$SID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
            OUT="$RUNNER_TEMP/submit.json"
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$SID")
            echo "Submit HTTP $CODE"
            if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then cat "$OUT" >&2; exit 1; fi
          fi
          STATE=''
          for i in {1..30}; do
            sleep 4
            R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
            STATE=$(jq -r '.data.attributes.state // empty' <<<"$R")
            echo "Review submission state: $STATE"
            case "$STATE" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
          done
          case "$STATE" in
            WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE)
              echo "✅ Family Life OS 1.0 Build 8 + Family Pro submitted to Apple: $STATE" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "Unexpected review state: $STATE" >&2; exit 1 ;;
          esac

      - name: Cleanup
        if: always()
        run: |
          [[ -z "${SIM_UDID:-}" ]] || xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/review-auth.json "$RUNNER_TEMP"/build-rel.json "$RUNNER_TEMP"/screenshot-reservation.json "$RUNNER_TEMP"/app-item.json "$RUNNER_TEMP"/submit.json
