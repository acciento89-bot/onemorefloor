name: 99.9 Apple Identifier Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-apple-identifier-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  BUNDLE_ID: de.kamilunavo.ninenine
  BUNDLE_NAME: Nine Nine

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          post_status() {
            local context="$1" state="$2" description="$3"
            BODY=$(jq -n --arg s "$state" --arg d "$description" --arg u "$U" --arg c "$context" '{state:$s,description:$d,target_url:$u,context:$c}')
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null
          }
          post_status '99-9/apple-identifier' pending 'Registering 99.9% Bundle ID'
          post_status '99-9/app-record' pending 'Checking App Store Connect app record'

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'}))
          s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Ensure Bundle ID exists
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          EXIST_FILE="$RUNNER_TEMP/bundle-list.json"
          LIST_HTTP=$(curl -sS -o "$EXIST_FILE" -w '%{http_code}' -G -H "Authorization: Bearer $ASC_TOKEN" \
            --data-urlencode "filter[identifier]=$BUNDLE_ID" --data-urlencode 'limit=10' "$API/v1/bundleIds")
          if [[ "$LIST_HTTP" != 200 ]]; then
            echo "Apple bundleIds list failed: HTTP $LIST_HTTP"
            jq . "$EXIST_FILE" 2>/dev/null || cat "$EXIST_FILE"
            exit 1
          fi
          BID=$(jq -r '.data[0].id // empty' "$EXIST_FILE")
          if [[ -z "$BID" ]]; then
            BODY=$(jq -n --arg identifier "$BUNDLE_ID" --arg name "$BUNDLE_NAME" \
              '{data:{type:"bundleIds",attributes:{identifier:$identifier,name:$name,platform:"IOS"}}}')
            CREATE_FILE="$RUNNER_TEMP/bundle-create.json"
            CREATE_HTTP=$(curl -sS -o "$CREATE_FILE" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' \
              -d "$BODY" "$API/v1/bundleIds")
            if [[ "$CREATE_HTTP" != 201 ]]; then
              echo "Apple bundleIds create failed: HTTP $CREATE_HTTP"
              jq . "$CREATE_FILE" 2>/dev/null || cat "$CREATE_FILE"
              exit 1
            fi
            BID=$(jq -r '.data.id // empty' "$CREATE_FILE")
            test -n "$BID"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "bundle_resource_id=$BID" >> "$GITHUB_OUTPUT"
          echo "Bundle resource ID: $BID" >> "$GITHUB_STEP_SUMMARY"

      - name: Check App Store Connect app record
        id: app
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          APP_FILE="$RUNNER_TEMP/apps.json"
          APP_HTTP=$(curl -sS -o "$APP_FILE" -w '%{http_code}' -G -H "Authorization: Bearer $ASC_TOKEN" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'limit=10' "$API/v1/apps")
          if [[ "$APP_HTTP" != 200 ]]; then
            echo "Apple apps lookup failed: HTTP $APP_HTTP"
            jq . "$APP_FILE" 2>/dev/null || cat "$APP_FILE"
            exit 1
          fi
          APP_ID=$(jq -r '.data[0].id // empty' "$APP_FILE")
          if [[ -n "$APP_ID" ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
            echo "App Store Connect app ID: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'App record does not exist yet. Apple currently requires creating the New App record in App Store Connect UI.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish result statuses
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_CREATED: ${{ steps.bundle.outputs.created }}
          APP_EXISTS: ${{ steps.app.outputs.exists }}
          APP_ID: ${{ steps.app.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          post_status() {
            local context="$1" state="$2" description="$3"
            BODY=$(jq -n --arg s "$state" --arg d "$description" --arg u "$U" --arg c "$context" '{state:$s,description:$d,target_url:$u,context:$c}')
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null
          }
          if [[ "$BUNDLE_CREATED" == true ]]; then
            post_status '99-9/apple-identifier' success '99.9% Bundle ID registered'
          else
            post_status '99-9/apple-identifier' success '99.9% Bundle ID already exists'
          fi
          if [[ "$APP_EXISTS" == true ]]; then
            post_status '99-9/app-record' success "App record found: ${APP_ID}"
          else
            post_status '99-9/app-record' pending 'Create 99.9% New App record in App Store Connect'
          fi

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg u "$U" '{state:"failure",description:"99.9% Apple identifier bridge failed",target_url:$u,context:"99-9/apple-identifier"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Remove key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
