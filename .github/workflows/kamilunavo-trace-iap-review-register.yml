name: Kamilunavo Trace Lifetime Pro Review Metadata Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-iap-review-register.yml'

permissions:
  contents: read

concurrency:
  group: trace-iap-review-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: 'de.kamilunavo.trace'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'

jobs:
  verify-apple-metadata:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_ID" -a -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/jwt.rb" <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          JWT=$(ASC_KEY_PATH="$KEY" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ruby "$RUNNER_TEMP/jwt.rb")
          echo "ASC_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Read Lifetime Pro screenshot and metadata state
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          curl --fail --silent --show-error --get -H "$H" --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'fields[apps]=name,bundleId' 'https://api.appstoreconnect.apple.com/v1/apps' -o "$RUNNER_TEMP/app.json"
          test "$(jq '.data | length' "$RUNNER_TEMP/app.json")" = 1
          APP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/app.json")
          curl --fail --silent --show-error --get -H "$H" --data-urlencode "filter[productId]=$PRODUCT_ID" --data-urlencode 'fields[inAppPurchases]=productId,state,appStoreReviewScreenshot' "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/inAppPurchasesV2" -o "$RUNNER_TEMP/iap.json"
          test "$(jq '.data | length' "$RUNNER_TEMP/iap.json")" = 1
          IAP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/iap.json")
          IAP_STATE=$(jq -r '.data[0].attributes.state' "$RUNNER_TEMP/iap.json")
          curl --fail --silent --show-error -H "$H" "https://api.appstoreconnect.apple.com/v2/inAppPurchases/$IAP_ID/relationships/appStoreReviewScreenshot" -o "$RUNNER_TEMP/relationship.json"
          SHOT_ID=$(jq -r '.data.id // empty' "$RUNNER_TEMP/relationship.json")
          test -n "$SHOT_ID"
          curl --fail --silent --show-error --get -H "$H" --data-urlencode 'fields[inAppPurchaseAppStoreReviewScreenshots]=fileName,fileSize,sourceFileChecksum,imageAsset,assetDeliveryState' "https://api.appstoreconnect.apple.com/v1/inAppPurchaseAppStoreReviewScreenshots/$SHOT_ID" -o "$RUNNER_TEMP/shot.json"
          ASSET_STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "$RUNNER_TEMP/shot.json")
          ERROR_COUNT=$(jq '(.data.attributes.assetDeliveryState.errors // []) | length' "$RUNNER_TEMP/shot.json")
          echo "TRACE_IAP_ID=$IAP_ID"
          echo "TRACE_IAP_STATE=$IAP_STATE"
          echo "TRACE_REVIEW_SCREENSHOT_ID=$SHOT_ID"
          echo "TRACE_REVIEW_SCREENSHOT_ASSET_STATE=$ASSET_STATE"
          echo "TRACE_REVIEW_SCREENSHOT_ERROR_COUNT=$ERROR_COUNT"
          jq -c '.data.attributes.assetDeliveryState.errors // []' "$RUNNER_TEMP/shot.json"
          echo "Lifetime Pro IAP state: $IAP_STATE" >> "$GITHUB_STEP_SUMMARY"
          echo "App Review screenshot: $SHOT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshot asset state: $ASSET_STATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshot delivery errors: $ERROR_COUNT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$ASSET_STATE" == COMPLETE || "$ASSET_STATE" == UPLOAD_COMPLETE ]]
          [[ "$ERROR_COUNT" == 0 ]]
          [[ "$IAP_STATE" != MISSING_METADATA ]]

      - name: Cleanup protected key
        if: always()
        shell: bash
        run: rm -f "${ASC_KEY_PATH:-}" || true
