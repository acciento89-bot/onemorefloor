name: v1.58 Composition Rescue Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v72.gd'
      - 'scripts/menu3d_stage_v158.gd'
      - 'scripts/v72_composition_rescue_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v72-composition-rescue-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v72.gd'
      - 'scripts/menu3d_stage_v158.gd'
      - 'scripts/v72_composition_rescue_smoke_test.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v72-composition-rescue-check.yml'

permissions:
  contents: read

jobs:
  validate-composition-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and parse v1.58
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|glTF:.*ERROR" parse.log; then
            echo "Godot reported v1.58 import/parse errors"
            exit 1
          fi

      - name: Validate v1.58 composition rescue
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v72_composition_rescue_smoke_test.gd --quit-after 120 2>&1 | tee v72-composition.log
          grep -q "v1.58 composition rescue smoke test passed" v72-composition.log

      - name: Re-run v1.57 lookdev regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v71_3d_lookdev_smoke_test.gd --quit-after 120 2>&1 | tee v71-lookdev.log
          grep -q "v1.57 production 3D lookdev smoke test passed" v71-lookdev.log

      - name: Re-run v1.55 Wanderer regression
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v69_wanderer_production_smoke_test.gd --quit-after 120 2>&1 | tee v69-wanderer.log
          grep -q "v1.55 production Wanderer model takeover smoke test passed" v69-wanderer.log

      - name: Re-run v1.52.1 input-flow regression
        env:
          OMF_V66_SCENARIO: all
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v66_input_flow_smoke_test.gd --quit-after 120 2>&1 | tee v66-input-flow.log
          grep -q "v1.52.1 tutorial/game-over input-flow smoke test passed" v66-input-flow.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v72-composition-rescue-failure-logs
          path: |
            parse.log
            v72-composition.log
            v71-lookdev.log
            v69-wanderer.log
            v66-input-flow.log
          if-no-files-found: ignore
