name: Dispatch 99.9 Build 17 Unsigned Bridge

# Retry marker: false-positive pipefail verification fixed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-build17-unsigned-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start unsigned Build 17 bridge workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/99-9-ios-build17-app-review.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Unsigned Build 17 bridge dispatch accepted.'