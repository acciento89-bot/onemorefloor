name: 99.9 Build 8 AdMob Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-build8-admob-validation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: acciento89-bot/99-9
  SOURCE_REF: 85aa91e1fffea288f42255cf4705ec92f80183c5
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'

jobs:
  godot-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false
      - name: Install native AdMob templates
        working-directory: source
        run: bash scripts/ci_install_admob.sh all
      - name: Download Godot and parse
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" parse.log; then exit 1; fi
          ./godot --headless --path . --quit-after 5 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" smoke.log; then exit 1; fi

  ios-admob-iap:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false
      - name: Install AdMob iOS package and Godot
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"; echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"; mkdir -p "$T" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd
      - name: Export and compile IAP + AdMob iOS project
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj
          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh
          grep -q 'GodotIap.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -R -q 'ca-app-pub-3940256099942544~1458002511' build/ios
          grep -R -q 'GoogleMobileAds' build/ios
          xcodebuild -project build/ios/NineNine.xcodeproj -list -json > "$RUNNER_TEMP/xcode.json"
          SCHEME=$(python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode.json'))['project']
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY
          )
          test -n "$SCHEME"
          xcodebuild -project build/ios/NineNine.xcodeproj -scheme "$SCHEME" -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

  android-admob-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK, AdMob and Godot templates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          bash scripts/ci_install_admob.sh android
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"; mkdir -p "$T" templates
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/. "$T/"
          ./godot --headless --editor --path . --quit
          rm -rf android/build && mkdir -p android/build
          unzip -q "$T/android_source.zip" -d android/build
          printf '%s\n' "${GODOT_VERSION}.stable" > android/.build_version
          chmod +x android/build/gradlew
          test -f addons/admob/android/bin/ads/poing_godot_admob_ads.gd
      - name: Export and inspect Android APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          APK="build/android/99-9.apk"
          ./godot --headless --path . --export-debug "Android Playtest" "$APK"
          test -s "$APK"
          echo "APK built: $(du -h "$APK" | cut -f1)"

          APKANALYZER="$(command -v apkanalyzer || true)"
          if [[ -z "$APKANALYZER" ]]; then
            APKANALYZER="$ANDROID_HOME/tools/bin/apkanalyzer"
          fi
          test -x "$APKANALYZER"

          echo '--- Manifest verification ---'
          "$APKANALYZER" manifest print "$APK" | tee build/android/manifest.xml
          grep -F 'ca-app-pub-3940256099942544~3347511713' build/android/manifest.xml
          echo 'AdMob demo app ID present ✅'

          echo '--- DEX dependency verification ---'
          "$APKANALYZER" dex packages "$APK" | tee build/android/dex-packages.txt
          grep -F 'com.google.android.gms.ads' build/android/dex-packages.txt
          echo 'Google Mobile Ads classes present ✅'
          grep -F 'com.android.billingclient' build/android/dex-packages.txt
          echo 'Google Play Billing classes present ✅'

# Status is published by 99-9-build8-admob-validation-status.yml.
