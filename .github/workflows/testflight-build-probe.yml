name: TestFlight Build Inventory Probe

on:
  pull_request:
    paths:
      - '.github/workflows/testflight-build-probe.yml'

permissions:
  contents: read

jobs:
  read-build-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Query App Store Connect build inventory
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          BUNDLE_ID: de.kamilunavo.onemorefloor
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          python3 -m pip install --quiet PyJWT cryptography
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          import jwt

          issuer = os.environ['ASC_ISSUER_ID']
          key_id = os.environ['ASC_KEY_ID']
          bundle_id = os.environ['BUNDLE_ID']
          key_path = os.path.join(os.environ['RUNNER_TEMP'], f'AuthKey_{key_id}.p8')
          key = open(key_path, 'r', encoding='utf-8').read()
          now = int(time.time())
          token = jwt.encode(
              {'iss': issuer, 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
              key,
              algorithm='ES256',
              headers={'kid': key_id, 'typ': 'JWT'},
          )
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/json'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          app_query = urllib.parse.urlencode({'filter[bundleId]': bundle_id, 'limit': '5'})
          apps = get('https://api.appstoreconnect.apple.com/v1/apps?' + app_query).get('data', [])
          if len(apps) != 1:
              raise SystemExit(f'Expected exactly one app for {bundle_id}, got {len(apps)}')
          app_id = apps[0]['id']

          build_query = urllib.parse.urlencode({'filter[app]': app_id, 'sort': '-uploadedDate', 'limit': '50'})
          builds = get('https://api.appstoreconnect.apple.com/v1/builds?' + build_query).get('data', [])
          numeric = []
          print(f'ASC_APP_ID={app_id}')
          for entry in builds:
              attrs = entry.get('attributes', {})
              version = str(attrs.get('version', '')).strip()
              uploaded = attrs.get('uploadedDate', '')
              processing = attrs.get('processingState', '')
              expired = attrs.get('expired', False)
              print(f'ASC_BUILD version={version} uploaded={uploaded} processing={processing} expired={expired}')
              if version.isdigit():
                  numeric.append(int(version))
          if not numeric:
              raise SystemExit('No numeric App Store Connect builds returned')
          latest = max(numeric)
          print(f'ASC_LATEST_BUILD={latest}')
          print(f'ASC_NEXT_BUILD={latest + 1}')
          PY

      - name: Probe verdict
        run: echo 'TestFlight build inventory probe passed'
