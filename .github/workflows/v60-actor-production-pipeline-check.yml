name: v1.47 Actor Production Pipeline Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v60.gd'
      - 'scripts/world3d_chamber_v147.gd'
      - 'scripts/world3d_actor_factory_v147.gd'
      - 'scripts/world3d_model_registry_v147.gd'
      - 'scripts/v60_actor_production_pipeline_smoke_test.gd'
      - 'scenes/main.tscn'
      - 'assets/models/actors/README.md'
      - '.github/workflows/v60-actor-production-pipeline-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v60.gd'
      - 'scripts/world3d_chamber_v147.gd'
      - 'scripts/world3d_actor_factory_v147.gd'
      - 'scripts/world3d_model_registry_v147.gd'
      - 'scripts/v60_actor_production_pipeline_smoke_test.gd'
      - 'scenes/main.tscn'
      - 'assets/models/actors/README.md'
      - '.github/workflows/v60-actor-production-pipeline-check.yml'

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.1-stable'

jobs:
  actor-production-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Parse actor production runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Run actor production smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v60_actor_production_pipeline_smoke_test.gd
