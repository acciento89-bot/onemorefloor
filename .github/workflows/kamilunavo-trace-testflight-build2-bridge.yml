name: Kamilunavo Trace TestFlight Build 2 Bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kamilunavo-trace-testflight-build2-bridge.yml'
      - '.github/kamilunavo-trace-build2.trigger'

permissions:
  contents: read

concurrency:
  group: kamilunavo-trace-build2-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: 'de.kamilunavo.trace'
  BUILD_NUMBER: '2'
  MARKETING_VERSION: '0.1.0'

jobs:
  verify-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Build 2 processing state in App Store Connect
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_ID" -a -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          JWT=$(ASC_KEY_PATH="$KEY" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          s="#{h}.#{p}"; seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          H="Authorization: Bearer $JWT"
          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$RUNNER_TEMP/app.json"
          APP_ID=$(jq -r '.data[0].id // empty' "$RUNNER_TEMP/app.json")
          test -n "$APP_ID"

          FINAL_STATE=''
          for attempt in $(seq 1 30); do
            OUT="$RUNNER_TEMP/build2.json"
            curl --fail --silent --show-error --get -H "$H" \
              --data-urlencode "filter[app]=$APP_ID" \
              --data-urlencode "filter[version]=$BUILD_NUMBER" \
              --data-urlencode "filter[preReleaseVersion.version]=$MARKETING_VERSION" \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,usesNonExemptEncryption' \
              --data-urlencode 'sort=-uploadedDate' \
              --data-urlencode 'limit=10' \
              'https://api.appstoreconnect.apple.com/v1/builds' -o "$OUT"
            COUNT=$(jq '.data | length' "$OUT")
            if [[ "$COUNT" -gt 0 ]]; then
              FINAL_STATE=$(jq -r '.data[0].attributes.processingState' "$OUT")
              UPLOADED=$(jq -r '.data[0].attributes.uploadedDate' "$OUT")
              echo "Build $MARKETING_VERSION ($BUILD_NUMBER) attempt $attempt: processingState=$FINAL_STATE uploadedDate=$UPLOADED"
              [[ "$FINAL_STATE" != 'FAILED' && "$FINAL_STATE" != 'INVALID' ]] || exit 1
              if [[ "$FINAL_STATE" == 'VALID' ]]; then
                echo "Kamilunavo Trace $MARKETING_VERSION ($BUILD_NUMBER) is VALID in App Store Connect/TestFlight." >> "$GITHUB_STEP_SUMMARY"
                rm -f "$KEY"
                exit 0
              fi
            else
              echo "Build $MARKETING_VERSION ($BUILD_NUMBER) not exposed yet (attempt $attempt)."
            fi
            sleep 10
          done
          echo "Build 2 did not reach VALID within this verification window; last state=${FINAL_STATE:-not-visible}."
          rm -f "$KEY"
          exit 1
