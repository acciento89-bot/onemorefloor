name: Finalize Family Life OS App Store Metadata

on:
  push:
    branches: [agent/family-life-os-testflight-bridge]
    paths:
      - '.github/workflows/family-life-os-finalize-asc.yml'

permissions:
  contents: read
  statuses: write

env:
  BUNDLE_ID: de.kamilunavo.familyprototype
  REVIEW_EMAIL: apple-review@kamilunavo.com
  SUPABASE_URL: https://bqctetqraszsvknczjjr.supabase.co
  SUPABASE_KEY: sb_publishable_g4PeQGT99Tz2ltwdAzyXrA_NoYDXsP9

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg u "$TARGET_URL" '{state:"pending",target_url:$u,description:"Family Life OS App Store metadata finalization running",context:"family-life-os/asc-finalize"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v); Base64.urlsafe_encode64(v, padding: false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); input="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Family Life OS resources
        run: |
          set -euo pipefail
          api_get() { curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          APP=$(api_get "/v1/apps?filter%5BbundleId%5D=${BUNDLE_ID}")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APP"); test -n "$APP_ID"
          INFOS=$(api_get "/v1/apps/${APP_ID}/appInfos?limit=50")
          INFO_ID=$(jq -r '.data[0].id // empty' <<<"$INFOS"); test -n "$INFO_ID"
          INFO_LOCS=$(api_get "/v1/appInfos/${INFO_ID}/appInfoLocalizations?limit=50")
          INFO_LOC_ID=$(jq -r '.data[] | select(.attributes.locale=="de-DE") | .id' <<<"$INFO_LOCS" | head -1); test -n "$INFO_LOC_ID"
          VERSIONS=$(api_get "/v1/apps/${APP_ID}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50")
          VERSION_ID=$(jq -r '.data[] | select(.attributes.versionString=="1.0" and ((.attributes.appVersionState // .attributes.appStoreState // "") == "PREPARE_FOR_SUBMISSION")) | .id' <<<"$VERSIONS" | head -1); test -n "$VERSION_ID"
          VLOCS=$(api_get "/v1/appStoreVersions/${VERSION_ID}/appStoreVersionLocalizations?limit=50")
          VLOC_ID=$(jq -r '.data[] | select(.attributes.locale=="de-DE") | .id' <<<"$VLOCS" | head -1); test -n "$VLOC_ID"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "INFO_ID=$INFO_ID" >> "$GITHUB_ENV"
          echo "INFO_LOC_ID=$INFO_LOC_ID" >> "$GITHUB_ENV"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "VLOC_ID=$VLOC_ID" >> "$GITHUB_ENV"

      - name: Update privacy URLs and App Store metadata
        run: |
          set -euo pipefail
          patch() {
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' \
              -d "$2" "https://api.appstoreconnect.apple.com$1" >/dev/null
          }

          INFO_BODY=$(jq -n --arg id "$INFO_LOC_ID" '{data:{type:"appInfoLocalizations",id:$id,attributes:{subtitle:"Familienalltag organisiert",privacyPolicyUrl:"https://www.kamilunavo.com/family/privacy",privacyChoicesUrl:"https://www.kamilunavo.com/family/privacy-choices"}}}')
          patch "/v1/appInfoLocalizations/${INFO_LOC_ID}" "$INFO_BODY"

          DESCRIPTION=$(cat <<'EOF'
Family Life OS macht aus verstreuten Familieninfos einen gemeinsamen Plan. Erfasse Elternbriefe, Screenshots, PDFs, Text oder Sprache. Die App erkennt Termine, Aufgaben, Fristen und Vorbereitungen und zeigt sie dir zuerst zur Prüfung – erst danach werden sie in den Familienplan übernommen.

• Heute: Was jetzt wichtig ist
• Inbox: Fotos, PDFs, Text und Sprache sammeln
• Import prüfen: erkannte Termine, Aufgaben und Erinnerungen bearbeiten
• Plan: gemeinsame Agenda und Wochenübersicht
• Familie: Mitglieder, Rollen und Einladungen verwalten
• Erinnerungen: Termine, Aufgaben und Vorbereitung
• Family Pro: mehr AI-Importe, Automationen, Speicher und Verlauf

Datenschutz bleibt zentral: private Haushaltsdaten, serverseitige AI-Verarbeitung und keine Werbe-SDKs oder appübergreifendes Tracking.

Datenschutz: https://www.kamilunavo.com/family/privacy
Nutzungsbedingungen: https://www.kamilunavo.com/family/terms
EOF
          )
          KEYWORDS='familie,kalender,aufgaben,termine,eltern,organisation,planer,erinnerungen,haushalt,schule'
          PROMO='Elternbrief, Screenshot oder Sprachnotiz rein – Termine, Aufgaben und Fristen gemeinsam organisieren.'
          VLOC_BODY=$(jq -n --arg id "$VLOC_ID" --arg d "$DESCRIPTION" --arg k "$KEYWORDS" --arg p "$PROMO" '{data:{type:"appStoreVersionLocalizations",id:$id,attributes:{description:$d,keywords:$k,promotionalText:$p,supportUrl:"https://www.kamilunavo.com/family/support"}}}')
          patch "/v1/appStoreVersionLocalizations/${VLOC_ID}" "$VLOC_BODY"

          VERSION_BODY=$(jq -n --arg id "$VERSION_ID" '{data:{type:"appStoreVersions",id:$id,attributes:{copyright:"2026 Piotr Kaminski – Kamilunavo"}}}')
          patch "/v1/appStoreVersions/${VERSION_ID}" "$VERSION_BODY"

      - name: Create dedicated App Review account
        id: review_account
        run: |
          set -euo pipefail
          REVIEW_PASSWORD="Flos-$(openssl rand -hex 18)!9Z"
          SIGNUP_BODY=$(jq -n --arg e "$REVIEW_EMAIL" --arg p "$REVIEW_PASSWORD" '{email:$e,password:$p,data:{purpose:"apple_app_review"}}')
          HTTP=$(curl -sS -o "$RUNNER_TEMP/signup.json" -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' \
            -d "$SIGNUP_BODY")
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then
            echo "Supabase review-account signup failed with HTTP $HTTP" >&2
            jq -r '.msg // .message // .error_description // "unknown signup error"' "$RUNNER_TEMP/signup.json" >&2 || true
            exit 1
          fi
          USER_ID=$(jq -r '.user.id // empty' "$RUNNER_TEMP/signup.json")
          test -n "$USER_ID"
          echo "review_user_id=$USER_ID" >> "$GITHUB_OUTPUT"
          echo "REVIEW_PASSWORD=$REVIEW_PASSWORD" >> "$GITHUB_ENV"
          echo "Dedicated App Review account created; credentials were not written to logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse verified review contact from another app
        run: |
          set -euo pipefail
          api_get() { curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          APPS=$(api_get '/v1/apps?limit=200')
          CONTACT=''
          while read -r aid; do
            [[ "$aid" == "$APP_ID" ]] && continue
            VERS=$(api_get "/v1/apps/${aid}/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50" || true)
            while read -r vid; do
              [[ -z "$vid" ]] && continue
              DETAIL=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${vid}/appStoreReviewDetail" || true)
              PHONE=$(jq -r '.data.attributes.contactPhone // empty' <<<"$DETAIL" 2>/dev/null || true)
              EMAIL=$(jq -r '.data.attributes.contactEmail // empty' <<<"$DETAIL" 2>/dev/null || true)
              FIRST=$(jq -r '.data.attributes.contactFirstName // empty' <<<"$DETAIL" 2>/dev/null || true)
              LAST=$(jq -r '.data.attributes.contactLastName // empty' <<<"$DETAIL" 2>/dev/null || true)
              if [[ -n "$PHONE" && -n "$EMAIL" && -n "$FIRST" && -n "$LAST" ]]; then
                CONTACT=$(jq -n --arg f "$FIRST" --arg l "$LAST" --arg p "$PHONE" --arg e "$EMAIL" '{first:$f,last:$l,phone:$p,email:$e}')
                break 2
              fi
            done < <(jq -r '.data[]?.id' <<<"$VERS")
          done < <(jq -r '.data[]?.id' <<<"$APPS")
          test -n "$CONTACT"
          echo "CONTACT_B64=$(printf '%s' "$CONTACT" | base64 -w0)" >> "$GITHUB_ENV"
          echo "Existing verified App Review contact reused without printing personal contact fields." >> "$GITHUB_STEP_SUMMARY"

      - name: Create App Review details with demo credentials
        run: |
          set -euo pipefail
          CONTACT=$(printf '%s' "$CONTACT_B64" | base64 -d)
          FIRST=$(jq -r '.first' <<<"$CONTACT"); LAST=$(jq -r '.last' <<<"$CONTACT")
          PHONE=$(jq -r '.phone' <<<"$CONTACT"); EMAIL=$(jq -r '.email' <<<"$CONTACT")
          NOTES=$(cat <<'EOF'
Family Life OS requires sign-in. Use the demo account supplied above.

Main review paths:
- Heute: current family overview.
- Inbox: add/import text, photo, PDF or voice. Example text: "Elternabend am 26.08.2026 um 18:30". Wait for "Import prüfen", review the proposed item, then confirm it.
- Plan: shared agenda/week and confirmed items.
- Familie: household members, invitations and the visible Family Pro subscription options.
- Settings: Restore Purchases, Privacy/Terms links, notification settings and "Account und Daten löschen".

Family Pro monthly and annual are Apple StoreKit auto-renewable subscriptions only. No external payment method is used. Restore Purchases is available in the app. AI-derived import proposals require explicit user review before they become plan items.
EOF
          )
          ATTR=$(jq -n --arg f "$FIRST" --arg l "$LAST" --arg p "$PHONE" --arg e "$EMAIL" --arg u "$REVIEW_EMAIL" --arg pw "$REVIEW_PASSWORD" --arg n "$NOTES" '{contactFirstName:$f,contactLastName:$l,contactPhone:$p,contactEmail:$e,demoAccountName:$u,demoAccountPassword:$pw,demoAccountRequired:true,notes:$n}')
          EXIST=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${VERSION_ID}/appStoreReviewDetail" || true)
          REVIEW_ID=$(jq -r '.data.id // empty' <<<"$EXIST" 2>/dev/null || true)
          if [[ -n "$REVIEW_ID" ]]; then
            BODY=$(jq -n --arg id "$REVIEW_ID" --argjson a "$ATTR" '{data:{type:"appStoreReviewDetails",id:$id,attributes:$a}}')
            curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails/${REVIEW_ID}" >/dev/null
          else
            BODY=$(jq -n --arg vid "$VERSION_ID" --argjson a "$ATTR" '{data:{type:"appStoreReviewDetails",attributes:$a,relationships:{appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" 'https://api.appstoreconnect.apple.com/v1/appStoreReviewDetails' >/dev/null
          fi
          echo "App Review details created/updated with dedicated demo credentials." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify updated metadata
        run: |
          set -euo pipefail
          GET_INFO=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appInfoLocalizations/${INFO_LOC_ID}")
          GET_VLOC=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersionLocalizations/${VLOC_ID}")
          GET_VER=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${VERSION_ID}")
          GET_REVIEW=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${VERSION_ID}/appStoreReviewDetail")
          test "$(jq -r '.data.attributes.privacyPolicyUrl' <<<"$GET_INFO")" = 'https://www.kamilunavo.com/family/privacy'
          test "$(jq -r '.data.attributes.privacyChoicesUrl' <<<"$GET_INFO")" = 'https://www.kamilunavo.com/family/privacy-choices'
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$GET_VLOC")"
          test "$(jq -r '.data.attributes.supportUrl' <<<"$GET_VLOC")" = 'https://www.kamilunavo.com/family/support'
          test -n "$(jq -r '.data.attributes.copyright // empty' <<<"$GET_VER")"
          test "$(jq -r '.data.attributes.demoAccountRequired' <<<"$GET_REVIEW")" = 'true'
          test "$(jq -r '.data.attributes.demoAccountName' <<<"$GET_REVIEW")" = "$REVIEW_EMAIL"
          echo 'Privacy URLs, store text, support URL, copyright and App Review details verified in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${{ job.status }}" == "success" ]]; then STATE=success; DESC='Family Life OS App Store metadata finalized'; else STATE=failure; DESC='Family Life OS App Store metadata finalization failed'; fi
          BODY=$(jq -n --arg s "$STATE" --arg u "$TARGET_URL" --arg d "$DESC" '{state:$s,target_url:$u,description:$d,context:"family-life-os/asc-finalize"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Remove secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/signup.json"
