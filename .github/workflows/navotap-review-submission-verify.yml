name: NavoTap Review Submission Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/navotap-review-submission-verify.yml'

permissions:
  contents: read

jobs:
  verify-review-submission:
    runs-on: macos-26
    env:
      BUNDLE_ID: com.kamilunavo.onemoretap
    steps:
      - name: Prepare App Store Connect API key
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify NavoTap draft submission contents
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v) = Base64.urlsafe_encode64(v, padding: false)
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )

          APPS="$RUNNER_TEMP/apps.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$APPS"
          APP_ID=$(jq -r '.data[0].id // empty' "$APPS")
          test -n "$APP_ID"

          SUBS="$RUNNER_TEMP/submissions.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode 'limit=200' \
            'https://api.appstoreconnect.apple.com/v1/apps/'"$APP_ID"'/reviewSubmissions' -o "$SUBS"

          COUNT=$(jq '.data | length' "$SUBS")
          echo "REVIEW_SUBMISSION_COUNT=$COUNT"
          test "$COUNT" -ge 1
          jq -r '.data[] | "SUBMISSION | ID=\(.id) | STATE=\(.attributes.state) | PLATFORM=\(.attributes.platform // "") | SUBMITTED=\(.attributes.submittedDate // "")"' "$SUBS"

          # Prefer a non-submitted/draft-like submission; fall back to the newest returned entry.
          SUB_ID=$(jq -r '[.data[] | select((.attributes.submittedDate // "") == "")][0].id // .data[0].id // empty' "$SUBS")
          test -n "$SUB_ID"
          echo "SELECTED_SUBMISSION_ID=$SUB_ID"

          ITEMS_URL=$(jq -r --arg id "$SUB_ID" '.data[] | select(.id==$id) | .relationships.items.links.related // empty' "$SUBS")
          if [ -z "$ITEMS_URL" ]; then
            ITEMS_URL="https://api.appstoreconnect.apple.com/v1/reviewSubmissions/$SUB_ID/items"
          fi

          ITEMS="$RUNNER_TEMP/items.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode 'limit=200' \
            "$ITEMS_URL" -o "$ITEMS"

          echo '=== REVIEW ITEMS ==='
          jq -r '.data[] | "ITEM | ID=\(.id) | STATE=\(.attributes.state) | RELS=" + ((.relationships | keys) | join(",")) + " | APP_VERSION_ID=\(.relationships.appStoreVersion.data.id // "") | IAP_VERSION_ID=\(.relationships.inAppPurchaseVersion.data.id // "")"' "$ITEMS"
          ITEM_COUNT=$(jq '.data | length' "$ITEMS")
          echo "ITEM_COUNT=$ITEM_COUNT"

          APP_VERSION_ITEMS=$(jq '[.data[] | select(.relationships.appStoreVersion.data.id? != null)] | length' "$ITEMS")
          IAP_ITEMS=$(jq '[.data[] | select(.relationships.inAppPurchaseVersion.data.id? != null)] | length' "$ITEMS")
          echo "APP_VERSION_ITEMS=$APP_VERSION_ITEMS | IAP_ITEMS=$IAP_ITEMS"
          test "$APP_VERSION_ITEMS" -eq 1
          test "$IAP_ITEMS" -eq 5

          APP_VERSION_ID=$(jq -r '.data[] | select(.relationships.appStoreVersion.data.id? != null) | .relationships.appStoreVersion.data.id' "$ITEMS" | head -n1)
          VERSION_JSON="$RUNNER_TEMP/version.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$APP_VERSION_ID" -o "$VERSION_JSON"
          VERSION=$(jq -r '.data.attributes.versionString // empty' "$VERSION_JSON")
          echo "APP_VERSION=$VERSION"
          test "$VERSION" = "1.0"

          # Verify all five IAP-version relationships resolve and print their live product IDs.
          FOUND="$RUNNER_TEMP/found-products.txt"
          : > "$FOUND"
          while read -r IAP_VERSION_ID; do
            [ -n "$IAP_VERSION_ID" ] || continue
            OUT="$RUNNER_TEMP/iapver-$IAP_VERSION_ID.json"
            HTTP=$(curl --silent --show-error -w '%{http_code}' -o "$OUT" \
              -H "Authorization: Bearer $JWT" \
              "https://api.appstoreconnect.apple.com/v1/inAppPurchaseVersions/$IAP_VERSION_ID/inAppPurchase")
            echo "IAP_VERSION_LOOKUP | ID=$IAP_VERSION_ID | HTTP=$HTTP"
            if [ "$HTTP" = "200" ]; then
              PID=$(jq -r '.data.attributes.productId // empty' "$OUT")
              if [ -n "$PID" ]; then
                echo "$PID" >> "$FOUND"
                echo "IAP_PRODUCT=$PID"
              fi
            fi
          done < <(jq -r '.data[] | select(.relationships.inAppPurchaseVersion.data.id? != null) | .relationships.inAppPurchaseVersion.data.id' "$ITEMS")

          RESOLVED=$(sort -u "$FOUND" | grep -c . || true)
          echo "RESOLVED_IAP_PRODUCTS=$RESOLVED"
          if [ "$RESOLVED" -eq 5 ]; then
            grep -qx 'com.kamilunavo.onemoretap.removeads' "$FOUND"
            grep -qx 'om.kamilunavo.onemoretap.theme.fire' "$FOUND"
            grep -qx 'com.kamilunavo.onemoretap.theme.galaxy' "$FOUND"
            grep -qx 'com.kamilunavo.onemoretap.theme.retro' "$FOUND"
            grep -qx 'com.kamilunavo.onemoretap.theme.all' "$FOUND"
          fi

          echo "SUMMARY | VERSION=$VERSION | APP_VERSION_ITEMS=$APP_VERSION_ITEMS | IAP_ITEMS=$IAP_ITEMS | RESOLVED_PRODUCTS=$RESOLVED"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
