name: NavoTap Review Submission State

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/navotap-review-submission-state.yml'

permissions:
  contents: read

jobs:
  inspect-review-state:
    runs-on: macos-26
    env:
      BUNDLE_ID: com.kamilunavo.onemoretap
    steps:
      - name: Prepare App Store Connect API key
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inspect NavoTap app versions and review submissions
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b64url(v) = Base64.urlsafe_encode64(v, padding: false)
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b64url(raw)}"
          RUBY
          )

          APPS="$RUNNER_TEMP/apps.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$APPS"
          APP_ID=$(jq -r '.data[0].id // empty' "$APPS")
          test -n "$APP_ID"
          echo "APP_ID=$APP_ID"

          VERSIONS="$RUNNER_TEMP/versions.json"
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode 'filter[platform]=IOS' \
            --data-urlencode 'limit=200' \
            --data-urlencode 'fields[appStoreVersions]=versionString,appStoreState,appVersionState,createdDate,build' \
            --data-urlencode 'include=build' \
            --data-urlencode 'fields[builds]=version,uploadedDate,processingState,expired' \
            'https://api.appstoreconnect.apple.com/v1/apps/'"$APP_ID"'/appStoreVersions' -o "$VERSIONS"

          echo '=== APP STORE VERSIONS ==='
          jq -r '.data[] | . as $v | ($v.relationships.build.data.id // "") as $bid | "VERSION | ID=\($v.id) | VERSION=\($v.attributes.versionString) | APP_STORE_STATE=\($v.attributes.appStoreState) | APP_VERSION_STATE=\($v.attributes.appVersionState) | BUILD_ID=\($bid)"' "$VERSIONS"
          jq -r '.included[]? | select(.type=="builds") | "BUILD | ID=\(.id) | NUMBER=\(.attributes.version) | PROCESSING=\(.attributes.processingState) | EXPIRED=\(.attributes.expired)"' "$VERSIONS"

          REVIEWS="$RUNNER_TEMP/reviews.json"
          HTTP=$(curl --silent --show-error --get \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode 'limit=200' \
            -w '%{http_code}' \
            -o "$REVIEWS" \
            'https://api.appstoreconnect.apple.com/v1/apps/'"$APP_ID"'/reviewSubmissions')
          echo "REVIEW_SUBMISSIONS_HTTP=$HTTP"
          if [ "$HTTP" = "200" ]; then
            echo '=== REVIEW SUBMISSIONS ==='
            jq -r '.data[] | "SUBMISSION | ID=\(.id) | STATE=\(.attributes.state) | PLATFORM=\(.attributes.platform // "") | SUBMITTED=\(.attributes.submittedDate // "")"' "$REVIEWS"
            echo "REVIEW_SUBMISSION_COUNT=$(jq '.data | length' "$REVIEWS")"
          else
            cat "$REVIEWS"
            exit 1
          fi

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
