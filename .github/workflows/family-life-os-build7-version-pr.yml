name: Family Life OS Build 7 Version PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-build7-version-pr.yml'

permissions:
  contents: read
  statuses: write

env:
  BUILD_ID: ffa8e10c-13b6-4325-9c6d-a7f841c9c9df

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"pending",target_url:$u,description:"Checking Family Life OS Build 7 version",context:"family-life-os/build7-version"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Prepare ASC token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Read Build 7 versions
        id: versions
        run: |
          set -euo pipefail
          PRE=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/builds/${BUILD_ID}/preReleaseVersion")
          ASV=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/builds/${BUILD_ID}/appStoreVersion")
          BV=$(jq -r '.data.attributes.version // "MISSING"' <<<"$PRE")
          SV=$(jq -r '.data.attributes.versionString // "MISSING"' <<<"$ASV")
          echo "binary=$BV" >> "$GITHUB_OUTPUT"
          echo "store=$SV" >> "$GITHUB_OUTPUT"
          echo "Build 7 binary marketing version: $BV; attached App Store version: $SV" >> "$GITHUB_STEP_SUMMARY"

      - name: Success status
        env:
          GH_TOKEN: ${{ github.token }}
          BV: ${{ steps.versions.outputs.binary }}
          SV: ${{ steps.versions.outputs.store }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          D="Build 7 binary ${BV}; App Store ${SV}"
          B=$(jq -n --arg u "$U" --arg d "$D" '{state:"success",target_url:$u,description:$d,context:"family-life-os/build7-version"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null
