name: 99.9 Dispatch Build 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-dispatch-build4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TestFlight bridge with Build 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -n '{ref:"main",inputs:{build:"4"}}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/99-9-testflight-bridge.yml/dispatches" \
            -d "$BODY"
