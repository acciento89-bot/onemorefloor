name: Kamilunavo Trace 1.0 Final Submit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-1.0-build10-submit.yml'

permissions:
  contents: read

env:
  APP_ID: '6803765449'
  APP_STORE_VERSION_ID: 'a895fc57-7ee4-40e6-9f19-2881323068ea'
  BUILD_ID: '58473001-3b4a-402d-9ea7-63892d4a6021'
  IAP_VERSION_ID: '8b715a31-6526-41bf-a7eb-226a629a5715'
  REVIEW_SUBMISSION_ID: 'c7add2c4-51c8-4b78-a825-6f0d9487c3ef'

jobs:
  final-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"; export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Verify final Trace state
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          APP=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID")
          test "$(jq -r '.data.attributes.bundleId' <<<"$APP")" = 'de.kamilunavo.trace'

          V=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersions/$APP_STORE_VERSION_ID")
          VSTATE=$(jq -r '.data.attributes.appVersionState // .data.attributes.appStoreState // empty' <<<"$V")
          test "$(jq -r '.data.attributes.versionString' <<<"$V")" = '1.0'
          echo "TRACE_APP_VERSION_STATE=$VSTATE"

          B=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds/$BUILD_ID")
          BUILD_NUMBER=$(jq -r '.data.attributes.version // empty' <<<"$B")
          test -n "$BUILD_NUMBER"
          test "$(jq -r '.data.attributes.processingState' <<<"$B")" = 'VALID'
          echo "TRACE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TRACE_BUILD=$BUILD_NUMBER VALID"

          I=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/inAppPurchaseVersions/$IAP_VERSION_ID")
          ISTATE=$(jq -r '.data.attributes.state // empty' <<<"$I")
          echo "TRACE_IAP_VERSION_STATE=$ISTATE"

          S=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/${APP_ID}/appPriceSchedule")
          SID=$(jq -r '.data.id' <<<"$S"); test -n "$SID"
          M=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appPriceSchedules/${SID}/manualPrices?include=appPricePoint,territory&fields%5BappPricePoints%5D=customerPrice&filter%5Bterritory%5D=DEU&limit=200")
          test "$(jq -r '[.included[]? | select(.type=="appPricePoints" and (.attributes.customerPrice|tonumber)==0)] | length' <<<"$M")" -gt 0
          echo 'TRACE_APP_PRICE_DE=FREE'

      - name: Ensure App Store version is in review package
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          RID="$REVIEW_SUBMISSION_ID"
          BODY=$(jq -n --arg rid "$RID" --arg vid "$APP_STORE_VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/app-item.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems")
          echo "TRACE_APP_ITEM_HTTP=$CODE"
          if [[ "$CODE" == '201' ]]; then
            echo 'TRACE_APP_VERSION_ADDED=true'
          elif [[ "$CODE" == '409' ]] && grep -q 'already added to this reviewSubmission' "$RUNNER_TEMP/app-item.json"; then
            echo 'TRACE_APP_VERSION_ALREADY_IN_PACKAGE=true'
          else
            jq -c '.errors[]? | {status,code,title,detail,meta}' "$RUNNER_TEMP/app-item.json" || cat "$RUNNER_TEMP/app-item.json"
            exit 41
          fi

      - name: Ensure Lifetime Pro is in same review package
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          RID="$REVIEW_SUBMISSION_ID"
          I=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/inAppPurchaseVersions/$IAP_VERSION_ID")
          ISTATE=$(jq -r '.data.attributes.state // empty' <<<"$I")
          echo "TRACE_IAP_STATE_BEFORE_PACKAGE=$ISTATE"
          case "$ISTATE" in
            WAITING_FOR_REVIEW|IN_REVIEW|APPROVED|ACCEPTED)
              echo "TRACE_IAP_ALREADY_SUBMITTED=$ISTATE"
              exit 0
              ;;
            PREPARE_FOR_SUBMISSION|READY_FOR_REVIEW)
              ;;
            *)
              echo "Unexpected Lifetime Pro state: $ISTATE"
              exit 42
              ;;
          esac

          BODY=$(jq -n --arg rid "$RID" --arg iid "$IAP_VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},inAppPurchaseVersion:{data:{type:"inAppPurchaseVersions",id:$iid}}}}}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/iap-item.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems")
          echo "TRACE_IAP_ITEM_HTTP=$CODE"
          if [[ "$CODE" == '201' ]]; then
            echo 'TRACE_LIFETIME_PRO_ADDED=true'
          elif [[ "$CODE" == '409' ]] && grep -q 'already added to this reviewSubmission' "$RUNNER_TEMP/iap-item.json"; then
            echo 'TRACE_LIFETIME_PRO_ALREADY_IN_PACKAGE=true'
          else
            jq -c '.errors[]? | {status,code,title,detail,meta}' "$RUNNER_TEMP/iap-item.json" || cat "$RUNNER_TEMP/iap-item.json"
            exit 43
          fi

      - name: Submit everything to Apple App Review
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          RID="$REVIEW_SUBMISSION_ID"
          BEFORE=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$RID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$BEFORE")
          echo "TRACE_REVIEW_STATE_BEFORE_SUBMIT=$STATE"

          if [[ "$STATE" == 'READY_FOR_REVIEW' ]]; then
            BODY=$(jq -n --arg id "$RID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
            CODE=$(curl -sS -o "$RUNNER_TEMP/submit.json" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$RID")
            echo "TRACE_SUBMIT_HTTP=$CODE"
            if [[ "$CODE" != '200' ]]; then
              jq -c '.errors[]? | {status,code,title,detail,meta}' "$RUNNER_TEMP/submit.json" || cat "$RUNNER_TEMP/submit.json"
              exit 51
            fi
          fi

          FINAL=''
          for i in {1..45}; do
            R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$RID")
            FINAL=$(jq -r '.data.attributes.state // empty' <<<"$R")
            echo "TRACE_APPLE_REVIEW_STATE=$FINAL"
            case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
            sleep 4
          done
          case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) ;; *) exit 52 ;; esac

          V=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appStoreVersions/$APP_STORE_VERSION_ID")
          I=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/inAppPurchaseVersions/$IAP_VERSION_ID")
          VSTATE=$(jq -r '.data.attributes.appVersionState // .data.attributes.appStoreState // empty' <<<"$V")
          ISTATE=$(jq -r '.data.attributes.state // empty' <<<"$I")
          echo "TRACE_FINAL_APP_VERSION_STATE=$VSTATE"
          echo "TRACE_FINAL_IAP_VERSION_STATE=$ISTATE"
          echo "TRACE_FINAL_REVIEW_SUBMISSION_STATE=$FINAL"
          echo "### Kamilunavo Trace 1.0 submitted ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **$TRACE_BUILD_NUMBER**" >> "$GITHUB_STEP_SUMMARY"
          echo "- App price (DE): **Free**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lifetime Pro: **$ISTATE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- App version: **$VSTATE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Review submission: **$FINAL**" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
