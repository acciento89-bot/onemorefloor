name: Kamilunavo Trace 1.0 Final Submit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kamilunavo-trace-1.0-build10-submit.yml'

permissions:
  contents: read

concurrency:
  group: trace-1-0-final-submit-${{ github.ref }}
  cancel-in-progress: true

env:
  TRACE_REPO: 'https://github.com/acciento89-bot/appideenchatgpt.git'
  TRACE_SHA: '2e2d51a26b8c07cd4555deed8f1b1466af184e83'
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.trace'
  MARKETING_VERSION: '1.0'
  APP_ID: '6803765449'
  APP_STORE_VERSION_ID: 'a895fc57-7ee4-40e6-9f19-2881323068ea'
  INFO_ID: '4d8e959a-99c5-4ba5-ad95-b294748cf2c8'
  DE_INFO_LOC_ID: 'edaa4558-5a43-4f3c-8af4-211685835177'
  DE_VLOC_ID: '70a7114f-1aa1-43fe-9f53-826a7acbda5c'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'

jobs:
  release-and-submit:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Prepare App Store Connect token
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Resolve next build and Lifetime Pro review version
        shell: bash
        run: |
          set -euo pipefail
          BUILDS="$RUNNER_TEMP/builds.json"
          curl --fail --silent --show-error --get -H "Authorization: Bearer $ASC_TOKEN" \
            --data-urlencode "filter[app]=$APP_ID" \
            --data-urlencode "filter[preReleaseVersion.version]=$MARKETING_VERSION" \
            --data-urlencode 'fields[builds]=version,processingState' \
            --data-urlencode 'limit=200' \
            'https://api.appstoreconnect.apple.com/v1/builds' -o "$BUILDS"
          MAX=$(jq -r '[.data[].attributes.version | tonumber? // 0] | max // 0' "$BUILDS")
          NEXT=$(( MAX + 1 ))
          (( NEXT < 11 )) && NEXT=11
          echo "EFFECTIVE_BUILD=$NEXT" >> "$GITHUB_ENV"
          echo "TRACE_NEXT_BUILD=$NEXT"

          IAP=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/apps/${APP_ID}/inAppPurchasesV2?filter%5BproductId%5D=${PRODUCT_ID}&limit=10")
          IAP_ID=$(jq -r '.data[0].id // empty' <<<"$IAP")
          test -n "$IAP_ID"
          test "$(jq -r '.data[0].attributes.state // empty' <<<"$IAP")" = 'READY_TO_SUBMIT'
          echo "IAP_ID=$IAP_ID" >> "$GITHUB_ENV"

          VERS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v2/inAppPurchases/${IAP_ID}/versions?limit=50")
          IAP_VERSION_ID=$(jq -r '[.data[] | select(.attributes.state=="PREPARE_FOR_SUBMISSION" or .attributes.state=="READY_FOR_REVIEW")][0].id // empty' <<<"$VERS")
          echo "TRACE_IAP_VERSIONS=$(jq -c '[.data[] | {id,state:.attributes.state}]' <<<"$VERS")"
          test -n "$IAP_VERSION_ID"
          echo "IAP_VERSION_ID=$IAP_VERSION_ID" >> "$GITHUB_ENV"

      - name: Checkout locked Trace source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$TRACE_REPO" "$RUNNER_TEMP/trace-source"
          cd "$RUNNER_TEMP/trace-source"
          git fetch origin "$TRACE_SHA"
          git checkout --detach "$TRACE_SHA"
          test "$(git rev-parse HEAD)" = "$TRACE_SHA"
          python3 apps/002-evidaro/ci/preflight.py
          echo "TRACE_DIR=$RUNNER_TEMP/trace-source" >> "$GITHUB_ENV"

      - name: Archive Trace 1.0 with next build
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRACE_DIR/apps/002-evidaro/prototype"
          xcodebuild \
            -project EvidaroPrototype.xcodeproj \
            -scheme EvidaroPrototype \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EvidaroPrototype.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          APP="$RUNNER_TEMP/EvidaroPrototype.xcarchive/Products/Applications/EvidaroPrototype.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '1.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EFFECTIVE_BUILD"
          test -s "$APP/AppIcon60x60@2x.png"
          sips -g pixelWidth -g pixelHeight "$APP/AppIcon60x60@2x.png" | grep -q '120'
          echo "Archive verified: Kamilunavo Trace 1.0 ($EFFECTIVE_BUILD)."

      - name: Upload final build to App Store Connect
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EvidaroPrototype.xcarchive" \
            -exportPath "$RUNNER_TEMP/TraceFinalExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/trace-final-upload.log"
          grep -Eiq 'Upload succeeded|Uploaded package is processing|upload.*success' "$RUNNER_TEMP/trace-final-upload.log"

      - name: Refresh App Store Connect token
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Wait for VALID and attach build to version 1.0
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 45); do
            OUT="$RUNNER_TEMP/final-build.json"
            curl --fail --silent --show-error --get -H "Authorization: Bearer $ASC_TOKEN" \
              --data-urlencode "filter[app]=$APP_ID" \
              --data-urlencode "filter[version]=$EFFECTIVE_BUILD" \
              --data-urlencode "filter[preReleaseVersion.version]=$MARKETING_VERSION" \
              --data-urlencode 'fields[builds]=version,processingState,usesNonExemptEncryption' \
              'https://api.appstoreconnect.apple.com/v1/builds' -o "$OUT"
            if [[ "$(jq '.data|length' "$OUT")" -gt 0 ]]; then
              STATE=$(jq -r '.data[0].attributes.processingState' "$OUT")
              echo "Build $EFFECTIVE_BUILD processing: $STATE"
              if [[ "$STATE" == 'VALID' ]]; then
                BID=$(jq -r '.data[0].id' "$OUT")
                test "$(jq -r '.data[0].attributes.usesNonExemptEncryption' "$OUT")" = 'false'
                echo "FINAL_BUILD_ID=$BID" >> "$GITHUB_ENV"
                break
              fi
              [[ "$STATE" != 'FAILED' && "$STATE" != 'INVALID' ]]
            fi
            sleep 20
          done
          test -n "${BID:-}"
          BODY=$(jq -n --arg id "$BID" '{data:{type:"builds",id:$id}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${APP_STORE_VERSION_ID}/relationships/build" >/dev/null
          CHECK=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${APP_STORE_VERSION_ID}/build")
          test "$(jq -r '.data.id' <<<"$CHECK")" = "$BID"
          test "$(jq -r '.data.attributes.version' <<<"$CHECK")" = "$EFFECTIVE_BUILD"

      - name: Final App Store readiness gate
        shell: bash
        run: |
          set -euo pipefail
          api(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "https://api.appstoreconnect.apple.com$1"; }
          APP=$(api "/v1/apps/${APP_ID}?fields%5Bapps%5D=bundleId,contentRightsDeclaration")
          INFO=$(api "/v1/appInfos/${INFO_ID}?include=primaryCategory")
          ILOC=$(api "/v1/appInfoLocalizations/${DE_INFO_LOC_ID}")
          VER=$(api "/v1/appStoreVersions/${APP_STORE_VERSION_ID}")
          VLOC=$(api "/v1/appStoreVersionLocalizations/${DE_VLOC_ID}")
          REVIEW=$(api "/v1/appStoreVersions/${APP_STORE_VERSION_ID}/appStoreReviewDetail")
          SHOTS=$(api "/v1/appStoreVersionLocalizations/${DE_VLOC_ID}/appScreenshotSets?include=appScreenshots&limit=50&limit%5BappScreenshots%5D=50")
          AGE=$(api "/v1/appInfos/${INFO_ID}/ageRatingDeclaration")
          test "$(jq -r '.data.attributes.contentRightsDeclaration' <<<"$APP")" = 'USES_THIRD_PARTY_CONTENT'
          test "$(jq -r '.included[]? | select(.type=="appCategories") | .id' <<<"$INFO" | head -1)" = 'PRODUCTIVITY'
          test -n "$(jq -r '.data.attributes.privacyPolicyUrl // empty' <<<"$ILOC")"
          test "$(jq -r '.data.attributes.versionString' <<<"$VER")" = '1.0'
          test -n "$(jq -r '.data.attributes.copyright // empty' <<<"$VER")"
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.keywords // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.supportUrl // empty' <<<"$VLOC")"
          test -n "$(jq -r '.data.attributes.contactFirstName // empty' <<<"$REVIEW")"
          test -n "$(jq -r '.data.attributes.contactEmail // empty' <<<"$REVIEW")"
          test "$(jq '[.included[]? | select(.type=="appScreenshots")] | length' <<<"$SHOTS")" -gt 0
          test "$(jq -r '.data.attributes.unrestrictedWebAccess' <<<"$AGE")" = 'false'
          test "$(jq -r '.data.attributes.gambling' <<<"$AGE")" = 'false'

      - name: Create draft review submission and add app version
        shell: bash
        run: |
          set -euo pipefail
          EXIST=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/apps/${APP_ID}/reviewSubmissions?limit=50")
          RID=$(jq -r '.data[]? | select(.attributes.state=="READY_FOR_REVIEW") | .id' <<<"$EXIST" | head -1)
          if [[ -z "$RID" ]]; then
            BODY=$(jq -n --arg app "$APP_ID" '{data:{type:"reviewSubmissions",attributes:{platform:"IOS"},relationships:{app:{data:{type:"apps",id:$app}}}}}')
            RESP=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissions')
            RID=$(jq -r '.data.id // empty' <<<"$RESP")
          fi
          test -n "$RID"
          echo "REVIEW_SUBMISSION_ID=$RID" >> "$GITHUB_ENV"
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${RID}/items?include=appStoreVersion,inAppPurchaseVersion&limit=200")
          HAS_APP=$(jq -r --arg id "$APP_STORE_VERSION_ID" '[.included[]? | select(.type=="appStoreVersions" and .id==$id)] | length' <<<"$ITEMS")
          if [[ "$HAS_APP" == '0' ]]; then
            BODY=$(jq -n --arg rid "$RID" --arg vid "$APP_STORE_VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' >/dev/null
          fi

      - name: Add Lifetime Pro to same submission
        shell: bash
        run: |
          set -euo pipefail
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}/items?include=inAppPurchaseVersion&limit=200")
          HAS_IAP=$(jq -r --arg id "$IAP_VERSION_ID" '[.included[]? | select(.type=="inAppPurchaseVersions" and .id==$id)] | length' <<<"$ITEMS")
          if [[ "$HAS_IAP" == '0' ]]; then
            BODY=$(jq -n --arg rid "$REVIEW_SUBMISSION_ID" --arg iid "$IAP_VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$rid}},inAppPurchaseVersion:{data:{type:"inAppPurchaseVersions",id:$iid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' >/dev/null
          fi
          CHECK=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}/items?include=appStoreVersion,inAppPurchaseVersion&limit=200")
          test "$(jq -r --arg id "$APP_STORE_VERSION_ID" '[.included[]? | select(.type=="appStoreVersions" and .id==$id)] | length' <<<"$CHECK")" -gt 0
          test "$(jq -r --arg id "$IAP_VERSION_ID" '[.included[]? | select(.type=="inAppPurchaseVersions" and .id==$id)] | length' <<<"$CHECK")" -gt 0

      - name: Submit Kamilunavo Trace for App Review
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -n --arg id "$REVIEW_SUBMISSION_ID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}" >/dev/null

      - name: Verify Apple accepted the submission
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          SUB=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/${REVIEW_SUBMISSION_ID}")
          VER=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/${APP_STORE_VERSION_ID}")
          IAPV=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/inAppPurchaseVersions/${IAP_VERSION_ID}")
          S=$(jq -r '.data.attributes.state // empty' <<<"$SUB")
          VS=$(jq -r '.data.attributes.appVersionState // .data.attributes.appStoreState // empty' <<<"$VER")
          IS=$(jq -r '.data.attributes.state // empty' <<<"$IAPV")
          echo "TRACE_FINAL_BUILD=$EFFECTIVE_BUILD"
          echo "TRACE_REVIEW_SUBMISSION_ID=$REVIEW_SUBMISSION_ID"
          echo "TRACE_REVIEW_SUBMISSION_STATE=$S"
          echo "TRACE_APP_VERSION_STATE=$VS"
          echo "TRACE_LIFETIME_PRO_VERSION_STATE=$IS"
          [[ "$S" == 'WAITING_FOR_REVIEW' || "$S" == 'IN_REVIEW' ]]
          [[ "$VS" == 'WAITING_FOR_REVIEW' || "$VS" == 'IN_REVIEW' ]]
          [[ "$IS" == 'WAITING_FOR_REVIEW' || "$IS" == 'IN_REVIEW' ]]
          {
            echo '## Kamilunavo Trace submitted'
            echo "- App Store version: 1.0"
            echo "- Build: $EFFECTIVE_BUILD"
            echo "- Submission ID: $REVIEW_SUBMISSION_ID"
            echo "- Submission: $S"
            echo "- App version: $VS"
            echo "- Lifetime Pro: $IS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
