name: 99.9 Remove Ads Price 3.99

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-remove-ads-price-399.yml'
      - 'bridge/99-9-remove-ads.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: de.kamilunavo.ninenine
  PRODUCT_ID: de.kamilunavo.ninenine.removeads
  TARGET_PRICE_DE: '3.99'

jobs:
  price:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Resolve Remove Ads product and 3.99 EUR price point
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://api.appstoreconnect.apple.com
          APPS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode limit=10 "$BASE/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS"); test -n "$APP_ID"
          IAPS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID/inAppPurchasesV2?limit=100")
          IAP_ID=$(jq -r --arg p "$PRODUCT_ID" '.data[]? | select(.attributes.productId==$p) | .id' <<<"$IAPS" | head -1)
          test -n "$IAP_ID"
          POINTS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode 'filter[territory]=DEU' --data-urlencode 'limit=8000' "$BASE/v2/inAppPurchases/$IAP_ID/pricePoints")
          POINT_ID=$(jq -r --arg price "$TARGET_PRICE_DE" '.data[]? | select((.attributes.customerPrice|tostring)==$price) | .id' <<<"$POINTS" | head -1)
          test -n "$POINT_ID"
          echo "REMOVE_ADS_IAP_ID=$IAP_ID" >> "$GITHUB_ENV"
          echo "REMOVE_ADS_POINT_ID=$POINT_ID" >> "$GITHUB_ENV"

      - name: Set Remove Ads to EUR 3.99
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://api.appstoreconnect.apple.com
          CURRENT=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/inAppPurchasePriceSchedules/$REMOVE_ADS_IAP_ID/manualPrices?filter%5Bterritory%5D=DEU&include=inAppPurchasePricePoint&limit=50" || true)
          HAVE=$(jq -r --arg price "$TARGET_PRICE_DE" '[.included[]? | select(.type=="inAppPurchasePricePoints") | select((.attributes.customerPrice|tostring)==$price)] | length' <<<"${CURRENT:-{}}" 2>/dev/null || echo 0)
          if [[ "$HAVE" -gt 0 ]]; then
            echo "Remove Ads already has EUR $TARGET_PRICE_DE configured."
            exit 0
          fi
          START_DATE=$(date -u +%F)
          PRICE_ID="removeads-de-399-${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg iap "$REMOVE_ADS_IAP_ID" --arg pp "$REMOVE_ADS_POINT_ID" --arg pid "$PRICE_ID" --arg start "$START_DATE" '{data:{type:"inAppPurchasePriceSchedules",relationships:{inAppPurchase:{data:{type:"inAppPurchases",id:$iap}},manualPrices:{data:[{type:"inAppPurchasePrices",id:$pid}]}}},included:[{type:"inAppPurchasePrices",id:$pid,attributes:{startDate:$start},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iap}},inAppPurchasePricePoint:{data:{type:"inAppPurchasePricePoints",id:$pp}}}}]}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/inAppPurchasePriceSchedules" >/dev/null
          echo "Remove Ads scheduled at EUR $TARGET_PRICE_DE from $START_DATE."
