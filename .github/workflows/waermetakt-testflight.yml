name: WärmeTakt TestFlight

on:
  workflow_dispatch:
    inputs:
      build:
        description: App Store Connect build number
        required: true
        default: '1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/waermetakt-testflight.yml'

permissions:
  contents: read

concurrency:
  group: waermetakt-testflight
  cancel-in-progress: false

env:
  SOURCE_REPO: acciento89-bot/w-rmetakt
  SOURCE_REF: e79ae73073abb30cbf093f3e4bdb91df41825b0a
  TEAM_ID: TKG684N5GL
  BUNDLE_ID: de.kamilunavo.waermetakt
  APP_VERSION: 1.0.0

jobs:
  upload:
    name: Build, sign and upload WärmeTakt
    runs-on: macos-26
    timeout-minutes: 55

    steps:
      - name: Resolve build number
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD:-1}"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Check App Store Connect credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"

      - name: Checkout exact WärmeTakt source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: source
        shell: bash
        run: npm ci

      - name: Verify TypeScript and release metadata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node - <<'NODE'
          const app = require('./app.json').expo;
          if (app.ios.bundleIdentifier !== 'de.kamilunavo.waermetakt') throw new Error('Wrong bundle identifier');
          if (app.version !== '1.0.0') throw new Error('Wrong marketing version');
          if (app.ios.infoPlist?.ITSAppUsesNonExemptEncryption !== false) throw new Error('Export compliance flag missing');
          NODE
          grep -q "de.kamilunavo.waermetakt.pro" src/useProPurchase.ts
          test -f assets/icon.png

      - name: Generate native iOS project
        working-directory: source
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          cd ios
          pod install --repo-update

      - name: Resolve Xcode workspace and scheme
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          jq -e --arg scheme "$SCHEME" '.workspace.schemes | index($scheme) != null' "$RUNNER_TEMP/xcode-list.json" >/dev/null
          echo "XCODE_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using workspace $WORKSPACE and scheme $SCHEME"

      - name: Build iOS simulator release gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -workspace "$XCODE_WORKSPACE"             -scheme "$XCODE_SCHEME"             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify Apple app record
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b(raw)}"
          RUBY
          )
          APPS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $JWT"             --data-urlencode "filter[bundleId]=$BUNDLE_ID"             --data-urlencode 'limit=10'             'https://api.appstoreconnect.apple.com/v1/apps')
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          test "$APP_ID" = '6806348716'
          echo "ASC_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Create unsigned archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/WaermeTakt.xcarchive"
          rm -rf "$ARCHIVE"
          xcodebuild             -workspace "$XCODE_WORKSPACE"             -scheme "$XCODE_SCHEME"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$ARCHIVE"             DEVELOPMENT_TEAM="$TEAM_ID"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             MARKETING_VERSION="$APP_VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             archive
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$BUILD_NUMBER"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create App Store export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Cloud-sign IPA
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/TestFlightExport"
          rm -rf "$EXPORT_PATH"
          xcodebuild             -exportArchive             -archivePath "$ARCHIVE"             -exportPath "$EXPORT_PATH"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"             2>&1 | tee "$RUNNER_TEMP/export.log"
          IPA=$(find "$EXPORT_PATH" -maxdepth 2 -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          test -s "$IPA"
          echo "SIGNED_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Verify distribution signature
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/SignedPayload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          unzip -q "$SIGNED_IPA" -d "$PAYLOAD"
          APP=$(find "$PAYLOAD/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          grep -q '^Authority=Apple Distribution' < <(codesign -dvv "$APP" 2>&1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx "$BUNDLE_ID"

      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios -f "$SIGNED_IPA"             --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"             2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Confirm TestFlight receipt
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v, padding: false); end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          h = b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p = b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'}))
          input = "#{h}.#{p}"
          seq = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,input))
          raw = seq.value.map { |i| [i.value.to_i.to_s(16).rjust(64,'0')].pack('H*') }.join
          puts "#{input}.#{b(raw)}"
          RUBY
          )
            BUILDS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $JWT"               --data-urlencode "filter[app]=$ASC_APP_ID"               --data-urlencode "filter[version]=$BUILD_NUMBER"               --data-urlencode 'sort=-uploadedDate'               --data-urlencode 'limit=10'               --data-urlencode 'fields[builds]=version,uploadedDate,processingState'               'https://api.appstoreconnect.apple.com/v1/builds')
            if test "$(jq '.data | length' <<<"$BUILDS")" -gt 0; then
              STATE=$(jq -r '.data[0].attributes.processingState // "UNKNOWN"' <<<"$BUILDS")
              echo "WärmeTakt $APP_VERSION ($BUILD_NUMBER) reached TestFlight: $STATE"
              exit 0
            fi
            sleep 10
          done
          echo 'Upload accepted, but the build is not visible through the API yet.'
          exit 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waermetakt-testflight-diagnostics-${{ env.BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove App Store Connect key
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
