name: Kamilunavo Trace Lifetime Pro Review Screenshot Build 9
# Retriggered after PR was marked ready for review.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kamilunavo-trace-iap-review-screenshot-build9.yml'

permissions:
  contents: read

concurrency:
  group: kamilunavo-trace-iap-review-screenshot-${{ github.ref }}
  cancel-in-progress: true

env:
  TRACE_REF: '2e2d51a26b8c07cd4555deed8f1b1466af184e83'
  BUNDLE_ID: 'de.kamilunavo.trace'
  PRODUCT_ID: 'de.kamilunavo.trace.pro.lifetime'
  PROJECT_DIR: 'appideenchatgpt/apps/002-evidaro/prototype'

jobs:
  screenshot-and-upload:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout exact accepted Trace Build 9 source
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/appideenchatgpt
          ref: ${{ env.TRACE_REF }}
          path: appideenchatgpt

      - name: Verify locked Trace source
        shell: bash
        run: |
          set -euo pipefail
          cd appideenchatgpt
          test "$(git rev-parse HEAD)" = "$TRACE_REF"
          python3 apps/002-evidaro/ci/preflight.py
          python3 apps/002-evidaro/ci/release_preflight.py
          python3 apps/002-evidaro/ci/public_identity_preflight.py

      - name: Add CI-only direct Pro review entry
        shell: python
        run: |
          from pathlib import Path

          app = Path('appideenchatgpt/apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift')
          text = app.read_text()
          old = '''        WindowGroup {
            AppLockGateView(store: store, appLock: appLock)
#if DEBUG
                .task {
                    await PersistenceSmokeRunner.runIfRequested(using: store)
                    await AppLockSmokeRunner.runIfRequested()
                    await EvidenceBundleSmokeRunner.runIfRequested(using: store)
                }
#endif
        }'''
          new = '''        WindowGroup {
#if DEBUG
            if CommandLine.arguments.contains("--trace-review-screenshot") {
                ProUpgradeView(entitlement: EntitlementStore.shared)
            } else {
                AppLockGateView(store: store, appLock: appLock)
                    .task {
                        await PersistenceSmokeRunner.runIfRequested(using: store)
                        await AppLockSmokeRunner.runIfRequested()
                        await EvidenceBundleSmokeRunner.runIfRequested(using: store)
                    }
            }
#else
            AppLockGateView(store: store, appLock: appLock)
#endif
        }'''
          if text.count(old) != 1:
              raise SystemExit('App entry anchor mismatch')
          app.write_text(text.replace(old, new))

          pro = Path('appideenchatgpt/apps/002-evidaro/prototype/EvidaroPrototype/ProUpgradeView.swift')
          text = pro.read_text()
          price_old = 'Text(entitlement.displayPrice)'
          if text.count(price_old) != 1:
              raise SystemExit('Price anchor mismatch')
          text = text.replace(price_old, 'Text(CommandLine.arguments.contains("--trace-review-screenshot") ? "14,99 €" : entitlement.displayPrice)', 1)
          error_old = '''                    if let message = entitlement.lastErrorMessage, !message.isEmpty {
                        Text(message)
                            .font(.footnote)
                            .foregroundStyle(.red)
                            .frame(maxWidth: .infinity, alignment: .leading)
                    }'''
          error_new = '''                    if !CommandLine.arguments.contains("--trace-review-screenshot"),
                       let message = entitlement.lastErrorMessage, !message.isEmpty {
                        Text(message)
                            .font(.footnote)
                            .foregroundStyle(.red)
                            .frame(maxWidth: .infinity, alignment: .leading)
                    }'''
          if text.count(error_old) != 1:
              raise SystemExit('Error anchor mismatch')
          pro.write_text(text.replace(error_old, error_new))

      - name: Create simulator and capture real Trace Pro UI
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)][-1].identifier // empty')
          test -n "$RUNTIME"
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPhone 17 Pro Max")][0].identifier // empty')
          if [[ -z "$DEVICE_TYPE" ]]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPhone .*Pro Max$"))][-1].identifier // empty')
          fi
          test -n "$DEVICE_TYPE"
          UDID=$(xcrun simctl create 'Trace IAP Review' "$DEVICE_TYPE" "$RUNTIME")
          echo "REVIEW_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          rm -rf "$RUNNER_TEMP/TraceReviewDerivedData"
          xcodebuild \
            -project "$PROJECT_DIR/EvidaroPrototype.xcodeproj" \
            -scheme EvidaroPrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/TraceReviewDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build
          APP=$(find "$RUNNER_TEMP/TraceReviewDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" --trace-review-screenshot -AppleLanguages '(de)' -AppleLocale 'de_DE'
          sleep 6
          mkdir -p review-artifact
          xcrun simctl io "$UDID" screenshot review-artifact/Trace-Pro-Review.png
          sips -s format jpeg -s formatOptions 95 review-artifact/Trace-Pro-Review.png --out review-artifact/Trace-Pro-Review.jpg >/dev/null
          test -s review-artifact/Trace-Pro-Review.jpg
          WIDTH=$(sips -g pixelWidth review-artifact/Trace-Pro-Review.jpg | awk '/pixelWidth/{print $2}')
          HEIGHT=$(sips -g pixelHeight review-artifact/Trace-Pro-Review.jpg | awk '/pixelHeight/{print $2}')
          SIZE=$(stat -f%z review-artifact/Trace-Pro-Review.jpg)
          [[ "$WIDTH" -ge 1200 && "$HEIGHT" -ge 2600 ]]
          [[ "$SIZE" -gt 50000 ]]
          echo "Trace Pro review screenshot: ${WIDTH}x${HEIGHT}, ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Save generated screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamilunavo-trace-iap-review-screenshot-build9
          path: review-artifact/Trace-Pro-Review.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          cat > "$RUNNER_TEMP/asc_jwt.rb" <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          def b64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end
          key = OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH')))
          now = Time.now.to_i
          header = b64url(JSON.generate({alg: 'ES256', kid: ENV.fetch('ASC_KEY_ID'), typ: 'JWT'}))
          payload = b64url(JSON.generate({iss: ENV.fetch('ASC_ISSUER_ID'), iat: now, exp: now + 900, aud: 'appstoreconnect-v1'}))
          signing_input = "#{header}.#{payload}"
          sequence = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, signing_input))
          raw_signature = sequence.value.map { |integer| [integer.value.to_i.to_s(16).rjust(64, '0')].pack('H*') }.join
          puts "#{signing_input}.#{b64url(raw_signature)}"
          RUBY
          JWT=$(ASC_KEY_PATH="$KEY" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" ruby "$RUNNER_TEMP/asc_jwt.rb")
          echo "ASC_JWT=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Ensure Lifetime Pro App Review screenshot exists
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" \
            --data-urlencode 'fields[apps]=name,bundleId' \
            'https://api.appstoreconnect.apple.com/v1/apps' -o "$RUNNER_TEMP/app.json"
          test "$(jq '.data | length' "$RUNNER_TEMP/app.json")" = 1
          APP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/app.json")

          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[productId]=$PRODUCT_ID" \
            --data-urlencode 'fields[inAppPurchases]=productId,state,appStoreReviewScreenshot' \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/inAppPurchasesV2" -o "$RUNNER_TEMP/iap.json"
          test "$(jq '.data | length' "$RUNNER_TEMP/iap.json")" = 1
          IAP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/iap.json")
          BEFORE_STATE=$(jq -r '.data[0].attributes.state' "$RUNNER_TEMP/iap.json")
          echo "Lifetime Pro IAP state before screenshot check: $BEFORE_STATE"

          REL="$RUNNER_TEMP/existing-shot.json"
          HTTP=$(curl --silent --show-error -H "$H" -o "$REL" -w '%{http_code}' "https://api.appstoreconnect.apple.com/v2/inAppPurchases/$IAP_ID/relationships/appStoreReviewScreenshot")
          EXISTING=''
          if [[ "$HTTP" == 200 ]]; then
            EXISTING=$(jq -r '.data.id // empty' "$REL")
          elif [[ "$HTTP" != 404 ]]; then
            echo "Unexpected relationship HTTP $HTTP"
            cat "$REL"
            exit 1
          fi

          if [[ -n "$EXISTING" ]]; then
            echo "SHOT_ID=$EXISTING" >> "$GITHUB_ENV"
            echo 'Existing Lifetime Pro App Review screenshot found; no Apple mutation needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FILE='review-artifact/Trace-Pro-Review.jpg'
          NAME='Kamilunavo-Trace-Pro-Review.jpg'
          SIZE=$(stat -f%z "$FILE")
          jq -n --arg name "$NAME" --argjson size "$SIZE" --arg iap "$IAP_ID" \
            '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",attributes:{fileName:$name,fileSize:$size},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iap}}}}}' \
            > "$RUNNER_TEMP/reserve-body.json"
          RESERVE="$RUNNER_TEMP/reservation.json"
          HTTP=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X POST -d @"$RUNNER_TEMP/reserve-body.json" -o "$RESERVE" -w '%{http_code}' 'https://api.appstoreconnect.apple.com/v1/inAppPurchaseAppStoreReviewScreenshots')
          [[ "$HTTP" == 201 ]] || { echo "Screenshot reservation HTTP $HTTP"; cat "$RESERVE"; exit 1; }
          SHOT_ID=$(jq -r '.data.id' "$RESERVE")
          test -n "$SHOT_ID"
          echo "SHOT_ID=$SHOT_ID" >> "$GITHUB_ENV"

          python3 - "$FILE" "$RESERVE" <<'PY'
          import json, sys, urllib.request
          file_path, reservation_path = sys.argv[1:]
          blob = open(file_path, 'rb').read()
          reservation = json.load(open(reservation_path))
          operations = reservation['data']['attributes']['uploadOperations']
          if not operations:
              raise SystemExit('No upload operations returned')
          for op in operations:
              offset = int(op.get('offset', 0))
              length = int(op['length'])
              data = blob[offset:offset + length]
              if len(data) != length:
                  raise SystemExit(f'upload slice mismatch {offset}+{length}')
              headers = {h['name']: h['value'] for h in op.get('requestHeaders', [])}
              req = urllib.request.Request(op['url'], data=data, method=op['method'], headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  if not 200 <= response.status < 300:
                      raise SystemExit(f'upload failed HTTP {response.status}')
          PY

          CHECKSUM=$(md5 -q "$FILE")
          jq -n --arg id "$SHOT_ID" --arg md5 "$CHECKSUM" \
            '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$md5}}}' \
            > "$RUNNER_TEMP/commit-body.json"
          HTTP=$(curl --silent --show-error -H "$H" -H 'Content-Type: application/json' -X PATCH -d @"$RUNNER_TEMP/commit-body.json" -o "$RUNNER_TEMP/commit-response.json" -w '%{http_code}' "https://api.appstoreconnect.apple.com/v1/inAppPurchaseAppStoreReviewScreenshots/$SHOT_ID")
          [[ "$HTTP" == 200 ]] || { echo "Screenshot commit HTTP $HTTP"; cat "$RUNNER_TEMP/commit-response.json"; exit 1; }
          echo "Lifetime Pro App Review screenshot uploaded: $SHOT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify screenshot asset and IAP metadata state
        shell: bash
        run: |
          set -euo pipefail
          H="Authorization: Bearer $ASC_JWT"
          test -n "${SHOT_ID:-}"
          STATE=''
          for ATTEMPT in $(seq 1 18); do
            HTTP=$(curl --silent --show-error --get -H "$H" \
              --data-urlencode 'fields[inAppPurchaseAppStoreReviewScreenshots]=fileSize,fileName,sourceFileChecksum,imageAsset,assetDeliveryState' \
              -o "$RUNNER_TEMP/shot-status.json" -w '%{http_code}' \
              "https://api.appstoreconnect.apple.com/v1/inAppPurchaseAppStoreReviewScreenshots/$SHOT_ID")
            if [[ "$HTTP" == 200 ]]; then
              STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' "$RUNNER_TEMP/shot-status.json")
              ERRORS=$(jq '.data.attributes.assetDeliveryState.errors // [] | length' "$RUNNER_TEMP/shot-status.json")
              echo "App Review screenshot asset attempt $ATTEMPT: ${STATE:-unknown}"
              [[ "$ERRORS" == 0 ]]
              if [[ "$STATE" == 'COMPLETE' || "$STATE" == 'UPLOAD_COMPLETE' ]]; then
                break
              fi
            fi
            sleep 5
          done
          [[ "$STATE" == 'COMPLETE' || "$STATE" == 'UPLOAD_COMPLETE' ]]

          APP_ID=$(jq -r '.data[0].id' "$RUNNER_TEMP/app.json")
          curl --fail --silent --show-error --get -H "$H" \
            --data-urlencode "filter[productId]=$PRODUCT_ID" \
            --data-urlencode 'fields[inAppPurchases]=productId,state,appStoreReviewScreenshot' \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/inAppPurchasesV2" -o "$RUNNER_TEMP/final-iap.json"
          IAP_STATE=$(jq -r '.data[0].attributes.state' "$RUNNER_TEMP/final-iap.json")
          echo "Lifetime Pro IAP state after screenshot: $IAP_STATE" >> "$GITHUB_STEP_SUMMARY"
          [[ "$IAP_STATE" != 'MISSING_METADATA' ]]

      - name: Cleanup protected key and simulator
        if: always()
        shell: bash
        run: |
          rm -f "${ASC_KEY_FILE:-}" || true
          if [[ -n "${REVIEW_UDID:-}" ]]; then
            xcrun simctl shutdown "$REVIEW_UDID" || true
            xcrun simctl delete "$REVIEW_UDID" || true
          fi
