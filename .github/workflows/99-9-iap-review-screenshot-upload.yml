name: 99.9 IAP Review Screenshot Upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-iap-review-screenshot-upload.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  BUNDLE_ID: de.kamilunavo.ninenine
  NINENINE_REF: ops/iap-review-assets

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"pending",description:"Uploading 99.9 IAP review screenshots",target_url:$u,context:"99-9/iap-review-screenshots"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Checkout private 99.9 review assets
        uses: actions/checkout@v5
        with:
          repository: acciento89-bot/99-9
          ref: ${{ env.NINENINE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: ninenine
          persist-credentials: false

      - name: Validate review screenshots
        shell: bash
        run: |
          set -euo pipefail
          for f in neon gold aurora; do
            p="ninenine/ops/iap-review/${f}_review.jpg"
            test -s "$p"
            file "$p"
          done

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Upload and commit IAP review screenshots
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          APPS=$(curl -fsSL -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS"); test -n "$APP_ID"
          PRODUCTS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")

          upload_one() {
            local sku="$1" path="$2" iid current oldid size filename body reserve sid checksum patch state
            iid=$(jq -r --arg sku "$sku" '.data[]? | select(.attributes.productId==$sku) | .id' <<<"$PRODUCTS" | head -1)
            test -n "$iid"
            echo "=== $sku / $iid ==="

            current=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$iid/appStoreReviewScreenshot")
            oldid=$(jq -r '.data.id // empty' <<<"$current")
            if [[ -n "$oldid" ]]; then
              echo "Existing screenshot reservation $oldid found; deleting before replacement"
              curl --fail-with-body -sS -X DELETE -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchaseAppStoreReviewScreenshots/$oldid" >/dev/null
            fi

            size=$(stat -c%s "$path")
            filename=$(basename "$path")
            body=$(jq -n --arg iid "$iid" --arg fn "$filename" --argjson sz "$size" '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",attributes:{fileName:$fn,fileSize:$sz},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iid}}}}}')
            reserve=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' "$API/v1/inAppPurchaseAppStoreReviewScreenshots" -d "$body")
            sid=$(jq -r '.data.id // empty' <<<"$reserve"); test -n "$sid"
            printf '%s' "$reserve" > "$RUNNER_TEMP/reserve-$sid.json"

            python3 - "$RUNNER_TEMP/reserve-$sid.json" "$path" <<'PY'
          import json, sys, urllib.request
          reserve_path, file_path = sys.argv[1], sys.argv[2]
          with open(reserve_path, 'r', encoding='utf-8') as f: obj=json.load(f)
          with open(file_path, 'rb') as f: data=f.read()
          ops=obj['data']['attributes']['uploadOperations']
          if not ops: raise SystemExit('Apple returned no upload operations')
          for i,op in enumerate(ops,1):
              off=int(op['offset']); length=int(op['length']); chunk=data[off:off+length]
              if len(chunk)!=length: raise SystemExit(f'chunk length mismatch {i}')
              req=urllib.request.Request(op['url'], data=chunk, method=op.get('method','PUT'))
              for h in op.get('requestHeaders',[]): req.add_header(h['name'], h['value'])
              with urllib.request.urlopen(req, timeout=120) as r:
                  if not 200 <= r.status < 300: raise SystemExit(f'upload op {i} HTTP {r.status}')
              print(f'uploaded part {i}/{len(ops)} offset={off} length={length}')
          PY

            checksum=$(md5sum "$path" | awk '{print $1}')
            patch=$(jq -n --arg id "$sid" --arg md5 "$checksum" '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$md5}}}')
            curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' "$API/v1/inAppPurchaseAppStoreReviewScreenshots/$sid" -d "$patch" >/dev/null

            for i in $(seq 1 30); do
              current=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchaseAppStoreReviewScreenshots/$sid")
              state=$(jq -r '.data.attributes.assetDeliveryState.state // "UNKNOWN"' <<<"$current")
              echo "asset state: $state"
              case "$state" in
                COMPLETE|UPLOAD_COMPLETE) break ;;
                FAILED) echo "$current" | jq .; return 1 ;;
              esac
              sleep 3
            done
            current=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchaseAppStoreReviewScreenshots/$sid")
            jq -e '.data.attributes.fileName != null' >/dev/null <<<"$current"
            echo "$sku screenshot committed as $sid"
          }

          upload_one 'de.kamilunavo.ninenine.theme.neon'   'ninenine/ops/iap-review/neon_review.jpg'
          upload_one 'de.kamilunavo.ninenine.theme.gold'   'ninenine/ops/iap-review/gold_review.jpg'
          upload_one 'de.kamilunavo.ninenine.theme.aurora' 'ninenine/ops/iap-review/aurora_review.jpg'

      - name: Verify Apple IAP metadata state
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.appstoreconnect.apple.com'
          APPS=$(curl -fsSL -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" "$API/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          for n in $(seq 1 24); do
            PRODUCTS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")
            STATES=$(jq -r '[.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | (.attributes.productId + "=" + .attributes.state)] | join("\n")' <<<"$PRODUCTS")
            echo "$STATES"
            MISSING=$(jq '[.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | select(.attributes.state=="MISSING_METADATA")] | length' <<<"$PRODUCTS")
            [[ "$MISSING" -eq 0 ]] && break
            sleep 5
          done
          PRODUCTS=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")
          jq -c '.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | {productId:.attributes.productId,state:.attributes.state}' <<<"$PRODUCTS" | tee -a "$GITHUB_STEP_SUMMARY"
          for iid in $(jq -r '.data[]? | select(.attributes.productId | startswith("de.kamilunavo.ninenine.theme.")) | .id' <<<"$PRODUCTS"); do
            S=$(curl -fsSL -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$iid/appStoreReviewScreenshot")
            jq -e '.data.id != null and .data.attributes.fileName != null' >/dev/null <<<"$S"
          done

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"success",description:"99.9 IAP review screenshots uploaded",target_url:$u,context:"99-9/iap-review-screenshots"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"failure",description:"99.9 IAP review screenshot upload failed",target_url:$u,context:"99-9/iap-review-screenshots"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
