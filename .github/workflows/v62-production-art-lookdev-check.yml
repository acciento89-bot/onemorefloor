name: v1.49 Production Art Lookdev Check

on:
  push:
    branches:
      - main
      - agent/**
    paths:
      - 'scripts/main_v62.gd'
      - 'scripts/world3d_chamber_v149.gd'
      - 'scripts/world3d_actor_factory_v149.gd'
      - 'scripts/world3d_asset_quality_v149.gd'
      - 'scripts/v62_production_art_lookdev_smoke_test.gd'
      - 'scenes/main.tscn'
      - 'docs/v1.49-production-art-lookdev.md'
      - '.github/workflows/v62-production-art-lookdev-check.yml'
  pull_request:
    paths:
      - 'scripts/main_v62.gd'
      - 'scripts/world3d_chamber_v149.gd'
      - 'scripts/world3d_actor_factory_v149.gd'
      - 'scripts/world3d_asset_quality_v149.gd'
      - 'scripts/v62_production_art_lookdev_smoke_test.gd'
      - 'scenes/main.tscn'
      - 'docs/v1.49-production-art-lookdev.md'
      - '.github/workflows/v62-production-art-lookdev-check.yml'

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.1-stable'

jobs:
  production-art-lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT="$RUNNER_TEMP/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Parse production art runtime
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Run production art lookdev smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v62_production_art_lookdev_smoke_test.gd
