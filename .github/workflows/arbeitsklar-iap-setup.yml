name: ArbeitsKlar Pro IAP Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arbeitsklar-iap-setup.yml'
      - '.github/assets/arbeitsklar-pro-review.png'

permissions:
  contents: read

env:
  BUNDLE_ID: de.kamilunavo.arbeitsklar
  PRODUCT_ID: de.kamilunavo.arbeitsklar.pro.lifetime
  TARGET_PRICE: '3.99'
  BASE_TERRITORY: DEU

jobs:
  configure:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          export ASC_KEY_PATH="$KEY"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Create Pro lifetime product
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          APPS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode limit=10 "$API/v1/apps")
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS"); test -n "$APP_ID"
          PRODUCTS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/apps/$APP_ID/inAppPurchasesV2?limit=200")
          IAP_ID=$(jq -r --arg sku "$PRODUCT_ID" '.data[]? | select(.attributes.productId==$sku) | .id' <<<"$PRODUCTS" | head -1)
          if [[ -z "$IAP_ID" ]]; then
            BODY=$(jq -n --arg app "$APP_ID" --arg sku "$PRODUCT_ID" '{data:{type:"inAppPurchases",attributes:{name:"ArbeitsKlar Pro Lifetime",productId:$sku,inAppPurchaseType:"NON_CONSUMABLE",reviewNote:"One-time purchase that permanently unlocks analytics, shift editing, CSV export, payslip checks, premium themes and shift-end reminders."},relationships:{app:{data:{type:"apps",id:$app}}}}}')
            CREATED=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v2/inAppPurchases")
            IAP_ID=$(jq -r '.data.id // empty' <<<"$CREATED")
          fi
          test -n "$IAP_ID"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "IAP_ID=$IAP_ID" >> "$GITHUB_ENV"

      - name: Configure worldwide availability
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IAP_ID/inAppPurchaseAvailability")
          if [[ "$CODE" != 200 ]]; then
            TERRITORIES=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/territories?limit=200")
            AVAILABLE=$(jq '[.data[] | {type:"territories",id:.id}]' <<<"$TERRITORIES")
            BODY=$(jq -n --arg iid "$IAP_ID" --argjson territories "$AVAILABLE" '{data:{type:"inAppPurchaseAvailabilities",attributes:{availableInNewTerritories:true},relationships:{availableTerritories:{data:$territories},inAppPurchase:{data:{type:"inAppPurchases",id:$iid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v1/inAppPurchaseAvailabilities" >/dev/null
          fi

      - name: Configure German and English metadata
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          VERSIONS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IAP_ID/versions?limit=50")
          VERSION_ID=$(jq -r '.data[]? | select(.attributes.state=="PREPARE_FOR_SUBMISSION") | .id' <<<"$VERSIONS" | head -1)
          if [[ -z "$VERSION_ID" ]]; then
            BODY=$(jq -n --arg iid "$IAP_ID" '{data:{type:"inAppPurchaseVersions",relationships:{inAppPurchase:{data:{type:"inAppPurchases",id:$iid}}}}}')
            CREATED=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v1/inAppPurchaseVersions")
            VERSION_ID=$(jq -r '.data.id // empty' <<<"$CREATED")
          fi
          test -n "$VERSION_ID"
          LOCS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchaseVersions/$VERSION_ID/localizations?limit=50")
          ensure_loc() {
            local locale="$1" name="$2" description="$3"
            if jq -e --arg locale "$locale" '.data[]? | select(.attributes.locale==$locale)' <<<"$LOCS" >/dev/null; then return; fi
            BODY=$(jq -n --arg vid "$VERSION_ID" --arg locale "$locale" --arg name "$name" --arg description "$description" '{data:{type:"inAppPurchaseLocalizations",attributes:{locale:$locale,name:$name,description:$description},relationships:{version:{data:{type:"inAppPurchaseVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v2/inAppPurchaseLocalizations" >/dev/null
          }
          ensure_loc de-DE 'ArbeitsKlar Pro' 'Alle Pro-Funktionen dauerhaft freischalten.'
          ensure_loc en-US 'ArbeitsKlar Pro' 'Permanently unlock all Pro features.'

      - name: Set EUR 3.99 base price
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          CURRENT=$(curl -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v1/inAppPurchasePriceSchedules/$IAP_ID/manualPrices?filter%5Bterritory%5D=DEU&include=inAppPurchasePricePoint&limit=50" || true)
          HAVE=$(jq -r --arg price "$TARGET_PRICE" '[.included[]? | select(.type=="inAppPurchasePricePoints") | select((.attributes.customerPrice|tostring)==$price)] | length' <<<"${CURRENT:-{}}" 2>/dev/null || true)
          [[ "$HAVE" =~ ^[0-9]+$ ]] || HAVE=0
          if [[ "$HAVE" -eq 0 ]]; then
            POINTS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $ASC_TOKEN" --data-urlencode "filter[territory]=$BASE_TERRITORY" --data-urlencode limit=8000 "$API/v2/inAppPurchases/$IAP_ID/pricePoints")
            POINT_ID=$(jq -r --arg price "$TARGET_PRICE" '.data[]? | select((.attributes.customerPrice|tostring)==$price) | .id' <<<"$POINTS" | head -1); test -n "$POINT_ID"
            PRICE_ID='${price1}'
            BODY=$(jq -n --arg iid "$IAP_ID" --arg pp "$POINT_ID" --arg pid "$PRICE_ID" --arg territory "$BASE_TERRITORY" '{data:{type:"inAppPurchasePriceSchedules",relationships:{inAppPurchase:{data:{type:"inAppPurchases",id:$iid}},baseTerritory:{data:{type:"territories",id:$territory}},manualPrices:{data:[{type:"inAppPurchasePrices",id:$pid}]}}},included:[{type:"inAppPurchasePrices",id:$pid,attributes:{startDate:null},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iid}},inAppPurchasePricePoint:{data:{type:"inAppPurchasePricePoints",id:$pp}}}}]}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v1/inAppPurchasePriceSchedules" >/dev/null
          fi

      - name: Upload IAP review screenshot
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          FILE=.github/assets/arbeitsklar-pro-review.png
          test -s "$FILE"
          CURRENT=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IAP_ID/appStoreReviewScreenshot")
          OLD=$(jq -r '.data.id // empty' <<<"$CURRENT")
          if [[ -n "$OLD" ]]; then
            echo 'IAP review screenshot already exists.'
            exit 0
          fi
          SIZE=$(stat -f%z "$FILE")
          BODY=$(jq -n --arg iid "$IAP_ID" --arg fn "$(basename "$FILE")" --argjson size "$SIZE" '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",attributes:{fileName:$fn,fileSize:$size},relationships:{inAppPurchaseV2:{data:{type:"inAppPurchases",id:$iid}}}}}')
          RESERVED=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$API/v1/inAppPurchaseAppStoreReviewScreenshots")
          SID=$(jq -r '.data.id // empty' <<<"$RESERVED"); test -n "$SID"
          printf '%s' "$RESERVED" > "$RUNNER_TEMP/reserve.json"
          python3 - "$RUNNER_TEMP/reserve.json" "$FILE" <<'PY'
          import json,sys,urllib.request
          obj=json.load(open(sys.argv[1])); data=open(sys.argv[2],'rb').read()
          for op in obj['data']['attributes']['uploadOperations']:
              chunk=data[int(op['offset']):int(op['offset'])+int(op['length'])]
              req=urllib.request.Request(op['url'],data=chunk,method=op.get('method','PUT'))
              for h in op.get('requestHeaders',[]): req.add_header(h['name'],h['value'])
              with urllib.request.urlopen(req,timeout=120) as r: assert 200 <= r.status < 300
          PY
          MD5=$(md5 -q "$FILE")
          PATCH=$(jq -n --arg id "$SID" --arg md5 "$MD5" '{data:{type:"inAppPurchaseAppStoreReviewScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$md5}}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$PATCH" "$API/v1/inAppPurchaseAppStoreReviewScreenshots/$SID" >/dev/null

      - name: Verify product
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.appstoreconnect.apple.com
          for _ in $(seq 1 20); do
            ITEM=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$API/v2/inAppPurchases/$IAP_ID")
            STATE=$(jq -r '.data.attributes.state // "UNKNOWN"' <<<"$ITEM")
            echo "ArbeitsKlar Pro state: $STATE"
            [[ "$STATE" != MISSING_METADATA ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
