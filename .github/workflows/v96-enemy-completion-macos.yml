name: v1.69 Enemy + Boss Visual Completion macOS Review

on:
  push:
    branches:
      - agent/v1.66-character-form
    paths:
      - 'assets/models/enemies/v169/**'
      - 'scripts/world3d_actor_factory_v169_enemy_completion.gd'
      - 'scripts/world3d_chamber_v169_enemy_completion.gd'
      - 'scripts/main_v93.gd'
      - 'scripts/v96_enemy_completion_smoke_test.gd'
      - 'scripts/v96_enemy_completion_capture.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/v96-enemy-completion-macos.yml'
  pull_request:
    paths:
      - 'assets/models/enemies/v169/**'
      - 'scripts/world3d_actor_factory_v169_enemy_completion.gd'
      - 'scripts/world3d_chamber_v169_enemy_completion.gd'
      - 'scripts/main_v93.gd'
      - 'scripts/v96_enemy_completion_smoke_test.gd'
      - 'scripts/v96_enemy_completion_capture.gd'
      - 'scenes/main.tscn'

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.1-stable'

jobs:
  enemy-completion-macos:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1 for macOS
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Compile and import v1.69 authored enemy kits
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee v169-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Shader error|Failed to load script|Failed loading resource|OBJ:.*ERROR" v169-import.log; then
            exit 1
          fi

      - name: Validate enemy and boss completion
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v96_enemy_completion_smoke_test.gd 2>&1 | tee v169-smoke.log
          grep -q "v1.69 enemy and boss visual completion smoke test passed" v169-smoke.log

      - name: Preserve hardened v1.64 material ordering
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/v89_character_lighting_r1_smoke_test.gd

      - name: Render five matched 720x1280 realm pairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/v169_enemy_completion
          "$GODOT" --headless --path . --script res://scripts/v96_enemy_completion_capture.gd 2>&1 | tee v169-capture.log
          test "$(find artifacts/v169_enemy_completion -name '*.png' -type f | wc -l | tr -d ' ')" = "10"

      - name: Preserve complete gameplay authority
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/smoke_test.gd 2>&1 | tee gameplay.log
          grep -q "ONE MORE FLOOR gameplay smoke test passed" gameplay.log

      - name: Upload v1.69 matched visual review
        uses: actions/upload-artifact@v4
        with:
          name: v96-enemy-completion-before-after
          path: artifacts/v169_enemy_completion/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v96-enemy-completion-macos-failure
          path: |
            v169-import.log
            v169-smoke.log
            v169-capture.log
            gameplay.log
          if-no-files-found: ignore
          retention-days: 14
