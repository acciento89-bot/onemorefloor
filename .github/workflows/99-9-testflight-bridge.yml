name: 99.9 TestFlight Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/99-9-testflight-bridge.yml'
      - 'bridge/99-9-testflight.trigger'
  workflow_dispatch:
    inputs:
      build:
        description: 'App Store Connect build number'
        required: false
        default: '8'

permissions:
  contents: read
  statuses: write

env:
  SOURCE_REPO: acciento89-bot/99-9
  SOURCE_REF: f075306e63d63ff3dc4beebac8adabd27c6010cb
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  TEAM_ID: 'TKG684N5GL'
  BUNDLE_ID: 'de.kamilunavo.ninenine'
  APP_VERSION: '1.0.0'

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Check bridge credentials
        id: creds
        env:
          REPO_TOKEN: ${{ secrets.NINENINE_REPO_TOKEN }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REPO_TOKEN" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'reason=missing_repo_token' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_ID" || -z "$ASC_PRIVATE_KEY_B64" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'reason=missing_asc_secrets' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'reason=ready' >> "$GITHUB_OUTPUT"

      - name: Publish blocked status
        if: steps.creds.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.creds.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$REASON" == missing_repo_token ]]; then
            DESC='Add NINENINE_REPO_TOKEN with read-only access to private 99-9'
          else
            DESC='App Store Connect signing secrets are missing'
          fi
          BODY=$(jq -n --arg d "$DESC" --arg u "$U" '{state:"failure",description:$d,target_url:$u,context:"99-9/testflight-bridge"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Stop cleanly while bridge is blocked
        if: steps.creds.outputs.ready != 'true'
        shell: bash
        run: exit 0

      - name: Publish pending status
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg u "$U" '{state:"pending",description:"Building and uploading 99.9% Build 8 to TestFlight",target_url:$u,context:"99-9/testflight-bridge"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Checkout private 99-9 source
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.NINENINE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify locked Build 8 source
        if: steps.creds.outputs.ready == 'true'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          test "$ACTUAL" = "$SOURCE_REF"
          echo "Locked 99.9 source: $ACTUAL"

      - name: Resolve build number
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          BUILD="${REQUESTED_BUILD:-8}"
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          echo "EFFECTIVE_BUILD=$BUILD" >> "$GITHUB_ENV"
          export BUILD
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path('source/export_presets.cfg')
          text=p.read_text()
          build=os.environ['BUILD']
          text,count=re.subn(r'application/version="[0-9]+"',f'application/version="{build}"',text,count=1)
          if count != 1: raise SystemExit('Could not set iOS build number')
          p.write_text(text)
          print(f'iOS build number set to {build}')
          PY

      - name: Prepare App Store Connect API key
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Verify App Store Connect app record exists
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          APPS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[bundleId]=$BUNDLE_ID" --data-urlencode 'limit=10' \
            'https://api.appstoreconnect.apple.com/v1/apps')
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          if [[ -z "$APP_ID" ]]; then
            echo 'App Store Connect app record for de.kamilunavo.ninenine does not exist.'
            exit 1
          fi
          echo "ASC_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 for macOS
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install Godot iOS export template
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f "$T/ios.zip"

      - name: Install AdMob iOS native template
        if: steps.creds.outputs.ready == 'true'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd

      - name: Import project, export Xcode project and verify IAP plus AdMob
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          "$GODOT" --headless --editor --path . --quit
          mkdir -p build/ios
          rm -rf build/ios/NineNine build/ios/NineNine.xcodeproj build/ios/NineNine.xcframework build/ios/MoltenVK.xcframework build/ios/PrivacyInfo.xcprivacy
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj
          test -d addons/godot-iap/bin/ios/GodotIap.framework
          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh
          grep -q 'GodotIap.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          grep -R -q 'ca-app-pub-3940256099942544~1458002511' build/ios
          grep -R -q 'GoogleMobileAds' build/ios
          echo 'GodotIap + AdMob demo App ID + GoogleMobileAds verified in iOS export'
          echo "XCODE_PROJECT=$PWD/build/ios/NineNine.xcodeproj" >> "$GITHUB_ENV"

      - name: Resolve generated Xcode scheme
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode-list.json')).get('project',{})
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY
          )
          test -n "$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Create unsigned Build 8 release archive
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NineNine.xcarchive"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NineNine.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -f "$RUNNER_TEMP/NineNine.xcarchive/Info.plist"
          APP="$RUNNER_TEMP/NineNine.xcarchive/Products/Applications/NineNine.app"
          test -d "$APP"
          test -d "$APP/Frameworks/GoogleMobileAds.framework"
          test -d "$APP/Frameworks/UserMessagingPlatform.framework"
          echo "ARCHIVE_APP=$APP" >> "$GITHUB_ENV"

      - name: Prime embedded frameworks for Apple cloud re-signing
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          while IFS= read -r -d '' FW; do
            echo "Ad-hoc priming: $FW"
            codesign --force --sign - --timestamp=none "$FW"
            codesign --verify --strict --verbose=2 "$FW"
            COUNT=$((COUNT + 1))
          done < <(find "$ARCHIVE_APP/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0)
          while IFS= read -r -d '' DYLIB; do
            echo "Ad-hoc priming: $DYLIB"
            codesign --force --sign - --timestamp=none "$DYLIB"
            codesign --verify --strict --verbose=2 "$DYLIB"
            COUNT=$((COUNT + 1))
          done < <(find "$ARCHIVE_APP/Frameworks" -maxdepth 1 -type f -name '*.dylib' -print0)
          test "$COUNT" -gt 0
          codesign --verify --strict --verbose=2 "$ARCHIVE_APP/Frameworks/GoogleMobileAds.framework"
          codesign --verify --strict --verbose=2 "$ARCHIVE_APP/Frameworks/UserMessagingPlatform.framework"
          echo "Primed $COUNT embedded code objects for cloud distribution re-signing."

      - name: Create TestFlight export options
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Cloud-sign Build 8 IPA
        id: cloudsign
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/TestFlightExport"
          mkdir -p "$RUNNER_TEMP/TestFlightExport"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NineNine.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/testflight-export.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Verify Apple Distribution signatures in exported IPA
        if: steps.cloudsign.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/TestFlightExport" -maxdepth 2 -type f -name '*.ipa' -print -quit)
          test -n "$IPA" -a -s "$IPA"
          rm -rf "$RUNNER_TEMP/SignedPayload"
          mkdir -p "$RUNNER_TEMP/SignedPayload"
          unzip -q "$IPA" -d "$RUNNER_TEMP/SignedPayload"
          SIGNED_APP=$(find "$RUNNER_TEMP/SignedPayload/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$SIGNED_APP" -a -d "$SIGNED_APP"
          for FW in GoogleMobileAds.framework UserMessagingPlatform.framework; do
            P="$SIGNED_APP/Frameworks/$FW"
            test -d "$P"
            codesign --verify --strict --verbose=2 "$P"
            INFO=$(codesign -dvv "$P" 2>&1)
            echo "$INFO"
            grep -q '^Authority=Apple Distribution' <<<"$INFO"
          done
          codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"
          echo "SIGNED_IPA=$IPA" >> "$GITHUB_ENV"
          echo 'GoogleMobileAds and UserMessagingPlatform are Apple Distribution signed.'

      - name: Upload signed Build 8 IPA to TestFlight
        id: upload
        if: steps.cloudsign.outputs.status == '0'
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          xcrun altool --upload-app --type ios -f "$SIGNED_IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Publish final status
        if: always() && steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDSIGN_STATUS: ${{ steps.cloudsign.outputs.status }}
          UPLOAD_STATUS: ${{ steps.upload.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$CLOUDSIGN_STATUS" == 0 && "$UPLOAD_STATUS" == 0 ]]; then
            STATE=success
            DESC="99.9% ${APP_VERSION} (${EFFECTIVE_BUILD}) uploaded to TestFlight"
          elif [[ "$CLOUDSIGN_STATUS" != 0 ]]; then
            STATE=failure
            DESC='99.9% Build 8 cloud distribution signing failed'
          else
            STATE=failure
            DESC='99.9% Build 8 TestFlight upload failed'
          fi
          BODY=$(jq -n --arg s "$STATE" --arg d "$DESC" --arg u "$U" '{state:$s,description:$d,target_url:$u,context:"99-9/testflight-bridge"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$BODY" >/dev/null

      - name: Fail if cloud signing or TestFlight upload failed
        if: always() && steps.creds.outputs.ready == 'true' && (steps.cloudsign.outputs.status != '0' || steps.upload.outputs.status != '0')
        shell: bash
        run: |
          echo "Cloud signing status: ${{ steps.cloudsign.outputs.status }}"
          echo "Upload status: ${{ steps.upload.outputs.status }}"
          exit 1

      - name: Remove App Store Connect key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
