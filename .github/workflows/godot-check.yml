name: Godot Check

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Check critical scripts
        run: |
          ./godot --headless --path . --script res://scripts/progression.gd --check-only
          ./godot --headless --path . --script res://scripts/run_profile.gd --check-only
          ./godot --headless --path . --script res://scripts/loot_system.gd --check-only
          ./godot --headless --path . --script res://scripts/enemy_factory.gd --check-only
          ./godot --headless --path . --script res://scripts/room_system.gd --check-only
          ./godot --headless --path . --script res://scripts/settings_manager.gd --check-only
          ./godot --headless --path . --script res://scripts/telemetry.gd --check-only
          ./godot --headless --path . --script res://scripts/balance_profile.gd --check-only
          ./godot --headless --path . --script res://scripts/release_audio.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v04.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v05.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v06.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v07.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v08.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v09.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v10.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v11.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v12.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v13.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v14.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v15.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v16.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v17.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v22.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v23.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v24.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v25.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v26.gd --check-only
          ./godot --headless --path . --script res://scripts/main_v27.gd --check-only
          ./godot --headless --path . --script res://scripts/deep_tower_smoke_test.gd --check-only
          ./godot --headless --path . --script res://scripts/v23_gameplay_smoke_test.gd --check-only
          ./godot --headless --path . --script res://scripts/v25_gameplay_smoke_test.gd --check-only
          ./godot --headless --path . --script res://scripts/v27_endless_smoke_test.gd --check-only
          ./godot --headless --path . --script res://scripts/v16_smoke_test.gd --check-only
          ./godot --headless --path . --script res://scripts/v17_smoke_test.gd --check-only

      - name: Parse project headlessly
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|ERROR:.*audio|Error.*SVG" parse.log; then
            echo "Godot reported script/resource errors during project parse"
            exit 1
          fi

      - name: Run main scene smoke test
        run: |
          set -o pipefail
          ./godot --headless --path . --quit-after 10 2>&1 | tee main.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" main.log; then
            echo "Godot reported script errors while starting Main"
            exit 1
          fi

      - name: Run gameplay smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/smoke_test.gd --quit-after 120 | tee smoke.log
          grep -q "ONE MORE FLOOR gameplay smoke test passed" smoke.log

      - name: Run Deep Tower gameplay smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/deep_tower_smoke_test.gd --quit-after 120 | tee deep-tower-smoke.log
          grep -q "ONE MORE FLOOR Deep Tower gameplay smoke test passed" deep-tower-smoke.log

      - name: Run Run System 2.0 smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v23_gameplay_smoke_test.gd --quit-after 120 | tee v23-gameplay-smoke.log
          grep -q "ONE MORE FLOOR v1.11 Run System 2.0 smoke test passed" v23-gameplay-smoke.log

      - name: Run v1.13 gameplay depth smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v25_gameplay_smoke_test.gd --quit-after 120 | tee v25-gameplay-smoke.log
          grep -q "ONE MORE FLOOR v1.13 gameplay depth smoke test passed" v25-gameplay-smoke.log

      - name: Run v1.14 endless ascension smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v27_endless_smoke_test.gd --quit-after 120 | tee v27-endless-smoke.log
          grep -q "ONE MORE FLOOR v1.14 endless ascension smoke test passed" v27-endless-smoke.log

      - name: Run v1.0 release smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/release_smoke_test.gd --quit-after 120 | tee release-smoke.log
          grep -q "ONE MORE FLOOR v1.0 release smoke test passed" release-smoke.log

      - name: Run v1.1 visual audio smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v11_smoke_test.gd --quit-after 120 | tee v11-smoke.log
          grep -q "ONE MORE FLOOR v1.1 visual/audio smoke test passed" v11-smoke.log

      - name: Run v1.2 production art smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v12_smoke_test.gd --quit-after 120 | tee v12-smoke.log
          grep -q "ONE MORE FLOOR v1.2 production art smoke test passed" v12-smoke.log

      - name: Run v1.2 rc3 premium art mobile input smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v13_smoke_test.gd --quit-after 120 | tee v13-smoke.log
          grep -q "ONE MORE FLOOR v1.2 rc3 premium art/mobile input smoke test passed" v13-smoke.log

      - name: Run v1.3 high fidelity art smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v14_smoke_test.gd --quit-after 120 | tee v14-smoke.log
          grep -q "ONE MORE FLOOR v1.3 high-fidelity art smoke test passed" v14-smoke.log

      - name: Run v1.4 premium overhaul smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v15_smoke_test.gd --quit-after 120 | tee v15-smoke.log
          grep -q "ONE MORE FLOOR v1.4 premium overhaul smoke test passed" v15-smoke.log

      - name: Run v1.5 final premium menus smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v16_smoke_test.gd --quit-after 120 | tee v16-smoke.log
          grep -q "ONE MORE FLOOR v1.5 final premium menus smoke test passed" v16-smoke.log

      - name: Run v1.6 exact concept menus smoke script
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/v17_smoke_test.gd --quit-after 120 | tee v17-smoke.log
          grep -q "ONE MORE FLOOR v1.6 exact concept menus smoke test passed" v17-smoke.log
